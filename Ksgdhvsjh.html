    '<h3>ಸರ್ವರ್ ಬ್ಯಾಕಪ್</h3>' +
    '<p class="muted small" style="line-height:1.9;">' +
      'ಡೇಟಾವು ಈಗ ಸರ್ವರ್‌ನಲ್ಲಿ (Supabase) ಇರುತ್ತದೆ, ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಅಲ್ಲ. ' +
      'ಮರುಸ್ಥಾಪನೆ ಮತ್ತು ದೈನಂದಿನ ಬ್ಯಾಕಪ್‌ಗಳನ್ನು Supabase ಡ್ಯಾಶ್‌ಬೋರ್ಡ್ ನಿರ್ವಹಿಸುತ್ತದೆ. ' +
      'ಇಲ್ಲಿ ರಫ್ತು ಮಾಡುವ JSON/CSV ಫೈಲ್‌ಗಳು ದಾಖಲೆಗಳ ಪ್ರತಿಗಳು — ಸಂರಕ್ಷಣೆಗಾಗಿ ಬಳಸಿ.' +
    '</p>' +
    '<p class="note" style="margin-top:14px;">ಫೈಲ್ ಆಮದು (ಮರುಸ್ಥಾಪನೆ) ಈ ಆವೃತ್ತಿಯಲ್ಲಿ ಲಭ್ಯವಿಲ್ಲ.</p>' +
  '</div>';
}

/* ============================================================
   SECTION M — SUBMISSION DETAIL MODAL
   ============================================================ */
function viewSubmissionModal(id){
  const s = DB.submissions.find(x => x.id === id);
  if(!s){ toast('ಸಲ್ಲಿಕೆ ಕಂಡುಬಂದಿಲ್ಲ.','error'); return; }
  const t = getTraining(s.trainingId);

  const fbRows = (() => {
    if(!t || !t.feedback || !t.feedback.questions || !t.feedback.questions.length){
      return '<p class="muted small">ಈ ತರಬೇತಿಗೆ ಪ್ರತಿಕ್ರಿಯೆ ಪ್ರಶ್ನೆಗಳು ವ್ಯಾಖ್ಯಾನಿಸಲಾಗಿಲ್ಲ.</p>';
    }
    return t.feedback.questions.map((q, i) => {
      const ans = (s.feedback && s.feedback.answers) ? s.feedback.answers[q.id] : '';
      return '<div style="padding:10px 0;border-bottom:1px solid var(--line-soft);">' +
        '<div class="small strong" style="color:var(--darkblue);">' + (i+1) + '. ' + esc(q.text) + '</div>' +
        '<div class="small" style="margin-top:4px;">' + esc(ans || '—') + '</div>' +
      '</div>';
    }).join('');
  })();

  const ratingsHtml = (() => {
    if(!t || !t.feedback || !t.feedback.sessions || !t.feedback.sessions.length) return '';
    return t.feedback.sessions.map((sess, i) => {
      const r = (s.feedback && s.feedback.ratings) ? s.feedback.ratings[String(i)] : '';
      return '<div class="small" style="padding:5px 0;">' +
        '<b>' + esc(sess.heading) + ':</b> ' + esc(r || '—') + '</div>';
    }).join('');
  })();

  /* The answer key stays on the server (it is never sent to a browser), so
     this modal can only show what the student chose plus the totals the
     marking RPC returned — not a per-question right/wrong tick. */
  const answerRows = (() => {
    if(!t) return '<p class="muted small">ತರಬೇತಿ ಲಭ್ಯವಿಲ್ಲ.</p>';
    return t.questions.map((q, i) => {
      const given = s.answers ? s.answers[q.id] : undefined;
      return '<div style="padding:10px 0;border-bottom:1px solid var(--line-soft);">' +
        '<div class="small strong" style="color:var(--darkblue);">' + (i+1) + '. ' + esc(q.text) + '</div>' +
        '<div class="small" style="margin-top:5px;">ಆಯ್ಕೆ: ' +
          esc(given !== undefined && q.options[given] !== undefined ? q.options[given] : '—') +
        '</div>' +
      '</div>';
    }).join('') +
    '<p class="tiny muted" style="margin-top:8px;line-height:1.8;">' +
      'ಸರಿಯಾದ ಉತ್ತರ ಕೀ ಸರ್ವರ್‌ನಲ್ಲಿ ಮಾತ್ರ ಇರುತ್ತದೆ (ಬ್ರೌಸರ್‌ಗೆ ಕಳುಹಿಸುವುದಿಲ್ಲ), ಆದ್ದರಿಂದ ಪ್ರತಿ ಪ್ರಶ್ನೆಯ ಸರಿ/ತಪ್ಪು ಇಲ್ಲಿ ತೋರಿಸುವುದಿಲ್ಲ. ' +
      'ಒಟ್ಟು ಅಂಕಗಳು ಮೇಲೆ ನಮೂದಿಸಲಾಗಿದೆ.' +
    '</p>';
  })();

  openModal(
    '<div class="card-head" style="margin-bottom:12px;">' +
      '<div><h3 style="margin-bottom:4px;">' + esc(s.details.name || s.userName) + '</h3>' +
      '<div class="small muted">' + esc(s.trainingTitle) + '</div></div>' +
      '<span class="badge ' + (s.result.passed ? 'green' : 'red') + '">' +
        (s.result.passed ? 'ಉತ್ತೀರ್ಣ' : 'ಅನುತ್ತೀರ್ಣ') + '</span>' +
    '</div>' +
    '<div class="card-soft" style="margin-bottom:14px;font-size:13.5px;line-height:2;">' +
      '<div><b>ಇ-ಮೇಲ್:</b> ' + esc(s.details.email || '—') + '</div>' +
      '<div><b>ಕೆ.ಜಿ.ಐ.ಡಿ / HRMS:</b> ' + esc(s.details.kgid || '—') + '</div>' +
      '<div><b>ತರಬೇತಿ ದಿನಾಂಕ:</b> ' + esc(s.trainingDate) + '</div>' +
      '<div><b>ಅಂಕಗಳು:</b> ' + s.result.marks + ' / ' + s.result.total + ' &nbsp;·&nbsp; <b>ಶೇಕಡಾವಾರು:</b> ' + s.result.pct + '%</div>' +
      '<div><b>ಪ್ರಮಾಣಪತ್ರ:</b> ' + (s.certificateNo ? esc(s.certificateNo) : 'ನೀಡಿಲ್ಲ') + '</div>' +
      '<div><b>ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ:</b> ' + esc(fmtDateTime(s.submittedAt)) + '</div>' +
    '</div>' +
    '<h4 style="color:var(--navy);margin-top:16px;">ಅಧಿವೇಶನ ಮೌಲ್ಯಮಾಪನ</h4>' + (ratingsHtml || '<p class="muted small">—</p>') +
    '<h4 style="color:var(--navy);margin-top:16px;">ಪ್ರತಿಕ್ರಿಯೆ ಉತ್ತರಗಳು</h4>' + fbRows +
    '<h4 style="color:var(--navy);margin-top:16px;">ಮೌಲ್ಯಮಾಪನ ಉತ್ತರಗಳು</h4>' + answerRows +
    '<div class="modal-actions">' +
      '<button class="btn btn-ghost" data-action="modal-close">ಮುಚ್ಚಿ</button>' +
    '</div>',
    true
  );
}

/* ============================================================
   SECTION N — EVENT HANDLING
   ============================================================ */
document.addEventListener('click', function(e){
  const overlay = e.target.closest('[data-action="modal-overlay"]');
  if(overlay && e.target === overlay){ closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  switch(action){

    /* ---------- global ---------- */
    case 'modal-close': closeModal(); break;
    case 'modal-overlay': closeModal(); break;
    case 'confirm-yes': {
      const cb = confirmCallback;
      closeModal();
      if(typeof cb === 'function') cb();
      break;
    }
    case 'logout': logout(); break;
    case 'google-signin': signInGoogle(); break;
    case 'sign-out': signOut(); break;
    case 'retry-profile': {
      if(AUTH.user && sb){
        AUTH.gate = 'loading';
        render();
        loadProfileAndPortal();
      }else{
        signOut();
      }
      break;
    }

    case 'open-sidebar': {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if(sb) sb.classList.add('open');
      if(ov) ov.classList.add('show');
      break;
    }
    case 'close-sidebar': {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if(sb) sb.classList.remove('open');
      if(ov) ov.classList.remove('show');
      break;
    }

    /* ---------- student ---------- */
    case 'student-nav': {
      const to = el.getAttribute('data-to');
      const u = currentUser();
      if(!u) break;
      if(to === 'dashboard'){ state.route = 'dashboard'; render(); break; }
      if(to === 'training'){
        const t = DB.trainings[0];
        if(t) openTraining(t.id);
        break;
      }
      if(to === 'result' || to === 'certificate'){
        const sub = DB.submissions.filter(s => s.userId === u.id).slice(-1)[0];
        if(!sub){ toast('ಇನ್ನೂ ಯಾವುದೇ ಮೌಲ್ಯಮಾಪನ ಸಲ್ಲಿಸಿಲ್ಲ.','info'); break; }
        state.trainingId = sub.trainingId;
        state.route = 'workflow';
        if(to === 'result') state.stage = 4;
        else state.stage = sub.result.passed ? 5 : 4;
        state.draft = newDraft(u);
        render();
        break;
      }
      break;
    }
    case 'open-training': {
      const id = el.getAttribute('data-id');
      if(id) openTraining(id);
      break;
    }
    case 'goto-stage': {
      const n = Number(el.getAttribute('data-n'));
      if(!n) break;
      if(!stageAccessible(n)){
        toast('ಈ ಹಂತವು ಇನ್ನೂ ಲಭ್ಯವಿಲ್ಲ. ದಯವಿಟ್ಟು ಹಿಂದಿನ ಹಂತಗಳನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.','info');
        break;
      }
      state.stage = n;
      if(state.draft) state.draft.stage = Math.min(n, 3);
      persistDraft();
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }
    case 'stage-next': {
      const u = currentUser();
      const t = getTraining(state.trainingId);
      if(!u || !t || !state.draft) break;

      if(state.stage === 1){
        const d = state.draft.details || {};
        if(!String(d.email||'').trim()){ showStageMsg('ಇ-ಮೇಲ್ ವಿಳಾಸವನ್ನು ನಮೂದಿಸಿ.','error'); break; }
        if(!isEmail(d.email)){ showStageMsg('ಸರಿಯಾದ ಇ-ಮೇಲ್ ವಿಳಾಸವನ್ನು ನಮೂದಿಸಿ.','error'); break; }
        if(!String(d.name||'').trim()){ showStageMsg('ಹೆಸರನ್ನು ನಮೂದಿಸಿ.','error'); break; }
        if(!String(d.kgid||'').trim()){ showStageMsg('ಕೆ.ಜಿ.ಐ.ಡಿ / ಹೆಚ್ ಆರ್ ಎಂಎಸ್ ಸಂಖ್ಯೆಯನ್ನು ನಮೂದಿಸಿ.','error'); break; }
        state.stage = 2;
        state.draft.stage = 2;
        persistDraft();
        render();
        window.scrollTo({ top:0, behavior:'smooth' });
        break;
      }

      if(state.stage === 2){
        if(!isFeedbackComplete(t)){
          showStageMsg('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ಪ್ರತಿಕ್ರಿಯೆ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.','error');
          toast('ಎಲ್ಲಾ ಪ್ರತಿಕ್ರಿಯೆ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸುವುದು ಕಡ್ಡಾಯ.','error');
          break;
        }
        state.stage = 3;
        state.draft.stage = 3;
        persistDraft();
        render();
        window.scrollTo({ top:0, behavior:'smooth' });
        break;
      }
      break;
    }
    case 'stage-prev': {
      if(state.stage > 1){
        state.stage = state.stage - 1;
        if(state.draft) state.draft.stage = Math.min(state.stage, 3);
        persistDraft();
        render();
        window.scrollTo({ top:0, behavior:'smooth' });
      }
      break;
    }
    case 'submit-assessment': submitAssessment(); break;
    case 'print-cert': {
      const cfg = getActiveCertDesign();
      const aspect = (cfg.design && cfg.design.useCustom && cfg.design.aspect) ? cfg.design.aspect : 1.414;
      setPrintPageOrientation(aspect);
      document.body.classList.add('print-mode');
      window.print();
      setTimeout(()=> document.body.classList.remove('print-mode'), 600);
      break;
    }

    /* ---------- admin nav ---------- */
    case 'admin-nav': {
      state.adminSection = el.getAttribute('data-to') || 'overview';
      state.editing = null;
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }

    /* ---------- admin training CRUD ---------- */
    case 'new-training': {
      state.editing = blankTrainingDraft();
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }
    case 'edit-training': {
      const t = getTraining(el.getAttribute('data-id'));
      if(!t){ toast('ತರಬೇತಿ ಕಂಡುಬಂದಿಲ್ಲ.','error'); break; }
      state.editing = draftFromTraining(t);
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
      break;
    }
    case 'delete-training': {
      const id = el.getAttribute('data-id');
      const t = getTraining(id);
      if(!t) break;
      confirmDialog(
        'ತರಬೇತಿ ಅಳಿಸುವುದೇ?',
        '“' + t.title + '” ತರಬೇತಿಯನ್ನು ಅಳಿಸಲಾಗುತ್ತದೆ. ಇದಕ್ಕೆ ಸಂಬಂಧಿಸಿದ ಸಲ್ಲಿಕೆಗಳು ಮತ್ತು ಪ್ರಮಾಣಪತ್ರ ದಾಖಲೆಗಳು ಉಳಿಯುತ್ತವೆ.',
        function(){
          sb.from('trainings').delete().eq('id', id)
            .then(function(res){
              if(res.error) throw res.error;
              toast('ತರಬೇತಿ ಅಳಿಸಲಾಗಿದೆ.','success');
              return reloadPortalData();
            })
            .catch(function(err){
              console.warn('[training] delete failed', err && (err.message || err.code));
              toast(dataErrorMessage(err), 'error');
            });
        },
        true
      );
      break;
    }
    case 'cancel-edit': {
      state.editing = null;
      render();
      break;
    }
    case 'preview-training': {
      const t = getTraining(el.getAttribute('data-id'));
      if(!t) break;
      openModal(
        '<h3>' + esc(t.title) + '</h3>' +
        '<p class="small" style="line-height:1.9;">“' + esc(t.topic) + '”</p>' +
        '<div class="card-soft small" style="line-height:2;">' +
          '<div><b>ದಿನಾಂಕ:</b> ' + esc(t.date) + '</div>' +
          '<div><b>ಸಂಸ್ಥೆ:</b> ' + esc(t.institute || INSTITUTE) + '</div>' +
          '<div><b>ವರ್ಗ:</b> ' + esc(t.category || '—') + '</div>' +
          '<div><b>ಪ್ರಶ್ನೆಗಳು:</b> ' + t.questions.length + ' &nbsp;·&nbsp; <b>ಉತ್ತೀರ್ಣ ಮಿತಿ:</b> ' + (t.passing||70) + '%</div>' +
        '</div>' +
        '<h4 style="margin-top:16px;color:var(--navy);">ಮೌಲ್ಯಮಾಪನ ಪ್ರಶ್ನೆಗಳು</h4>' +
        t.questions.map((q,i) =>
          '<div style="padding:8px 0;border-bottom:1px solid var(--line-soft);">' +
            '<div class="small strong">' + (i+1) + '. ' + esc(q.text) + '</div>' +
            '<div class="tiny muted" style="margin-top:3px;">' +
              q.options.map((o,j) => 'ABCD'[j] + ') ' + esc(o)).join(' &nbsp;|&nbsp; ') +
            '</div>' +
          '</div>'
        ).join('') +
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-close">ಮುಚ್ಚಿ</button></div>',
        true
      );
      break;
    }
    case 'add-session': {
      if(!state.editing) break;
      if(!state.editing.feedback.sessions) state.editing.feedback.sessions = [];
      state.editing.feedback.sessions.push({ heading:'', topic:'', lecturer:'' });
      render();
      break;
    }
    case 'del-session': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      state.editing.feedback.sessions.splice(i, 1);
      render();
      break;
    }
    case 'add-fbq': {
      if(!state.editing) break;
      if(!state.editing.feedback.questions) state.editing.feedback.questions = [];
      state.editing.feedback.questions.push({
        id: uid('f'), text:'', type:'radio', options:['','']
      });
      render();
      break;
    }
    case 'del-fbq': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      state.editing.feedback.questions.splice(i, 1);
      render();
      break;
    }
    case 'q-add': {
      if(!state.editing) break;
      state.editing.questions.push({ id:uid('q'), text:'', options:['','','',''], correct:0, marks:1 });
      render();
      break;
    }
    case 'q-del': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      if(state.editing.questions.length <= 1){
        toast('ಕನಿಷ್ಠ ಒಂದು ಪ್ರಶ್ನೆ ಅಗತ್ಯ.','error');
        break;
      }
      state.editing.questions.splice(i, 1);
      render();
      break;
    }
    case 'q-up': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      if(i <= 0) break;
      const arr = state.editing.questions;
      const tmp = arr[i-1]; arr[i-1] = arr[i]; arr[i] = tmp;
      render();
      break;
    }
    case 'q-down': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      const arr = state.editing.questions;
      if(i >= arr.length - 1) break;
      const tmp = arr[i+1]; arr[i+1] = arr[i]; arr[i] = tmp;
      render();
      break;
    }
    case 'q-preview': {
      if(!state.editing) break;
      const i = Number(el.getAttribute('data-i'));
      const q = state.editing.questions[i];
      if(!q) break;
      openModal(
        '<h3 style="margin-bottom:14px;">ಮುನ್ನೋಟ — ಪ್ರಶ್ನೆ ' + (i+1) + '</h3>' +
        '<div class="q-card" style="box-shadow:none;">' +
          '<div class="q-head"><div class="q-num">' + (i+1) + '</div>' +
            '<div class="q-text">' + esc(q.text || '(ಪ್ರಶ್ನೆ ಪಠ್ಯ ಖಾಲಿ)') + '</div></div>' +
          '<div class="opt-group">' +
            (q.options||[]).map((o,j) =>
              '<label class="opt"><input type="radio" name="prev' + i + '" value="' + j + '"' +
                (Number(q.correct) === j ? ' checked' : '') + ' disabled>' +
                '<span class="opt-key">' + 'ABCD'[j] + ')</span>' +
                '<span class="opt-text">' + esc(o || '(ಖಾಲಿ)') + '</span></label>'
            ).join('') +
          '</div>' +
        '</div>' +
        '<p class="tiny muted">ಇದು ಶಿಬಿರಾರ್ಥಿಗೆ ಕಾಣುವ ರೀತಿ. ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಗುರುತಿಸಲಾಗಿದೆ (ವಿದ್ಯಾರ್ಥಿಗೆ ಕಾಣುವುದಿಲ್ಲ).' +
          (q.correct === null || q.correct === undefined
            ? ' ಈ ಪ್ರಶ್ನೆಯ ಸರಿಯಾದ ಉತ್ತರ ಈಗಾಗಲೇ ಸರ್ವರ್‌ನಲ್ಲಿ ಉಳಿಸಲಾಗಿದ್ದರೆ ಅದು ಈ ಪರದೆಯಲ್ಲಿ ಕಾಣುವುದಿಲ್ಲ.'
            : '') + '</p>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-close">ಮುಚ್ಚಿ</button></div>'
      );
      break;
    }

    /* ---------- admin data actions ---------- */
    case 'view-submission': viewSubmissionModal(el.getAttribute('data-id')); break;
    case 'export-csv': exportCSV(); break;
    case 'reset-data': {
      confirmDialog(
        'ಈ ಬ್ರೌಸರ್‌ನ ಕ್ಯಾಶೆ ಅಳಿಸುವುದೇ?',
        'ಇದು ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಉಳಿಸಿದ ಕರಡು ಉತ್ತರಗಳು, ಪ್ರಮಾಣಪತ್ರ ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಮತ್ತು ಸ್ಥಳೀಯ ನಕಲನ್ನು ಮಾತ್ರ ಅಳಿಸುತ್ತದೆ. ' +
        'ಸರ್ವರ್‌ನಲ್ಲಿರುವ ತರಬೇತಿಗಳು, ಫಲಿತಾಂಶಗಳು ಮತ್ತು ಪ್ರಮಾಣಪತ್ರಗಳು ಅಳಿಸುವುದಿಲ್ಲ.',
        function(){
          try{
            Object.keys(localStorage).forEach(function(k){
              if(k === STORE_KEY || k === CERT_DESIGN_KEY || k === CERT_BG_KEY ||
                 k === CERT_BG_PATH_KEY || k.indexOf(DRAFT_PREFIX) === 0){
                localStorage.removeItem(k);
              }
            });
          }catch(e){}
          state.editing = null;
          state.adminSection = 'overview';
          reloadPortalData();
          toast('ಸ್ಥಳೀಯ ಕ್ಯಾಶೆ ಅಳಿಸಲಾಗಿದೆ.','success');
        },
        true
      );
      break;
    }

    /* ---------- data backup ---------- */
    case 'backup-export-json': exportBackupJSON(); break;
    case 'backup-csv': exportBackupCSV(el.getAttribute('data-what')); break;
    case 'backup-cert-image': {
      const cfg = getActiveCertDesign();
      if(!cfg.bg){ toast('ಯಾವುದೇ ಪ್ರಮಾಣಪತ್ರ ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಸಂರಕ್ಷಿಸಿಲ್ಲ.', 'info'); break; }
      const a = document.createElement('a');
      a.href = cfg.bg;
      a.download = 'certificate-background.' + (cfg.bg.indexOf('data:image/jpeg') === 0 ? 'jpg' : 'png');
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಡೌನ್‌ಲೋಡ್ ಪ್ರಾರಂಭವಾಗಿದೆ.', 'success');
      break;
    }

    /* ---------- publish / archive ---------- */
    case 'publish-training':   trainingVisibility(el.getAttribute('data-id'), { published:true,  archived:false }); break;
    case 'unpublish-training': trainingVisibility(el.getAttribute('data-id'), { published:false }); break;
    case 'archive-training':   trainingVisibility(el.getAttribute('data-id'), { archived:true, published:false }); break;
    case 'unarchive-training': trainingVisibility(el.getAttribute('data-id'), { archived:false, published:true }); break;

    /* ---------- student accounts ---------- */
    case 'acct-approve': accountAction(el.getAttribute('data-uid'), 'approve'); break;
    case 'acct-reject':  accountAction(el.getAttribute('data-uid'), 'reject');  break;
    case 'acct-disable': accountAction(el.getAttribute('data-uid'), 'disable'); break;
    case 'acct-enable':  accountAction(el.getAttribute('data-uid'), 'enable');  break;
    case 'acct-refresh': refreshStudentAccounts(); break;

    /* ---------- certificate designer ---------- */
    case 'certdes-upload': {
      const inp = document.getElementById('certBgInput');
      if(inp) inp.click();
      break;
    }
    case 'certdes-remove-bg': {
      confirmDialog(
        'Remove background image?',
        'The uploaded certificate image will be cleared. Student records and other data are not affected.',
        function(){ removeCertBackground(); },
        true
      );
      break;
    }
    case 'certdes-add-auto': {
      if(!certDesState.design) break;
      const key = el.getAttribute('data-key');
      certDesState.design.fields.push({
        id: uid('cd'),
        type: 'auto',
        key: key,
        x: 30, y: 40, w: 40,
        fontSize: 3,
        fontFamily: 'kn',
        color: '#14243A',
        align: 'center',
        bold: false
      });
      certDesState.selectedId = certDesState.design.fields[certDesState.design.fields.length - 1].id;
      render();
      break;
    }
    case 'certdes-add-static': {
      if(!certDesState.design) break;
      const inp = document.getElementById('certStaticInput');
      const txt = inp ? String(inp.value || '').trim() : '';
      if(!txt){ toast('Type some text first.','error'); break; }
      certDesState.design.fields.push({
        id: uid('cd'),
        type: 'static',
        text: txt,
        x: 20, y: 55, w: 60,
        fontSize: 2.6,
        fontFamily: 'kn',
        color: '#14243A',
        align: 'center',
        bold: false
      });
      certDesState.selectedId = certDesState.design.fields[certDesState.design.fields.length - 1].id;
      render();
      break;
    }
    case 'certdes-del': {
      if(!certDesState.design) break;
      const id = el.getAttribute('data-id');
      certDesState.design.fields = certDesState.design.fields.filter(f => f.id !== id);
      if(certDesState.selectedId === id) certDesState.selectedId = null;
      render();
      break;
    }
    case 'certdes-save': {
      if(!certDesState.design) break;
      const chk = document.getElementById('certUseCustom');
      if(chk) certDesState.design.useCustom = chk.checked;
      persistCertDesign();
      break;
    }
    case 'certdes-reset': {
      confirmDialog(
        'Reset to default certificate?',
        'The custom design and background will be cleared. Student records, assessments, and results will NOT be affected.',
        function(){
          resetCertDesign().then(function(){ render(); });
        },
        true
      );
      break;
    }
  }
});

/* ---------- Certificate designer: drag/resize ---------- */
document.addEventListener('pointerdown', function(e){
  if(!certDesState.design) return;
  const handle = e.target.closest('.cd-handle');
  const fieldEl = e.target.closest('.certdes-field');
  if(!fieldEl) return;
  e.preventDefault();
  const id = fieldEl.getAttribute('data-cd-id');
  const field = certDesState.design.fields.find(f => f.id === id);
  if(!field) return;

  if(certDesState.selectedId !== id) selectCertField(id);

  const canvas = fieldEl.closest('.certdes-canvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();

  if(handle){
    certDesState.dragging = { mode:'resize', id:id, startX:e.clientX, startW:Number(field.w)||30, rectW:rect.width };
  } else {
    certDesState.dragging = {
      mode:'drag', id:id,
      startX:e.clientX, startY:e.clientY,
      startXpct:Number(field.x)||0, startYpct:Number(field.y)||0,
      rectW:rect.width, rectH:rect.height
    };
  }
});

document.addEventListener('pointermove', function(e){
  const d = certDesState.dragging;
  if(!d || !certDesState.design) return;
  const field = certDesState.design.fields.find(f => f.id === d.id);
  if(!field) return;
  e.preventDefault();
  const dxPct = ((e.clientX - d.startX) / d.rectW) * 100;
  if(d.mode === 'drag'){
    const dyPct = ((e.clientY - d.startY) / d.rectH) * 100;
    field.x = Math.max(0, Math.min(100, d.startXpct + dxPct));
    field.y = Math.max(0, Math.min(100, d.startYpct + dyPct));
  } else {
    field.w = Math.max(5, Math.min(100 - (Number(field.x)||0), d.startW + dxPct));
  }
  updateEditorField(field);
  syncCertFieldPanel(field);
});

document.addEventListener('pointerup', function(){
  if(certDesState.dragging) certDesState.dragging = null;
});
document.addEventListener('pointercancel', function(){
  if(certDesState.dragging) certDesState.dragging = null;
});

/* ---------- Certificate designer: file input ---------- */
document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'certBgInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!/^image\/(png|jpeg|jpg)$/.test(file.type)){
      toast('Please choose a PNG or JPG image.','error');
      return;
    }
    if(file.size > 5 * 1024 * 1024){
      toast('Image is too large (max 5MB). Please use a smaller file.','error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(ev){
      const dataUrl = String(ev.target.result || '');
      /* Preview immediately. The file is only buffered here — "Save & Apply"
         uploads it to the private bucket and writes certificate_design, so a
         closed tab never leaves a half-saved design behind. */
      certDesState.bg = dataUrl;
      if(!certDesState.design) certDesState.design = defaultCertDesign();
      render();
      toast('Image ready — press "Save & Apply" to upload it.', 'info');

      /* the aspect ratio is a nicety: if the size cannot be read, the
         current ratio is kept and the upload still works */
      const img = new Image();
      img.onload = function(){
        if(certDesState.bg !== dataUrl) return;
        const ratio = img.naturalWidth / img.naturalHeight;
        if(isFinite(ratio) && ratio > 0){
          certDesState.design.aspect = +ratio.toFixed(3);
          render();
        }
      };
      img.onerror = function(){ /* keep the current aspect */ };
      img.src = dataUrl;
    };
    reader.onerror = function(){ toast('Could not read that file.','error'); };
    reader.readAsDataURL(file);
  }
});

/* ---------- Form submissions ---------- */
document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');

  if(kind === 'profile'){
    saveProfileDetails(form);
    return;
  }

  if(kind === 'training'){
    saveTraining();
    return;
  }
});

/* ---------- Radio group visual state ---------- */
document.addEventListener('change', function(e){
  const t = e.target;
  if(t && t.type === 'radio'){
    /* assessment option styling */
    const grp = t.closest('.opt-group');
    if(grp){
      $$('.opt', grp).forEach(o => o.classList.toggle('selected', !!o.querySelector('input:checked')));
    }
    /* generic feedback radio -> store answer.
       This document-level handler is the fallback: the per-element binding
       in bindPostRender() only covers whatever was in the DOM at that
       moment, so a control rendered or re-rendered later saved nothing
       while still *looking* selected. Delegation here catches both. */
    const fbGroup = t.getAttribute('data-fbgroup');
    if(fbGroup && state.draft){
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.answers) state.draft.feedback.answers = {};
      state.draft.feedback.answers[fbGroup] = t.value;
      persistDraft();
    }
  }
});

/* ---------- Init ---------- */
function init(){
  /* Nothing is stored locally any more except the in-progress draft and a
     cached certificate background. bootAuth() restores the Supabase session
     (the OAuth redirect lands here), then the gate decides what to draw. */
  DB = emptyDB();
  render();          /* shows the loading card straight away */
  bootAuth();
}
init();

})();
</script>
