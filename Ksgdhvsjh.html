<style>
/* ============================================================
   1. DESIGN TOKENS
   ============================================================ */
:root{
  --navy:#14243A;
  --darkblue:#1D3557;
  --ivory:#F7F5EF;
  --white:#FFFFFF;
  --gold:#C5A46D;
  --grey:#64748B;
  --lightblue:#EAF0F7;
  --green:#21845B;
  --red:#C24141;

  --ink:#1B2534;
  --line:#E3E0D6;
  --line-soft:#EDEAE1;
  --line-cool:#DCE3EC;

  --radius:14px;
  --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,36,58,.05), 0 10px 28px rgba(20,36,58,.06);
  --shadow-sm:0 1px 2px rgba(20,36,58,.06);

  --font:'Noto Sans Kannada','Noto Sans Kannada UI',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Nirmala UI','Tunga',Tahoma,sans-serif;

  --sp-1:6px; --sp-2:10px; --sp-3:14px; --sp-4:20px; --sp-5:28px; --sp-6:38px;
}

/* ============================================================
   2. RESET / BASE
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;}
html{-webkit-text-size-adjust:100%;}
body{
  margin:0;
  font-family:var(--font);
  background:var(--ivory);
  color:var(--ink);
  font-size:15.5px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
h1,h2,h3,h4{margin:0 0 .55em;line-height:1.4;font-weight:600;}
h1{font-size:26px;}
h2{font-size:21px;}
h3{font-size:17px;}
h4{font-size:15.5px;}
p{margin:0 0 .9em;}
p:last-child{margin-bottom:0;}
a{color:var(--darkblue);}
img,svg{max-width:100%;}
button{font-family:inherit;}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink);}
::selection{background:rgba(197,164,109,.35);}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
.muted{color:var(--grey);}
.small{font-size:13.5px;}
.tiny{font-size:12.5px;}
.strong{font-weight:600;}
.center{text-align:center;}
.nowrap{white-space:nowrap;}
.hidden{display:none !important;}

/* ============================================================
   3. BUTTONS
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:11px 20px;border-radius:var(--radius-sm);border:1px solid transparent;
  background:#fff;font-size:15px;font-weight:600;cursor:pointer;
  transition:background .18s,border-color .18s,color .18s,transform .12s,box-shadow .18s;
  text-decoration:none;line-height:1.4;white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(20,36,58,.16);}
.btn-primary:hover{background:var(--darkblue);border-color:var(--darkblue);}
.btn-gold{background:var(--gold);color:#241f13;border-color:var(--gold);}
.btn-gold:hover{filter:brightness(1.05);}
.btn-ghost{background:#fff;border-color:var(--line-cool);color:var(--darkblue);}
.btn-ghost:hover{background:var(--lightblue);border-color:#c7d4e4;}
.btn-danger{background:#fff;color:var(--red);border-color:#EBCFCF;}
.btn-danger:hover{background:#FDF2F2;}
.btn-block{width:100%;}
.btn-sm{padding:7px 14px;font-size:13.5px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}
.icon-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;border-radius:10px;border:1px solid var(--line-cool);
  background:#fff;cursor:pointer;color:var(--darkblue);transition:.18s;
}
.icon-btn:hover{background:var(--lightblue);}

/* ============================================================
   4. CARDS / LAYOUT PRIMITIVES
   ============================================================ */
.card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);
}
.card-soft{
  background:#fff;border:1px solid var(--line-soft);border-radius:12px;padding:16px;
}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:16px;}
.card-head h2,.card-head h3{margin:0;}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:0 18px;}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
.span-2{grid-column:1 / -1;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.row-end{justify-content:flex-end;}
.spacer{flex:1;}
.stack>*+*{margin-top:18px;}

/* ============================================================
   5. FORM FIELDS
   ============================================================ */
.field{display:block;margin-bottom:16px;}
.field>span{display:block;font-size:14px;font-weight:600;color:var(--darkblue);margin-bottom:7px;}
.field input[type=text],.field input[type=email],.field input[type=password],
.field input[type=number],.field input[type=date],.field select,.field textarea{
  width:100%;padding:11px 13px;border:1px solid var(--line-cool);border-radius:var(--radius-sm);
  background:#fff;transition:border-color .16s,box-shadow .16s;outline:none;
}
.field textarea{resize:vertical;min-height:92px;line-height:1.8;}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--darkblue);box-shadow:0 0 0 3px rgba(29,53,87,.10);
}
.field input[type=color]{width:64px;height:42px;padding:3px;border:1px solid var(--line-cool);border-radius:8px;background:#fff;cursor:pointer;}
.field input:disabled{background:#F4F5F7;color:var(--grey);}
.field-hint{font-size:12.5px;color:var(--grey);margin-top:5px;}
.form-msg{
  display:none;padding:11px 14px;border-radius:10px;font-size:14px;margin-bottom:14px;
  border:1px solid transparent;
}
.form-msg.show{display:block;}
.form-msg.error{background:#FDF2F2;color:var(--red);border-color:#F0D3D3;}
.form-msg.ok{background:#EFF8F3;color:var(--green);border-color:#CFE9DC;}
.pw-wrap{position:relative;}
.pw-wrap input{padding-right:48px;}
.pw-toggle{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:transparent;border:0;cursor:pointer;color:var(--grey);
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:8px;
}
.pw-toggle:hover{background:var(--lightblue);color:var(--darkblue);}

/* ============================================================
   6. LOGIN PAGE
   ============================================================ */
.login-page{min-height:100vh;display:grid;grid-template-columns:1.02fr .98fr;}
.login-brand{
  position:relative;overflow:hidden;color:#fff;padding:56px 44px;
  display:flex;align-items:center;justify-content:center;
  background:var(--navy);
  background-image:radial-gradient(circle at 78% 12%, rgba(197,164,109,.18), transparent 46%),
                   radial-gradient(circle at 8% 92%, rgba(197,164,109,.12), transparent 46%);
}
.login-brand::after{
  content:"";position:absolute;right:-140px;bottom:-180px;width:430px;height:430px;
  border-radius:50%;border:1px solid rgba(197,164,109,.28);
}
.login-brand::before{
  content:"";position:absolute;right:-90px;bottom:-130px;width:300px;height:300px;
  border-radius:50%;border:1px solid rgba(197,164,109,.16);
}
.brand-inner{max-width:430px;position:relative;z-index:1;text-align:center;}
.emblem{display:inline-block;margin-bottom:20px;filter:drop-shadow(0 6px 18px rgba(0,0,0,.25));}
.brand-kn{font-size:29px;font-weight:700;letter-spacing:.2px;margin:0 0 4px;color:#fff;}
.brand-city{font-size:19px;color:var(--gold);font-weight:600;letter-spacing:.4px;margin-bottom:10px;}
.brand-en{font-size:12.5px;letter-spacing:1.6px;text-transform:uppercase;color:#9FB0C6;}
.brand-rule{width:74px;height:2px;background:var(--gold);margin:22px auto;opacity:.85;}
.brand-tag{font-size:14.5px;color:#C3CEE0;line-height:1.85;}
.brand-points{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:10px;text-align:left;}
.brand-points li{display:flex;gap:10px;align-items:flex-start;font-size:13.8px;color:#C9D4E3;}
.brand-points svg{flex:none;margin-top:3px;}
.login-panel{display:flex;align-items:center;justify-content:center;padding:44px 24px;background:var(--ivory);}
.login-card{
  width:100%;max-width:430px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:34px 32px;box-shadow:0 22px 60px rgba(20,36,58,.10);
}
.login-card h2{font-size:24px;margin-bottom:4px;color:var(--navy);}
.login-card .sub{color:var(--grey);font-size:14px;margin-bottom:24px;}
.login-note{font-size:12px;color:var(--grey);margin-top:14px;line-height:1.7;}

/* ============================================================
   7. APP SHELL
   ============================================================ */
.app-shell{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh;}
.sidebar{
  background:var(--navy);color:#E8EDF4;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto;z-index:100;
  border-right:1px solid rgba(255,255,255,.06);
}
.sidebar .sb-brand{display:flex;gap:12px;align-items:center;padding:20px 18px 18px;border-bottom:1px solid rgba(255,255,255,.09);}
.sb-brand .sb-text{min-width:0;}
.sb-brand .sb-kn{font-size:14.5px;font-weight:700;color:#fff;line-height:1.35;}
.sb-brand .sb-en{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#8FA2BA;line-height:1.4;margin-top:3px;}
.sb-nav{display:flex;flex-direction:column;gap:3px;padding:16px 12px;flex:1;}
.sb-label{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:#7186A0;padding:10px 12px 6px;font-weight:600;}
.nav-item{
  display:flex;gap:11px;align-items:center;padding:10px 13px;border-radius:9px;
  color:#BDC9DA;font-size:14.5px;font-weight:500;cursor:pointer;border:0;background:transparent;
  text-align:left;width:100%;transition:background .16s,color .16s;line-height:1.5;
}
.nav-item svg{flex:none;opacity:.9;}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff;}
.nav-item.active{background:rgba(197,164,109,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold);}
.nav-item.active svg{opacity:1;color:var(--gold);}
.sb-user{
  margin:0 12px 12px;padding:13px;border-radius:11px;background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.08);
}
.sb-user .su-name{font-weight:600;color:#fff;font-size:14.5px;line-height:1.4;}
.sb-user .su-role{font-size:12px;color:#9FB0C6;margin-top:2px;}
.sb-logout{
  margin:0 12px 18px;display:flex;align-items:center;gap:10px;justify-content:center;
  padding:10px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:transparent;
  color:#C3CEE0;font-size:14px;font-weight:600;cursor:pointer;transition:.16s;
}
.sb-logout:hover{background:rgba(194,65,65,.18);border-color:rgba(194,65,65,.45);color:#fff;}

.main-col{display:flex;flex-direction:column;min-width:0;}
.topbar{
  height:66px;display:flex;align-items:center;gap:14px;padding:0 24px;
  background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40;
}
.topbar h1{font-size:17px;margin:0;color:var(--navy);font-weight:600;}
.topbar .tb-sub{font-size:12px;color:var(--grey);line-height:1.3;}
.user-chip{display:flex;align-items:center;gap:10px;padding:6px 12px 6px 6px;border-radius:30px;background:var(--ivory);border:1px solid var(--line);}
.avatar{
  width:34px;height:34px;border-radius:50%;background:var(--darkblue);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none;
}
.avatar.admin{background:var(--gold);color:#2A2416;}
.user-chip .uc-name{font-size:13.5px;font-weight:600;line-height:1.25;color:var(--navy);}
.user-chip .uc-role{font-size:11px;color:var(--grey);line-height:1.25;}
.main{padding:26px 24px 70px;width:100%;max-width:1200px;margin:0 auto;}
.page-head{margin-bottom:22px;}
.page-head h2{font-size:23px;margin-bottom:4px;color:var(--navy);}
.page-head .ph-sub{color:var(--grey);font-size:14px;}
.only-mobile{display:none;}
.sidebar-overlay{display:none;}

/* ============================================================
   8. STAT CARDS
   ============================================================ */
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px;}
.stat{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 18px 16px;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
.stat::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--lightblue);}
.stat.gold::after{background:var(--gold);}
.stat.green::after{background:var(--green);}
.stat.navy::after{background:var(--darkblue);}
.stat .st-label{font-size:12.5px;color:var(--grey);font-weight:600;letter-spacing:.2px;margin-bottom:8px;}
.stat .st-value{font-size:24px;font-weight:700;color:var(--navy);line-height:1.2;}
.stat .st-hint{font-size:12px;color:var(--grey);margin-top:5px;}

/* ============================================================
   9. BADGES / PILLS
   ============================================================ */
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;}
.badge.green{background:#EAF6F0;color:var(--green);}
.badge.red{background:#FBEDED;color:var(--red);}
.badge.blue{background:var(--lightblue);color:var(--darkblue);}
.badge.gold{background:#F8F1E3;color:#8A6D2F;}
.badge.grey{background:#F1F2F4;color:var(--grey);}

/* ============================================================
   10. TRAINING CARD
   ============================================================ */
.training-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);display:flex;flex-direction:column;
}
.training-card .tc-top{padding:22px 22px 0;}
.tc-eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.tc-title{font-size:19px;font-weight:600;color:var(--navy);margin-bottom:8px;line-height:1.5;}
.tc-topic{font-size:14.5px;color:#3A4658;line-height:1.85;margin-bottom:16px;}
.tc-meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 20px;padding:16px 0;border-top:1px solid var(--line-soft);}
.tc-meta .m-label{font-size:11.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--grey);font-weight:600;}
.tc-meta .m-value{font-size:14px;color:var(--navy);font-weight:500;line-height:1.6;}
.tc-foot{
  padding:16px 22px;background:#FCFBF7;border-top:1px solid var(--line-soft);
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
}
.training-list{display:grid;gap:18px;}

/* ============================================================
   11. WORKFLOW STEPS
   ============================================================ */
.steps{
  display:flex;align-items:flex-start;gap:0;background:#fff;border:1px solid var(--line);
  border-radius:var(--radius);padding:18px 14px;margin-bottom:24px;box-shadow:var(--shadow-sm);
  overflow-x:auto;
}
.step{flex:1;min-width:104px;display:flex;flex-direction:column;align-items:center;gap:7px;position:relative;padding:0 4px;cursor:default;}
.step:not(:last-child)::after{
  content:"";position:absolute;top:17px;left:calc(50% + 22px);right:calc(-50% + 22px);
  height:2px;background:var(--line-cool);border-radius:2px;
}
.step.done:not(:last-child)::after{background:var(--gold);}
.step .s-dot{
  width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  background:#fff;border:2px solid var(--line-cool);color:var(--grey);font-weight:700;font-size:13.5px;
  transition:.2s;position:relative;z-index:1;flex:none;
}
.step .s-label{font-size:12.5px;text-align:center;color:var(--grey);font-weight:600;line-height:1.45;}
.step.active .s-dot{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 0 0 4px rgba(20,36,58,.09);}
.step.active .s-label{color:var(--navy);}
.step.done .s-dot{background:var(--gold);border-color:var(--gold);color:#2A2416;}
.step.done .s-label{color:var(--darkblue);}
.step.clickable{cursor:pointer;}
.step.clickable:hover .s-dot{border-color:var(--gold);}

/* ============================================================
   12. SESSION / RATING BLOCKS (FEEDBACK)
   ============================================================ */
.section-head{
  display:flex;align-items:center;gap:14px;margin:0 0 18px;padding-bottom:12px;
  border-bottom:1px solid var(--line-soft);
}
.section-head .sh-badge{
  background:var(--navy);color:#fff;font-weight:700;font-size:12.5px;padding:5px 13px;border-radius:6px;letter-spacing:.4px;
}
.section-head .sh-title{font-size:16.5px;font-weight:600;color:var(--navy);}
.session-block{
  border:1px solid var(--line-cool);border-radius:12px;padding:18px;margin-bottom:18px;background:#FCFCFD;
}
.session-block .ss-head{font-size:15px;font-weight:700;color:var(--darkblue);margin-bottom:8px;}
.session-block .ss-topic{font-size:14px;line-height:1.9;color:#33404F;margin-bottom:8px;}
.session-block .ss-lect{font-size:13.5px;color:var(--grey);margin-bottom:14px;}
.rating-label{font-size:13px;font-weight:600;color:var(--darkblue);margin-bottom:9px;}
.rating-row{display:flex;gap:9px;flex-wrap:wrap;}
.pill{position:relative;display:inline-flex;}
.pill input{position:absolute;opacity:0;width:0;height:0;}
.pill span{
  display:inline-block;padding:9px 16px;border-radius:24px;border:1px solid var(--line-cool);
  background:#fff;font-size:13.5px;font-weight:500;color:#41505F;cursor:pointer;transition:.16s;line-height:1.5;
}
.pill:hover span{border-color:#BCC9DA;background:#F8FAFC;}
.pill input:checked+span{background:var(--darkblue);border-color:var(--darkblue);color:#fff;font-weight:600;box-shadow:0 3px 10px rgba(29,53,87,.18);}
.pill input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px;}

/* ============================================================
   13. QUESTIONS
   ============================================================ */
.q-card{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px 22px;
  margin-bottom:16px;box-shadow:var(--shadow-sm);
}
.q-head{display:flex;gap:13px;align-items:flex-start;margin-bottom:15px;}
.q-num{
  flex:none;width:30px;height:30px;border-radius:8px;background:var(--lightblue);color:var(--darkblue);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13.5px;
}
.q-text{font-size:15.5px;font-weight:600;line-height:1.95;color:var(--navy);padding-top:2px;}
.opt-group{display:grid;gap:9px;}
.opt{
  display:flex;gap:12px;align-items:flex-start;padding:12px 15px;border:1px solid var(--line-cool);
  border-radius:var(--radius-sm);cursor:pointer;background:#fff;transition:.16s;line-height:1.75;
}
.opt:hover{border-color:#B9C8DB;background:#FBFCFE;}
.opt input{margin:5px 0 0;width:18px;height:18px;flex:none;accent-color:var(--darkblue);cursor:pointer;}
.opt .opt-key{
  flex:none;font-weight:700;color:var(--grey);font-size:13.5px;min-width:16px;margin-top:1px;
}
.opt .opt-text{font-size:14.8px;color:#2A3648;line-height:1.8;}
.opt.selected{border-color:var(--darkblue);background:var(--lightblue);box-shadow:inset 0 0 0 1px var(--darkblue);}
.opt.selected .opt-key{color:var(--darkblue);}
.opt.selected .opt-text{font-weight:500;}

/* ============================================================
   14. RESULT
   ============================================================ */
.result-hero{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:32px 24px;text-align:center;box-shadow:var(--shadow);margin-bottom:22px;
}
.ring{position:relative;width:170px;height:170px;margin:0 auto 18px;}
.ring svg{transform:rotate(-90deg);width:170px;height:170px;}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round;}
.ring .ring-bg{stroke:#EDEFF2;}
.ring .ring-fg{stroke:var(--green);transition:stroke-dashoffset 1s ease;}
.ring .ring-fg.fail{stroke:var(--red);}
.ring-label{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.ring-label strong{font-size:30px;font-weight:700;color:var(--navy);line-height:1.1;}
.ring-label span{font-size:15px;color:var(--grey);font-weight:600;}
.result-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px;}
.rs-item{background:#FBFBF8;border:1px solid var(--line-soft);border-radius:11px;padding:13px 10px;}
.rs-item .rs-label{font-size:12px;color:var(--grey);font-weight:600;margin-bottom:5px;line-height:1.45;}
.rs-item .rs-value{font-size:19px;font-weight:700;color:var(--navy);}

/* ============================================================
   15. CERTIFICATE
   ============================================================ */
.cert-wrap{padding:6px 0 20px;}
.cert{
  width:100%;max-width:1000px;margin:0 auto;aspect-ratio:1.414/1;position:relative;
  background:#FDFBF4;border:1px solid #D9D2BF;border-radius:8px;
  box-shadow:0 18px 50px rgba(20,36,58,.14);overflow:hidden;
  display:flex;align-items:stretch;padding:11px;
}
.cert-inner{
  flex:1;border:2px solid var(--navy);border-radius:4px;position:relative;
  padding:clamp(14px,2.4vw,32px) clamp(16px,3vw,44px);
  display:flex;flex-direction:column;
  background:
    repeating-linear-gradient(45deg, rgba(197,164,109,.035) 0 2px, transparent 2px 12px);
}
.cert-inner::after{
  content:"";position:absolute;inset:7px;border:1px solid rgba(197,164,109,.65);border-radius:2px;pointer-events:none;
}
.cert-corner{position:absolute;width:46px;height:46px;border:2px solid var(--gold);z-index:2;}
.cert-corner.tl{top:16px;left:16px;border-right:0;border-bottom:0;}
.cert-corner.tr{top:16px;right:16px;border-left:0;border-bottom:0;}
.cert-corner.bl{bottom:16px;left:16px;border-right:0;border-top:0;}
.cert-corner.br{bottom:16px;right:16px;border-left:0;border-top:0;}
.cert-head{text-align:center;position:relative;z-index:3;}
.cert-emblem{margin-bottom:6px;}
.cert-inst{font-size:clamp(14px,1.9vw,20px);font-weight:700;color:var(--navy);line-height:1.45;}
.cert-inst-en{font-size:clamp(8.5px,.95vw,11px);letter-spacing:2px;text-transform:uppercase;color:#8B7A54;margin-top:3px;}
.cert-rule{width:120px;height:1px;background:var(--gold);margin:clamp(8px,1.4vw,14px) auto;}
.cert-title{
  font-size:clamp(19px,3vw,32px);font-weight:700;color:var(--navy);letter-spacing:1px;
  text-align:center;line-height:1.4;
}
.cert-subtitle{text-align:center;font-size:clamp(9px,1.1vw,12px);letter-spacing:2.4px;text-transform:uppercase;color:#8B7A54;margin-top:2px;}
.cert-body{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;z-index:3;padding:clamp(6px,1.4vw,16px) 0;}
.cert-lead{font-size:clamp(11px,1.35vw,14.5px);color:#4A5568;line-height:1.9;}
.cert-name{
  font-size:clamp(19px,2.9vw,30px);font-weight:700;color:var(--navy);
  margin:clamp(5px,1vw,12px) 0;line-height:1.4;
  padding-bottom:4px;border-bottom:1.5px dotted rgba(197,164,109,.8);display:inline-block;
}
.cert-topic{
  font-size:clamp(11px,1.4vw,15px);line-height:1.9;color:#2A3648;max-width:88%;margin:0 auto;
  font-weight:500;
}
.cert-meta{
  display:flex;gap:clamp(8px,2vw,26px);justify-content:center;flex-wrap:wrap;
  margin-top:clamp(8px,1.6vw,18px);font-size:clamp(10px,1.15vw,13px);color:var(--darkblue);
}
.cert-meta b{font-weight:700;}
.cert-foot{
  display:flex;align-items:flex-end;justify-content:space-between;gap:16px;position:relative;z-index:3;
  margin-top:auto;padding-top:clamp(6px,1.2vw,14px);border-top:1px solid rgba(197,164,109,.45);
}
.cert-no{font-size:clamp(9px,1.05vw,12px);color:#6B7280;line-height:1.7;}
.cert-no b{color:var(--navy);letter-spacing:.4px;}
.cert-sign{text-align:center;min-width:150px;}
.cert-sign .sig-line{border-top:1.5px solid var(--navy);padding-top:5px;margin-top:22px;}
.cert-sign .sig-name{font-size:clamp(10px,1.2vw,13.5px);font-weight:700;color:var(--navy);line-height:1.5;}
.cert-sign .sig-role{font-size:clamp(8.5px,1vw,11px);color:#6B7280;line-height:1.5;}
.cert-demo{
  text-align:center;font-size:clamp(8px,.95vw,10.5px);color:#9A8F76;letter-spacing:.4px;
  margin-top:clamp(5px,1vw,10px);position:relative;z-index:3;
}
.cert-toolbar{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:22px 0 0;}

/* ============================================================
   16. TABLES
   ============================================================ */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line-soft);}
table.data{width:100%;border-collapse:collapse;background:#fff;min-width:620px;}
table.data th{
  text-align:left;font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;
  color:var(--grey);padding:12px 14px;background:#FAFAF7;border-bottom:1px solid var(--line-soft);white-space:nowrap;
}
table.data td{padding:13px 14px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle;}
table.data tbody tr:last-child td{border-bottom:0;}
table.data tbody tr:hover{background:#FCFCFA;}
table.data .td-name{font-weight:600;color:var(--navy);}
.table-empty{padding:34px 16px;text-align:center;color:var(--grey);font-size:14px;}

/* ============================================================
   17. MODAL & TOAST
   ============================================================ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,36,58,.5);z-index:900;
  display:flex;align-items:center;justify-content:center;padding:20px;
  overflow-y:auto;backdrop-filter:blur(2px);
}
.modal{
  background:#fff;border-radius:16px;width:100%;max-width:560px;padding:26px;
  box-shadow:0 30px 80px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto;

}
.modal.modal-wide{max-width:860px;}
@keyframes modalIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.modal h3{color:var(--navy);margin-bottom:10px;}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap;}
.modal-close{position:sticky;top:0;float:right;}
body.modal-open{overflow:hidden;}

/* ============================================================
   17b. SIGN-IN / ACCOUNT GATE
   Reuses the existing login card, badges and buttons — only the
   pieces the old password form needed are added here.
   ============================================================ */
.gbtn{
  display:flex;align-items:center;justify-content:center;gap:11px;width:100%;
  padding:13px 18px;border-radius:var(--radius-sm);border:1px solid var(--line-cool);
  background:#fff;color:var(--navy);font-size:15px;font-weight:600;

}

.gbtn:disabled{opacity:.6;cursor:not-allowed;box-shadow:none;}
.gbtn svg{flex:none;}
.auth-alt{
  margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft);
  font-size:12.5px;color:var(--grey);line-height:1.75;
}
.account-chip{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:22px;
  background:var(--lightblue);color:var(--darkblue);font-size:12.5px;font-weight:600;

}
.gate-wrap{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 18px;background:var(--ivory);
}
.gate-card{
  width:100%;max-width:520px;background:#fff;border:1px solid var(--line);
  border-radius:18px;padding:34px 30px;box-shadow:0 22px 60px rgba(20,36,58,.10);
}
.gate-card h2{font-size:23px;color:var(--navy);margin-bottom:6px;}
.gate-card .gate-sub{color:var(--grey);font-size:14px;line-height:1.8;margin-bottom:22px;}
.gate-state{
  display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border-radius:11px;
  background:#FCFBF7;border:1px solid var(--line-soft);margin-bottom:18px;

}
.gate-state.pending{background:#FFFBF0;border-color:#EBD9AE;}
.gate-state.rejected{background:#FDF2F2;border-color:#F0D3D3;}
.gate-state.disabled{background:#F4F5F7;border-color:#E3E5E9;}
.gate-state .gs-dot{
  flex:none;width:9px;height:9px;border-radius:50%;margin-top:6px;background:var(--gold);
}
.gate-state.pending .gs-dot{background:#C79A2E;}
/* important notice the admin writes above the feedback form */
.notice-card{border-left:4px solid var(--gold);background:#FFFBF0;}
.notice-body{white-space:pre-line;line-height:1.8;font-size:14.5px;color:var(--darkblue);}

@media (max-width:520px){
  .gate-card{padding:24px 18px;}
}


.toasts{position:fixed;right:20px;bottom:20px;z-index:1200;display:flex;flex-direction:column;gap:10px;max-width:min(400px,calc(100vw - 32px));}
.toast{
  background:#fff;border:1px solid var(--line);border-left:4px solid var(--darkblue);
  border-radius:10px;padding:12px 16px;box-shadow:0 12px 34px rgba(20,36,58,.16);
  font-size:14px;line-height:1.6;color:var(--ink);animation:toastIn .22s ease;
}
.toast.success{border-left-color:var(--green);}
.toast.error{border-left-color:var(--red);}
.toast.info{border-left-color:var(--gold);}
@keyframes toastIn{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:none;}}

/* ============================================================
   18. ADMIN QUESTION EDITOR
   ============================================================ */
.qedit{border:1px solid var(--line-cool);border-radius:12px;padding:16px;margin-bottom:14px;background:#FCFCFD;}
.qedit-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}

.qedit-tools button{

  cursor:pointer;font-size:14px;color:var(--darkblue);display:flex;align-items:center;justify-content:center;transition:.16s;
}
.qedit-tools button:hover{background:var(--lightblue);}
.qedit-tools button.danger{color:var(--red);border-color:#EBCFCF;}
.qedit-tools button.danger:hover{background:#FDF2F2;}
.subhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:26px 0 14px;flex-wrap:wrap;}
.subhead h3{margin:0;color:var(--navy);font-size:16.5px;}

/* ============================================================
   19. FILTER BAR
   ============================================================ */
.filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:18px;}

/* ============================================================
   21. PRINT (certificate only)
   ============================================================ */
@page{size:A4 landscape;margin:8mm;}
@media print{
  body{background:#fff !important;}
  body.print-mode .sidebar,
  body.print-mode .topbar,
  body.print-mode .no-print,
  body.print-mode .toasts{display:none !important;}
  body.print-mode *{visibility:hidden;}
  body.print-mode .cert,body.print-mode .cert *{visibility:visible;}
  body.print-mode .cert{
    position:absolute;left:0;top:0;width:100%;max-width:none;margin:0;
    border-radius:0;box-shadow:none;border:1px solid #D9D2BF;
  }
  .app-shell{display:block !important;}
  .main{padding:0 !important;max-width:none !important;}
  /* The printed page must be exactly as tall as its own aspect ratio, or a
     portrait certificate spills onto a second page. Height is derived from
     the width the print box actually gets, which is why this uses
     calc(100% / aspect) rather than a fixed size. */
  body.print-mode .cert{
    width:100% !important;max-width:none !important;
    height:auto !important;max-height:none !important;
  }
  body.print-mode .cert.cert-custom{
    aspect-ratio:var(--cert-aspect, 1.414) !important;
  }
}

/* ============================================================
   CERTIFICATE DESIGNER (new — does not affect existing styles)
   ============================================================ */
.certdes-layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px;}
.certdes-canvas-wrap{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);}
.certdes-canvas{position:relative;width:100%;background:#fff;border:1px dashed #C9D2E0;border-radius:6px;overflow:hidden;user-select:none;container-type:size;touch-action:none;}
.certdes-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;pointer-events:none;display:block;}
.certdes-bg.empty{background:repeating-linear-gradient(45deg,#F7F5EF 0 10px,#EFEBE0 10px 20px);}
.certdes-field{position:absolute;box-sizing:border-box;cursor:move;padding:1px 3px;line-height:1.2;border:1px dashed transparent;white-space:pre-wrap;word-break:break-word;overflow:visible;touch-action:none;font-weight:500;}
.certdes-field:hover{border-color:rgba(29,53,87,.35);}
.certdes-field.selected{border-color:var(--darkblue);background:rgba(234,240,247,.35);}
.certdes-field .cd-handle{position:absolute;right:-6px;bottom:-6px;width:12px;height:12px;background:var(--gold);border:2px solid #fff;border-radius:50%;cursor:nwse-resize;box-shadow:0 1px 3px rgba(0,0,0,.25);touch-action:none;}
.certdes-panel{display:flex;flex-direction:column;gap:14px;}
.certdes-section{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow-sm);}
.certdes-section h4{margin:0 0 10px;font-size:14px;color:var(--navy);}
.certdes-list{display:flex;flex-direction:column;gap:6px;}
.certdes-list button{text-align:left;padding:7px 10px;border:1px solid var(--line-cool);border-radius:7px;background:#fff;font-size:13px;cursor:pointer;transition:.16s;font-family:inherit;}
.certdes-list button:hover{background:var(--lightblue);border-color:#BCC9DA;}
.certdes-empty{padding:30px;text-align:center;color:var(--grey);font-size:13px;}
.certdes-info{font-size:12px;color:var(--grey);line-height:1.65;}
.certdes-tag{display:inline-block;padding:2px 8px;background:var(--lightblue);color:var(--darkblue);border-radius:6px;font-size:11px;font-weight:600;}
.certdes-tag.static{background:#F8F1E3;color:#8A6D2F;}
@media (max-width:980px){ .certdes-layout{grid-template-columns:1fr;} }

/* Student custom certificate rendering */
/* The base .cert rule hard-codes aspect-ratio:1.414/1 (landscape A4).
   A portrait design therefore got letterboxed inside a landscape box and
   the uploaded background was stretched by `object-fit:cover` or, worse,
   squeezed by the fixed box. The custom certificate now takes its aspect
   from the design (portrait or landscape) and fills the page exactly. */
.cert.cert-custom{
  padding:0;background:#fff;border-color:#D9D2BF;
  /* override the landscape default in the base .cert rule */
  aspect-ratio:var(--cert-aspect, 1.414);
}
.cert.cert-custom .cert-custom-stage{
  position:relative;width:100%;height:100%;container-type:size;overflow:hidden;
}
/* the uploaded scan is the page: fill it exactly, never letterbox, never
   distort. `cover` on a box with the image's own aspect is pixel-exact. */
.cert-custom-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;}
.cert-custom-field{position:absolute;box-sizing:border-box;line-height:1.2;white-space:pre-wrap;word-break:break-word;pointer-events:none;font-weight:500;}
@media print{
  body.print-mode .cert.cert-custom{border:none;}
  body.print-mode .cert-custom-stage{border:none;}
}

/* ============================================================
   21. TRAINING UPDATE — LARGE EDITORS, PART ONE / PART TWO
   ------------------------------------------------------------
   The administrator's question boxes were too small to check
   Kannada spelling. Every question editor is now both wide and
   tall, and the feedback editor is split into ಭಾಗ-1 (day-wise
   question blocks) and ಭಾಗ-2 (fixed Kannada questionnaire).
   ============================================================ */

/* ---- larger question editors (MCQ + feedback, admin) ---- */

}

/* ---- part one: large, attractive question block (admin) ---- */
.p1-block{
  position:relative;border:1px solid #DCD3C0;border-radius:16px;
  padding:20px 20px 16px;margin-bottom:18px;
  background:linear-gradient(165deg,#FFFDF7 0%,#FBF8F0 100%);

}
.p1-block::before{
  content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;

}
.p1-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.p1-num{
  background:var(--navy);color:#fff;font-size:12px;font-weight:700;

/* ============================================================
   SECTION B.2a — SUPABASE LIBRARY LOADING
   ------------------------------------------------------------
   The vendored file `vendor/supabase-js-2.45.4.js` is a plain
   <script> tag in <head>, so it has always executed by the time this
   code runs. If it is missing (someone uploaded only the HTML, or a
   host served a 404), we try two CDNs, and if all three fail the page
   says exactly which file to upload instead of pretending to work.
   ============================================================ */

const SUPABASE_LIB_LOCAL = 'vendor/supabase-js-2.45.4.js';
const SUPABASE_LIB_CDNS = [
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js',
  'https://unpkg.com/@supabase/supabase-js@2.45.4/dist/umd/supabase.js'

/* diagnostics hook: a host can shorten the wait in a test harness */
const SUPABASE_LIB_TIMEOUT = Number(window.SUPABASE_LIB_TIMEOUT_MS) > 0
  ? Number(window.SUPABASE_LIB_TIMEOUT_MS)
  : 8000;

const LIB_ATTEMPTS = [];   /* {src, ok, why} — shown on the error card */
let libLoading = null;
let libRounds = 0;         /* >1 means this is a retry, not the first boot */

function supabaseLibReady(){
  return !!(window.supabase && typeof window.supabase.createClient === 'function');
}

function loadScriptTag(src, timeoutMs){
  return new Promise(function(resolve){
    let settled = false;
    const finish = function(ok, why){
      if(settled) return;
      settled = true;
      resolve({ src: src, ok: ok, why: why || '' });
    };
    const el = document.createElement('script');
    el.src = src;
    el.async = true;
    el.crossOrigin = 'anonymous';
    el.onload = function(){ finish(true); };
    el.onerror = function(){ finish(false, '404 / network blocked'); };
    setTimeout(function(){ finish(false, 'timeout after ' + (timeoutMs || SUPABASE_LIB_TIMEOUT) + ' ms'); },
      timeoutMs || SUPABASE_LIB_TIMEOUT);
    document.head.appendChild(el);
  });
}

function ensureSupabaseLibrary(){
  if(supabaseLibReady()) return Promise.resolve(true);
  if(libLoading) return libLoading;

  libRounds += 1;
  LIB_ATTEMPTS.length = 0;

  /* First boot: the <script> tag already asked the browser for the local
     file, so record that and fall straight through to the CDNs.
     A retry (the operator just uploaded the file, or the CDN came back):
     try the local file again first, then the CDNs. */
  const sources = [];
  if(libRounds === 1){
    LIB_ATTEMPTS.push({ src: SUPABASE_LIB_LOCAL, ok: false, why: 'the <script> tag did not expose window.supabase' });
  }else{
    sources.push(SUPABASE_LIB_LOCAL);
  }

  libLoading = sources.concat(SUPABASE_LIB_CDNS).reduce(function(chain, url){
    return chain.then(function(already){
      if(already) return true;
      return loadScriptTag(url).then(function(res){
        const ok = res.ok && supabaseLibReady();
        LIB_ATTEMPTS.push({ src: url, ok: ok, why: res.ok ? 'loaded but did not expose window.supabase' : res.why });
        return ok;
      });
    });
  }, Promise.resolve(false)).then(function(ok){
    libLoading = null;
    return ok;
  });

  return libLoading;
}

  const redirectTo = window.location.origin + window.location.pathname;

function handleSession(session){

let draftTimer = null;
function persistDraft(){
  const k = draftKey();
  if(!k || !state.draft) return;
  /* Write straight away. This used to debounce for 250ms, which meant a
     radio or textarea answer lived only in memory for a quarter second —
     closing the tab (or a crash) in that window silently lost the answer,
     which is what "the radio buttons do not save" looked like.
     localStorage.setItem is synchronous and cheap; the debounce only ever
     bought back a few microseconds of work. */
  const write = function(){
    try{ localStorage.setItem(k, JSON.stringify(state.draft)); }
    catch(e){
      /* quota: drop the cached background first, then retry once */
      try{
        localStorage.removeItem(CERT_BG_KEY);
        localStorage.setItem(k, JSON.stringify(state.draft));
      }catch(e2){ /* storage genuinely unavailable; in-memory draft still works */ }
    }
  };
  write();
  /* keep the timer only as a flush for callers that batch many keystrokes */
  clearTimeout(draftTimer);
  draftTimer = null;
}

  const k = draftKey();
  if(!k) return;
  /* a queued write from the old debounce would otherwise put the draft back */
  clearTimeout(draftTimer);
  draftTimer = null;
  try{ localStorage.removeItem(k); }catch(e){}

    subject: str(b.subject !== undefined ? b.subject : b.heading),
    question: str(b.question !== undefined ? b.question : b.text),
    lecturer: str(b.lecturer),
    deleted: !!b.deleted
  };
}

/* old session ratings -> one ಭಾಗ-1 block per session */
function legacyPart1FromSessions(sessions){
  return (sessions || []).filter(function(s){
    return s && (str(s.heading).trim() || str(s.topic).trim() || str(s.lecturer).trim());
  }).map(function(s, i){
    return normalizePart1Block({
      id: 'p1_legacy_' + (i + 1),
      sessionFrom: String(i + 1),
      sessionTo: String(i + 1),
      subject: s.heading || '',
      question: s.topic || s.heading || '',
      lecturer: s.lecturer || ''
    }, i);
  });
}

function normalizePart1(raw, legacySessions, preferRaw){
  let list = Array.isArray(raw) ? raw.slice() : [];
  if(!list.length && !preferRaw){
    /* an older fallback save may have stored the new blocks in the legacy
       jsonb column; detect that shape before converting real sessions */
    const legacy = Array.isArray(legacySessions) ? legacySessions : [];
    const looksLikeBlocks = legacy.some(function(s){
      return s && (s.question !== undefined || s.subject !== undefined || s.day !== undefined || s.sessionFrom !== undefined);
    });
    list = looksLikeBlocks ? legacy : legacyPart1FromSessions(legacy);
  }
  return list.map(normalizePart1Block);
}

function normalizePart2Question(q, i){
  q = q || {};
  const rawFormat = str(q.format || q.type).toLowerCase();
  let format = 'choice';
  if(rawFormat === 'text' || rawFormat === 'textarea' || rawFormat === 'descriptive') format = 'text';
  else if(rawFormat === 'rating' || rawFormat === 'scale') format = 'rating';
  let options = Array.isArray(q.options)
    ? q.options.map(function(o){ return str(o); })
    : [];
  if(format === 'text') options = [];
  else{
    options = options.filter(function(o){ return o !== ''; });
    if(options.length < 2) options = format === 'rating' ? ['1','2','3','4','5'] : ['',''];
  }
  return {
    id: str(q.id) || ('p2_legacy_' + (i + 1)),
    text: str(q.text),
    format: format,
    options: options,
    deleted: !!q.deleted
  };
}

function legacyPart2FromQuestions(questions){
  /* old rows use {type:'radio'|'textarea'}; a fallback save may already hold
     the new {format, options} shape — normalizePart2Question reads both. */
  return (questions || []).filter(function(q){
    return q && str(q.text).trim();
  }).map(function(q, i){
    return normalizePart2Question(q, i);
  });
}

function normalizePart2(raw, legacyQuestions, preferRaw){
  let list = Array.isArray(raw) ? raw.slice() : [];
  if(!list.length && !preferRaw) list = legacyPart2FromQuestions(legacyQuestions);
  if(!list.length && !preferRaw) list = deepCopy(PART2_DEFAULT);
  return list.map(normalizePart2Question);
}

function part1Active(t){
  return ((t && t.feedback && t.feedback.part1) || []).filter(function(b){ return !b.deleted; });
}
function part2Active(t){
  return ((t && t.feedback && t.feedback.part2) || []).filter(function(q){ return !q.deleted; });
}

/* ---- rows -> view shapes ---- */
function trainingFromRow(row, questions){
  const legacySessions  = Array.isArray(row.feedback_sessions)  ? row.feedback_sessions  : [];
  const legacyQuestions = Array.isArray(row.feedback_questions) ? row.feedback_questions : [];
  const startDate = toIsoDate(str(row.start_date) || str(row.date));
  const endDate   = toIsoDate(str(row.end_date)) || startDate;
  /* feedback_version = 1 marks a training saved with the new ಭಾಗ-1/ಭಾಗ-2
     layout, so an intentionally empty section stays empty instead of
     falling back to the legacy columns or the default paper. */
  const newLayout = Number(row.feedback_version) > 0;
  return {
    id: row.id,
    title: row.title || '',
    /* kept so old records still render their one free-text date */
    date: row.date || '',
    startDate: startDate,
    endDate: endDate,
    accent: row.accent || '#1D3557',
    institute: row.institute || INSTITUTE,
    passing: Number(row.passing) || 70,
    published: row.published !== false,
    archived: !!row.archived,
    createdAt: row.created_at || '',
    /* never present on a client-readable training */
    answerKey: null,
    questions: (questions || []).map(function(q){
      return {
        id: q.id,
        text: q.text || '',
        options: Array.isArray(q.options) ? q.options : [],
        marks: Number(q.marks) || 1
      };
    }),
    feedback: {
      day: row.feedback_day || '',
      notice: row.feedback_notice || '',
      part1: normalizePart1(row.feedback_part1, legacySessions, newLayout),
      part2: normalizePart2(row.feedback_part2, legacyQuestions, newLayout),
      /* legacy shapes are kept for the administrator's old responses */
      sessions: legacySessions,
      questions: legacyQuestions
    }
  };
}

function submissionFromRow(row){
  const t = DB.trainings.find(function(x){ return x.id === row.training_id; }) || null;
  const correct = Number(row.correct_count) || 0;
  const wrong = Number(row.wrong_count) || 0;
  return {
    id: row.id,
    userId: row.student_id,
    userName: row.official_name || '',
    trainingId: row.training_id,
    trainingTitle: t ? t.title : (row.training_title || ''),
    trainingDate: t ? dateRange(t.startDate, t.endDate) : '',
    details: { name: row.official_name || '', email: row.email || '', kgid: row.kgid || '' },
    /* the marking RPC copies the participant's designation from their
       profile at submit time; older rows fall back to the profile below */
    designation: row.designation || '',
    feedback: row.feedback || { ratings:{}, answers:{} },
    answers: row.answers || {},
    result: {
      correct: correct,
      wrong: wrong,
      totalQuestions: correct + wrong,
      total: Number(row.total_marks) || 0,
      marks: Number(row.marks_obtained) || 0,
      pct: Number(row.percentage) || 0,
      passed: !!row.pass_status,
      passing: Number(row.passing_percent) || 70
    },
    submittedAt: row.submitted_at || nowISO(),
    certificateNo: row.certificate_serial || null
  };
}

function certificateFromRow(row){
  return {
    id: row.id,
    number: row.serial,
    submissionId: row.submission_id,
    userId: row.student_id,
    studentName: row.student_name || '',
    kgid: row.kgid || '',
    trainingId: row.training_id,
    trainingTitle: row.training_title || '',
    trainingTopic: row.training_topic || '',
    date: row.training_date || '',
    marks: Number(row.marks) || 0,
    total: Number(row.total) || 0,
    pct: Number(row.percentage) || 0,
    issuedAt: row.issued_at || ''
  };
}

/* ---- loaders ---- */
function loadTrainingsForRead(){
  const admin = authIsAdmin();
  let q = sb.from('trainings').select('*').order('created_at', { ascending:false });
  if(!admin) q = q.eq('published', true).eq('archived', false);
  return q.then(unwrap).then(function(rows){
    const list = rows || [];
    const ids = list.map(function(r){ return r.id; });
    if(!ids.length){ DB.trainings = []; return DB.trainings; }
    return sb.from('training_questions')
      .select('*')
      .in('training_id', ids)
      .order('position', { ascending:true })
      .then(unwrap)
      .then(function(qs){
        const byTraining = {};
        (qs || []).forEach(function(q){
          if(!byTraining[q.training_id]) byTraining[q.training_id] = [];
          byTraining[q.training_id].push(q);
        });
        DB.trainings = list.map(function(r){ return trainingFromRow(r, byTraining[r.id] || []); });
        return DB.trainings;
      });
  });
}

function loadSubmissionsForRead(){
  return sb.from('submissions').select('*').order('submitted_at', { ascending:false })
    .then(unwrap)

function loadCertificateDesign(){
  return sb.from('certificate_design').select('*').maybeSingle().then(unwrap).then(function(row){
    if(!row) return null;
    const design = sanitizeCertDesign({
      useCustom: !!row.use_custom,
      aspect: Number(row.aspect) || 1.414,
      fields: Array.isArray(row.fields) ? row.fields : []
    });
    certDesState.design = deepCopy(design);
    saveCertDesign(design);
    const path = row.background_path || '';
    if(!path){
      certDesState.bg = '';
      try{ localStorage.removeItem(CERT_BG_PATH_KEY); }catch(e){}
      clearCertBg();
      return null;
    }
    let cached = '';
    try{
      cached = localStorage.getItem(CERT_BG_PATH_KEY) === path ? loadCertBg() : '';
    }catch(e){ cached = ''; }
    if(cached){ certDesState.bg = cached; return cached; }
    return downloadCertBackground(path);
  }).catch(function(err){
    console.warn('[data] certificate design read failed', err && (err.message || err.code));
    return null;
  });
}

function blobToDataUrl(blob){
  return new Promise(function(resolve, reject){
    try{
      const reader = new FileReader();
      reader.onload = function(ev){ resolve(String((ev && ev.target && ev.target.result) || '')); };
      reader.onerror = function(){ reject(new Error('blob-read-failed')); };
      reader.readAsDataURL(blob);
    }catch(e){ reject(e); }
  });
}

function dataUrlToBlob(dataUrl){
  const parts = String(dataUrl || '').split(',');
  const meta = parts[0] || '';
  const mime = (meta.match(/data:([^;]+)/) || [])[1] || 'image/png';
  const bytes = atob(parts[1] || '');
  const buffer = new Uint8Array(bytes.length);
  for(let i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);
  return new Blob([buffer], { type: mime });
}

function downloadCertBackground(path){
  return sb.storage.from(CERT_BUCKET).download(path).then(function(res){
    if(res && res.error) throw res.error;
    return blobToDataUrl(res.data);
  }).then(function(dataUrl){
    certDesState.bg = dataUrl;
    saveCertBg(dataUrl);
    try{ localStorage.setItem(CERT_BG_PATH_KEY, path); }catch(e){}
    return dataUrl;
  }).catch(function(err){
    console.warn('[data] certificate background download failed', err && (err.message || err.code));
    return null;
  });
}

/* ---- the one entry point the rest of the app calls ---- */
function reloadPortalData(){
  if(!sb || !AUTH.session || AUTH.gate !== 'ready'){
    render();
    return Promise.resolve();
  }
  DataStore.loading = true;
  DataStore.error = '';
  return loadTrainingsForRead()
    .then(function(){
      return Promise.all([
        loadSubmissionsForRead(),
        loadCertificatesForRead(),
        loadProfilesForAdmin(),
        loadPortalSettings(),
        loadCertificateDesign()
      ]);
    })
    .then(function(){
      DataStore.loading = false;
      DataStore.loaded = true;
      render();
      return true;
    })
    .catch(function(err){
      DataStore.loading = false;
      DataStore.error = (err && err.message) || 'load-failed';
      console.warn('[data] load failed', err && (err.message || err.code));
      toast(dataErrorMessage(err), 'error');
      render();
      return false;
    });
}
DataStore.reload = reloadPortalData;

const appEl = document.getElementById('app');

function render(){
  /* The account gate comes first: nothing inside the portal draws until
     Supabase has told us who this is and the profile says how far in
     they are allowed to go. */
  if(AUTH.gate !== 'ready'){
    appEl.innerHTML = viewGate();
    bindPostRender();
    return;
  }
  const u = currentUser();
  if(!u){
    appEl.innerHTML = viewGate();
    bindPostRender();
    return;
  }
  if(u.role === 'admin'){
    appEl.innerHTML = viewAdminShell(u);
    bindPostRender();
    return;
  }
  /* student */
  if(state.route === 'workflow' && state.trainingId && getTraining(state.trainingId)){
    appEl.innerHTML = viewWorkflowShell(u);
  }else{
    state.route = 'dashboard';
    appEl.innerHTML = viewStudentShell(u);
  }
  bindPostRender();
}

/* Bind data-bind inputs for admin editor + misc after every render */
function bindPostRender(){
  $$('[data-bind]').forEach(el => {
    const handler = () => {
      if(!state.editing) return;
      let v = el.value;
      const p = el.dataset.bind;
      if(/(\.|^)(correct|passing|marks)$/.test(p)){
        /* an empty answer-key select means "leave the stored key alone" */
        v = (v === '' && /correct$/.test(p)) ? null : (Number(v) || 0);
      }
      setPath(state.editing, p, v);
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });

  /* ---- ಭಾಗ-1 editor: day / date / session range, Edit for All or One --- */
  $$('[data-p1]').forEach(el => {
    const apply = function(){
      if(!state.editing || !state.editing.feedback) return;
      const fb = state.editing.feedback;
      const i = Number(el.getAttribute('data-p1'));
      const f = el.getAttribute('data-p1f');
      const block = (fb.part1 || [])[i];
      if(!block) return;
      block[f] = el.value;
      const scopeField = (f === 'sessionFrom' || f === 'sessionTo') ? 'sessions' : f;
      const mode = fb.scope && fb.scope[scopeField];
      if(mode !== 'all') return;
      (fb.part1 || []).forEach(function(other, j){
        if(j === i || other.deleted) return;
        if(scopeField === 'sessions'){
          other.sessionFrom = block.sessionFrom;
          other.sessionTo = block.sessionTo;
          ['sessionFrom','sessionTo'].forEach(function(ff){
            const inp = document.querySelector('[data-p1="' + j + '"][data-p1f="' + ff + '"]');
            if(inp) inp.value = block[ff];
          });
        }else{
          other[f] = el.value;
          const inp = document.querySelector('[data-p1="' + j + '"][data-p1f="' + f + '"]');
          if(inp) inp.value = el.value;
        }
      });
    };
    el.addEventListener('input', apply);
    el.addEventListener('change', apply);
    /* clicking a day / date / session field brings the All/One choice to
       the administrator's attention */
    el.addEventListener('focus', function(){
      const scopeField = (el.getAttribute('data-p1f') === 'sessionFrom' ||
                          el.getAttribute('data-p1f') === 'sessionTo')
        ? 'sessions' : el.getAttribute('data-p1f');
      if(scopeField !== 'day' && scopeField !== 'date' && scopeField !== 'sessions') return;
      const scopeEl = el.closest('.p1-mini') || el.closest('.p1-sessions');
      if(!scopeEl) return;
      const box = scopeEl.querySelector('.scope');
      if(!box) return;
      box.classList.add('hint-pop');
      setTimeout(function(){ box.classList.remove('hint-pop'); }, 1800);
    });
  });

  /* ---- ಭಾಗ-2 editor: question format and number of options ---- */
  $$('[data-p2fmt]').forEach(el => {
    el.addEventListener('change', function(){
      if(!state.editing || !state.editing.feedback) return;
      const i = Number(el.getAttribute('data-p2fmt'));
      const q = (state.editing.feedback.part2 || [])[i];
      if(!q) return;
      const next = el.value;
      if(next === q.format) return;
      if(next === 'text'){
        q.format = 'text';
        q.options = [];
      }else{
        q.format = next;
        const kept = (q.options || []).map(function(o){ return str(o).trim(); }).filter(Boolean);
        if(kept.length >= 2) q.options = kept;
        else q.options = next === 'rating' ? ['1','2','3','4','5'] : ['',''];
      }
      render();
    });
  });

  $$('[data-p2count]').forEach(el => {
    el.addEventListener('change', function(){
      if(!state.editing || !state.editing.feedback) return;
      const i = Number(el.getAttribute('data-p2count'));
      const q = (state.editing.feedback.part2 || [])[i];
      if(!q || q.format === 'text') return;
      const n = Math.max(2, Math.min(20, Number(el.value) || 2));
      const opts = q.options || (q.options = []);
      while(opts.length < n) opts.push(q.format === 'rating' ? String(opts.length + 1) : '');
      while(opts.length > n) opts.pop();
      render();
    });
  });

  /* ---- ಭಾಗ-1 answers (the participant rates each block) ---- */
  $$('input[data-p1rate]').forEach(function(el){
    el.addEventListener('change', function(){
      if(!state.draft) return;
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.ratings) state.draft.feedback.ratings = {};
      state.draft.feedback.ratings[el.getAttribute('data-p1rate')] = el.value;
      persistDraft();
    });
  });

  $$('[data-det]').forEach(el => {
    el.addEventListener('input', () => {
      if(!state.draft) return;
      state.draft.details[el.dataset.det] = el.value;
      persistDraft();
    });
  });

  $$('[data-fb]').forEach(el => {
    el.addEventListener('input', () => {
      if(!state.draft) return;
      state.draft.feedback.answers[el.dataset.fb] = el.value;
      persistDraft();
    });
  });

  $$('input[name^="rate_"]').forEach(el => {
    el.addEventListener('change', () => {
      if(!state.draft) return;
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.ratings) state.draft.feedback.ratings = {};
      state.draft.feedback.ratings[el.name.slice(5)] = el.value;
      persistDraft();
    });
  });

  $$('input[name^="ans_"]').forEach(el => {
    el.addEventListener('change', () => {
      if(!state.draft) return;
      state.draft.answers[el.name.slice(4)] = Number(el.value);
      persistDraft();
    });
  });

  /* filter inputs for results table (live DOM filtering) */
  $$('[data-filter]').forEach(el => {
    el.addEventListener('input', applyResultFilter);
    el.addEventListener('change', applyResultFilter);
  });

  /* certificate designer property inputs */
  if(state.adminSection === 'certdesigner' && certDesState.design){
    bindCertDesInputs();
  }

  /* student account search / status filters */
  if(state.adminSection === 'accounts'){
    bindAccountFilters();
  }

}

      '<div class="tc-top">' +
        '<div class="tc-eyebrow">' +
          statusBadge +

          '<div><div class="m-label">ಪ್ರಶ್ನೆಗಳು</div><div class="m-value">' + t.questions.length + ' MCQ</div></div>' +

    '<div class="stat navy"><div class="st-label">ಲಭ್ಯವಿರುವ ತರಬೇತಿಗಳು</div><div class="st-value">' + totalTrainings + '</div><div class="st-hint">ಒಟ್ಟು ಕಾರ್ಯಕ್ರಮಗಳು</div></div>' +

  '</div>' +

      '</div>' +
      '<div style="text-align:right;min-width:150px;">' +
        '<div class="tiny muted">ಸ್ಥಿತಿ</div>' +
        '<div class="strong" style="color:var(--darkblue);">' + (completed > 0 ? 'ಸಕ್ರಿಯ' : 'ಹೊಸ ಬಳಕೆದಾರ') + '</div>' +

  '<div class="card-head" style="margin-bottom:14px;">' +
    '<h2 style="font-size:19px;">ಲಭ್ಯವಿರುವ ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮಗಳು</h2>' +
  '</div>' +
  '<div class="training-list">' + (cards || '<div class="card muted center">ಯಾವುದೇ ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮಗಳು ಲಭ್ಯವಿಲ್ಲ.</div>') + '</div>';

const STAGES = [
  { n:1, label:'ಭಾಗವಹಿಸುವವರ ವಿವರಗಳು' },
  { n:2, label:'ತರಬೇತಿ ಪ್ರತಿಕ್ರಿಯೆ' },
  { n:3, label:'ಮೌಲ್ಯಮಾಪನ' },
  { n:4, label:'ಫಲಿತಾಂಶ' },
  { n:5, label:'ಪ್ರಮಾಣಪತ್ರ' }
];

function openTraining(id){
  const u = currentUser();
  if(!u) return;
  const t = getTraining(id);
  if(!t){ toast('ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮ ಕಂಡುಬಂದಿಲ್ಲ.','error'); return; }

  state.trainingId = id;
  const sub = getSubmission(u.id, id);

  if(sub){
    state.stage = 4;
    state.draft = newDraft(u);
    state.route = 'workflow';
    render();
    return;
  }

  const d = readDraft();
  state.draft = d || newDraft(u);
  if(!state.draft.details) state.draft.details = { email:'', name:u.name, kgid:'', designation:'' };
  if(!state.draft.details.name) state.draft.details.name = u.name;
  if(!state.draft.details.kgid) state.draft.details.kgid = u.kgid || '';
  /* the designation saved on the profile is the default; the participant may
     correct it for this training and it is written back on the next step */
  if(!state.draft.details.designation) state.draft.details.designation = u.designation || '';
  if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
  if(!state.draft.answers) state.draft.answers = {};

  state.stage = Math.min(Math.max(Number(state.draft.stage) || 1, 1), 3);
  state.route = 'workflow';
  render();
}

function stageAccessible(n){
  const u = currentUser();
  const t = getTraining(state.trainingId);
  if(!u || !t) return false;
  const sub = getSubmission(u.id, t.id);

  if(n === 1) return true;
  if(n === 2) return isDetailsComplete();
  if(n === 3) return isDetailsComplete() && isFeedbackComplete(t);
  if(n === 4) return !!sub;
  if(n === 5) return !!(sub && sub.result.passed);
  return false;
}

function isDetailsComplete(){
  const d = state.draft && state.draft.details;
  if(!d) return false;
  return !!(String(d.email||'').trim() && isEmail(d.email) &&
            String(d.name||'').trim() && String(d.kgid||'').trim() &&
            String(d.designation||'').trim());
}
/* ಭಾಗ-1: every active question block needs its rating.
   ಭಾಗ-2: choice/rating need a chosen option, descriptive needs text. */
function isFeedbackComplete(t){
  if(!state.draft || !t) return false;
  const fb = state.draft.feedback || {};
  const blocks = part1Active(t);
  for(let i=0;i<blocks.length;i++){
    if(!(fb.ratings || {})[blocks[i].id]) return false;
  }
  const qs = part2Active(t);
  for(let i=0;i<qs.length;i++){
    const q = qs[i];
    const val = (fb.answers || {})[q.id];
    if(q.format === 'text'){
      if(!String(val||'').trim()) return false;
    }else if(!val){
      return false;
    }
  }
  return true;
}

function viewWorkflowShell(u){
  const t = getTraining(state.trainingId);
  if(!t){
    return '<div class="app-shell"><div class="main-col">' +
      topbar('ತರಬೇತಿ', INSTITUTE, u) +
      '<main class="main"><div class="card center">ತರಬೇತಿ ಕಾರ್ಯಕ್ರಮ ಲಭ್ಯವಿಲ್ಲ. <button class="btn btn-primary btn-sm" data-action="student-nav" data-to="dashboard">ಮರಳಿ</button></div></main></div></div>';
  }
  const sub = getSubmission(u.id, t.id);

  const stepsHtml = STAGES.map(s => {
    const accessible = stageAccessible(s.n);
    const cls = 'step' + (state.stage === s.n ? ' active' : '') +
      (state.stage > s.n ? ' done' : '') + (accessible ? ' clickable' : '');
    return '<div class="' + cls + '" data-action="goto-stage" data-n="' + s.n + '">' +
      '<div class="s-dot">' + (state.stage > s.n ? '✓' : s.n) + '</div>' +
      '<div class="s-label">' + esc(s.label) + '</div>' +
    '</div>';
  }).join('');

  let content = '';
  if(state.stage === 1)      content = stageDetails(t);
  else if(state.stage === 2) content = stageFeedback(t);
  else if(state.stage === 3) content = stageAssessment(t, sub);
  else if(state.stage === 4) content = stageResult(t, sub);
  else if(state.stage === 5) content = stageCertificate(t, sub);

  return '<div class="app-shell">' +
    '<aside class="sidebar" id="sidebar">' + sidebarBrand() +
      '<nav class="sb-nav">' +
        '<div class="sb-label">ತರಬೇತಿ</div>' +
        '<button class="nav-item" data-action="student-nav" data-to="dashboard">' + ICON.dashboard + '<span>ಡ್ಯಾಶ್‌ಬೋರ್ಡ್</span></button>' +
        '<button class="nav-item active" data-action="open-training" data-id="' + esc(t.id) + '">' + ICON.book + '<span>ಪ್ರಸ್ತುತ ತರಬೇತಿ</span></button>' +
        '<button class="nav-item" data-action="student-nav" data-to="result">' + ICON.results + '<span>ಫಲಿತಾಂಶ</span></button>' +
        '<button class="nav-item" data-action="student-nav" data-to="certificate">' + ICON.cert + '<span>ಪ್ರಮಾಣಪತ್ರ</span></button>' +
      '</nav>' +
      sidebarUserCard(u) +
    '</aside>' +
    '<div class="sidebar-overlay" id="sidebarOverlay" data-action="close-sidebar"></div>' +
    '<div class="main-col">' +
      topbar(trunc(t.title, 46), 'ತರಬೇತಿ ಅವಧಿ: ' + (dateRange(t.startDate, t.endDate) || '—'), u) +
      '<main class="main">' +
        '<div class="page-head">' +
          '<h2>' + esc(t.title) + '</h2>' +
          '<div class="ph-sub">ತರಬೇತಿ ಅವಧಿ: ' + esc(dateRange(t.startDate, t.endDate) || '—') + ' · ' + esc(t.institute || INSTITUTE) + '</div>' +
        '</div>' +
        '<div class="steps">' + stepsHtml + '</div>' +
        content +
      '</main>' +
    '</div>' +
  '</div>';
}

      '</div>' +
      '<span class="badge gold">ಹಂತ 1 / 5</span>' +

        '<input type="text" data-det="name" value="' + esc(d.name||'') + '" placeholder="ಪೂರ್ಣ ಹೆಸರು">' +
      '</label>' +
      '<label class="field"><span>ಕೆ.ಜಿ.ಐ.ಡಿ / ಹೆಚ್‌ ಆರ್‌ ಎಂಎಸ್‌ ಸಂಖ್ಯೆ *</span>' +

        '<div class="field-hint">ಈ ಹುದ್ದೆಯೇ ನಿಮ್ಮ ಪ್ರಮಾಣಪತ್ರದಲ್ಲಿ ಮುದ್ರಣವಾಗುತ್ತದೆ.</div>' +
      '</label>' +

        '<div class="card-soft" style="font-size:13.5px;line-height:1.8;">' +

          '<div><b>ಆರಂಭ:</b> ' + esc(displayDate(t.startDate) || '—') + '</div>' +
          '<div><b>ಅಂತ್ಯ:</b> ' + esc(displayDate(t.endDate) || '—') + '</div>' +
          '<div><b>ಸಂಸ್ಥೆ:</b> ' + esc(t.institute || INSTITUTE) + '</div>' +

    '</div>' +

    '</div>' +

/* ---------- STAGE 2 : FEEDBACK (ಭಾಗ-1 + ಭಾಗ-2) ---------- */
function stageFeedback(t){
  const fb = t.feedback || { part1:[], part2:[], notice:'' };
  const d = state.draft.feedback || { ratings:{}, answers:{} };

  /* the administrator's notice goes above everything else */
  const noticeText = String(fb.notice || '').trim();
  const noticeHtml = noticeText
    ? '<div class="card notice-card">' +
        '<div class="section-head">' +
          '<span class="sh-badge">ಸೂಚನೆ</span>' +
          '<span class="sh-title">ಪ್ರತಿಕ್ರಿಯೆ ನೀಡುವ ಮುನ್ನ ಗಮನಿಸಿ</span>' +
        '</div>' +
        '<div class="notice-body">' + esc(noticeText) + '</div>' +
      '</div>'
    : '';

  const blocks = part1Active(t);
  const part1Html = blocks.length
    ? blocks.map(function(b, i){ return part1ParticipantCard(b, i, d); }).join('')
    : '<p class="muted small" style="margin:0;">ಈ ತರಬೇತಿಗೆ ಭಾಗ-1 ಪ್ರಶ್ನೆಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.</p>';

  const qs = part2Active(t);
  const part2Html = qs.length
    ? qs.map(function(q, i){ return part2ParticipantCard(q, i, d); }).join('')
    : '<p class="muted small" style="margin:0;">ಈ ತರಬೇತಿಗೆ ಭಾಗ-2 ಪ್ರಶ್ನೆಗಳನ್ನು ಸೇರಿಸಲಾಗಿಲ್ಲ.</p>';

  return '<div class="stack">' +
    noticeHtml +
    '<div class="card">' +
      '<div class="section-head">' +
        '<span class="sh-badge">ಭಾಗ-1</span>' +
        '<span class="sh-title">ದಿನದ ಹಿಮ್ಮಾಹಿತಿ</span>' +
        '<span class="spacer"></span>' +
        '<span class="badge grey">' + esc(dateRange(t.startDate, t.endDate) || '—') + '</span>' +
      '</div>' +
      part1Html +
    '</div>' +
    '<div class="card">' +
      '<div class="section-head">' +
        '<span class="sh-badge">ಭಾಗ-2</span>' +
        '<span class="sh-title">ತರಬೇತಿ ಉಪಯುಕ್ತತೆ ಕುರಿತು ಹಿಮ್ಮಾಹಿತಿ</span>' +
      '</div>' +
      part2Html +
    '</div>' +
    '<div class="card">' +
      '<div class="form-msg" id="stageMsg"></div>' +
      '<div class="row row-end">' +
        '<button class="btn btn-ghost" data-action="stage-prev">← ಹಿಂದಿನ ಹಂತ</button>' +
        '<button class="btn btn-primary" data-action="stage-next">ಮುಂದಿನ ಹಂತ →</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}

/* one ಭಾಗ-1 block exactly as the administrator laid it out */
function part1ParticipantCard(b, i, d){
  const selected = (d.ratings || {})[b.id] || '';
  const pills = RATINGS.map(function(r){
    return '<label class="pill"><input type="radio" name="p1rate_' + esc(b.id) + '" value="' + esc(r) + '"' +
      ' data-p1rate="' + esc(b.id) + '"' + (selected === r ? ' checked' : '') +
      '><span>' + esc(r) + '</span></label>';
  }).join('');
  const sess = (str(b.sessionFrom) || str(b.sessionTo))
    ? 'ಅಧಿವೇಶನ ' + esc(b.sessionFrom || '?') + ' – ' + esc(b.sessionTo || b.sessionFrom || '?')
    : '';
  return '<div class="p1-card">' +
    '<div class="p1-card-top">' +
      (b.day ? '<span class="p1-chip">' + esc(b.day) + '</span>' : '') +
      (b.date ? '<span class="p1-chip light">' + esc(displayDate(b.date)) + '</span>' : '') +
      (sess ? '<span class="p1-chip light">' + sess + '</span>' : '') +
    '</div>' +
    (b.subject ? '<div class="p1-card-subject">ವಿಷಯ: ' + esc(b.subject) + '</div>' : '') +
    '<div class="p1-card-q">' + esc(b.question || ('ಪ್ರಶ್ನೆ ' + (i + 1))) + '</div>' +
    (str(b.lecturer).trim() ? '<div class="p1-card-meta"><span><b>ಉಪನ್ಯಾಸಕರು:</b> ' + esc(b.lecturer) + '</span></div>' : '') +
    '<div class="p1-card-rate">' +
      '<div class="rating-label">ನಿಮ್ಮ ಅಭಿಪ್ರಾಯ *</div>' +
      '<div class="rating-row">' + pills + '</div>' +
    '</div>' +
  '</div>';
}

/* one ಭಾಗ-2 question: choose / rating / descriptive */
function part2ParticipantCard(q, i, d){
  const val = (d.answers || {})[q.id];
  let control = '';
  if(q.format === 'text'){
    control = '<textarea class="q-big" data-fb="' + esc(q.id) + '" rows="6" ' +
      'placeholder="ನಿಮ್ಮ ಉತ್ತರವನ್ನು ಇಲ್ಲಿ ಬರೆಯಿರಿ...">' + esc(val || '') + '</textarea>';
  }else if(q.format === 'rating'){
    control = '<div class="scale-row">' + (q.options || []).map(function(o){
      return '<label class="scale"><input type="radio" name="fb_' + esc(q.id) + '" value="' + esc(o) + '"' +
        ' data-fbgroup="' + esc(q.id) + '"' + (val === o ? ' checked' : '') +
        '><span>' + esc(o) + '</span></label>';
    }).join('') + '</div>';
  }else{
    control = '<div class="rating-row">' + (q.options || []).map(function(o){
      return '<label class="pill"><input type="radio" name="fb_' + esc(q.id) + '" value="' + esc(o) + '"' +
        ' data-fbgroup="' + esc(q.id) + '"' + (val === o ? ' checked' : '') +
        '><span>' + esc(o) + '</span></label>';
    }).join('') + '</div>';
  }
  return '<div class="q-card" style="box-shadow:none;">' +
    '<div class="q-head"><div class="q-num">' + (i + 1) + '</div>' +
      '<div class="q-text">' + esc(q.text) + '</div>' +
    '</div>' + control +
  '</div>';
}

/* ---------- STAGE 3 : ASSESSMENT ---------- */
function stageAssessment(t, sub){
  if(sub){
    return '<div class="card center">' +
      '<h2>ಮೌಲ್ಯಮಾಪನ ಪೂರ್ಣಗೊಂಡಿದೆ</h2>' +
      '<p class="muted">ನೀವು ಈ ತರಬೇತಿಯ ಪ್ರವೇಶ ನಂತರ ಪರೀಕ್ಷೆಯನ್ನು ಈಗಾಗಲೇ ಪೂರ್ಣಗೊಳಿಸಿದ್ದೀರಿ. ಪುನಃ ಉತ್ತರಿಸಲು ಅವಕಾಶವಿಲ್ಲ.</p>' +
      '<button class="btn btn-primary" data-action="goto-stage" data-n="4">ಫಲಿತಾಂಶ ನೋಡಿ</button>' +
    '</div>';
  }

  const answers = state.draft.answers || {};
  const questionsHtml = t.questions.map((q, i) => {
    const opts = q.options.map((o, j) => {
      const key = 'ABCD'[j];
      const sel = String(answers[q.id]) === String(j);
      return '<label class="opt' + (sel ? ' selected' : '') + '">' +
        '<input type="radio" name="ans_' + esc(q.id) + '" value="' + j + '"' + (sel ? ' checked' : '') + '>' +
        '<span class="opt-key">' + key + ')</span>' +
        '<span class="opt-text">' + esc(o) + '</span>' +
      '</label>';
    }).join('');
    return '<div class="q-card">' +
      '<div class="q-head">' +
        '<div class="q-num">' + (i+1) + '</div>' +
        '<div class="q-text">' + esc(q.text) + '</div>' +
      '</div>' +
      '<div class="opt-group">' + opts + '</div>' +
    '</div>';
  }).join('');

  return '<div class="card" style="margin-bottom:18px;background:#FCFBF7;border-color:#E7E2D3;">' +
      '<div class="row" style="align-items:center;">' +
        '<div style="flex:1;min-width:200px;">' +
          '<h2 style="margin:0 0 4px;font-size:19px;">ಪ್ರವೇಶ ನಂತರ ಪರೀಕ್ಷೆ</h2>' +
          '<div class="small" style="color:#3A4658;line-height:1.8;">' + esc(t.title) + '</div>' +
        '</div>' +
        '<div style="text-align:right;">' +
          '<div class="badge blue">ಅವಧಿ: ' + esc(dateRange(t.startDate, t.endDate) || '—') + '</div>' +
          '<div class="badge gold" style="margin-top:6px;">ಒಟ್ಟು ' + t.questions.length + ' ಅಂಕಗಳು</div>' +
        '</div>' +
      '</div>' +
    '</div>' +
    '<div>' + questionsHtml + '</div>' +
    '<div class="card">' +
      '<div class="form-msg" id="stageMsg"></div>' +
      '<p class="muted small">ಎಲ್ಲಾ ' + t.questions.length + ' ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿದ ನಂತರವೇ ಸಲ್ಲಿಸಲು ಸಾಧ್ಯ. ಉತ್ತೀರ್ಣ ಮಿತಿ: ' + (t.passing||70) + '%</p>' +
      '<div class="row row-end">' +
        '<button class="btn btn-ghost" data-action="stage-prev">← ಹಿಂದಿನ ಹಂತ</button>' +
        '<button class="btn btn-primary" data-action="submit-assessment">ಪರೀಕ್ಷೆ ಸಲ್ಲಿಸಿ</button>' +
      '</div>' +
    '</div>';
}

/* ---------- STAGE 4 : RESULT ---------- */
function stageResult(t, sub){
  if(!sub){
    return '<div class="card center"><h2>ಫಲಿತಾಂಶ ಲಭ್ಯವಿಲ್ಲ</h2>' +
      '<p class="muted">ದಯವಿಟ್ಟು ಮೊದಲು ಮೌಲ್ಯಮಾಪನ ಪರೀಕ್ಷೆಯನ್ನು ಪೂರ್ಣಗೊಳಿಸಿ.</p>' +
      '<button class="btn btn-primary" data-action="goto-stage" data-n="3">ಮೌಲ್ಯಮಾಪನಕ್ಕೆ ಹೋಗಿ</button></div>';
  }
  const r = sub.result;
  const radius = 52;
  const circ = 2 * Math.PI * radius;
  const offset = circ * (1 - r.pct / 100);

  return '<div class="result-hero">' +
      '<div class="badge ' + (r.passed ? 'green' : 'red') + '" style="margin-bottom:14px;">' +
        (r.passed ? 'ಉತ್ತೀರ್ಣ' : 'ಅನುತ್ತೀರ್ಣ') + '</div>' +
      '<div class="ring">' +
        '<svg viewBox="0 0 120 120">' +
          '<circle class="ring-bg" cx="60" cy="60" r="' + radius + '"></circle>' +
          '<circle class="ring-fg' + (r.passed ? '' : ' fail') + '" cx="60" cy="60" r="' + radius + '" ' +
            'style="stroke-dasharray:' + circ.toFixed(2) + ';stroke-dashoffset:' + offset.toFixed(2) + '"></circle>' +
        '</svg>' +
        '<div class="ring-label"><strong>' + r.marks + '/' + r.total + '</strong><span>' + r.pct + '%</span></div>' +
      '</div>' +
      '<h2 style="margin-bottom:6px;">' + (r.passed ? 'ಅಭಿನಂದನೆಗಳು!' : 'ಪ್ರಯತ್ನಕ್ಕೆ ಧನ್ಯವಾದಗಳು') + '</h2>' +
      '<p class="muted" style="max-width:520px;margin:0 auto;">' +
        (r.passed
          ? 'ನೀವು ಯಶಸ್ವಿಯಾಗಿ ಮೌಲ್ಯಮಾಪನವನ್ನು ಪೂರ್ಣಗೊಳಿಸಿದ್ದೀರಿ. ನಿಮ್ಮ ಪ್ರಮಾಣಪತ್ರವನ್ನು ಈಗ ನೋಡಬಹುದು.'

/* The participant's designation: the one stored with the submission (the
   marking RPC copies it from the profile), then the profile itself. Existing
   submissions keep working because their profile is always available. */
function designationFor(sub){
  /* what the participant typed at the details stage is captured with the
     submission; the snapshot the marking RPC took from the profile and the
     profile itself are the fallbacks for older rows */
  if(sub && sub.feedback && str(sub.feedback.designation).trim()) return str(sub.feedback.designation);
  if(sub && str(sub.designation).trim()) return str(sub.designation);
  if(!sub) return '';
  const u = DB.users.find(function(x){ return x.id === sub.userId; });
  if(u && str(u.designation).trim()) return str(u.designation);
  if(AUTH.profile && AUTH.profile.id === sub.userId) return str(AUTH.profile.designation);
  return '';
}

/* ============================================================
   SECTION I — ASSESSMENT SCORING & SUBMISSION
   ============================================================ */
/* Marking is NOT done here. The paper is sent to submit_assessment, which
   reads the answer key from private.training_answer_keys, awards the marks,
   decides pass/fail and mints the register serial — all inside one
   transaction. The browser never sees the key or computes a score. */

function submitAssessment(){
  const u = currentUser();
  const t = getTraining(state.trainingId);
  if(!u || !t) return;

  /* duplicate guard — the database has the final say (one submission per
     student per training), this only saves a round trip */
  if(getSubmission(u.id, t.id)){
    toast('ನೀವು ಈಗಾಗಲೇ ಈ ಪರೀಕ್ಷೆಯನ್ನು ಸಲ್ಲಿಸಿದ್ದೀರಿ.','error');
    state.stage = 4; render(); return;
  }

  const answers = state.draft.answers || {};
  const missing = t.questions.filter(q => answers[q.id] === undefined || answers[q.id] === null || answers[q.id] === '');
  if(missing.length){
    showStageMsg('ಎಲ್ಲಾ ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ. ಬಾಕಿ ಇರುವ ಪ್ರಶ್ನೆಗಳು: ' + missing.length, 'error');
    toast('ದಯವಿಟ್ಟು ಎಲ್ಲಾ ' + t.questions.length + ' ಪ್ರಶ್ನೆಗಳಿಗೆ ಉತ್ತರಿಸಿ.','error');
    return;
  }

  const details = state.draft.details || {};

  /* Marking happens ONLY inside the submit_assessment RPC: the answer key
     never reaches the browser, and the certificate serial is minted in
     the same transaction. */
  showStageMsg('ಸಲ್ಲಿಸಲಾಗುತ್ತಿದೆ…', 'ok');
  toast('ಪರೀಕ್ಷೆ ಸಲ್ಲಿಸಲಾಗುತ್ತಿದೆ…', 'info');

  /* The marking RPC stores the designation from the profile (which the
     details stage writes back). It is copied into the feedback payload as a
     backup so the certificate always has it. */
  const feedbackPayload = deepCopy(state.draft.feedback || { ratings:{}, answers:{} });
  feedbackPayload.designation = String(details.designation || u.designation || '').trim();

  const payload = {
    p_training_id: t.id,
    p_answers: deepCopy(answers),
    p_feedback: feedbackPayload,
    p_official_name: String(details.name || u.name || '').trim(),
    p_kgid: String(details.kgid || u.kgid || '').trim(),
    p_email: String(details.email || u.email || '').trim()
  };

  sb.rpc('submit_assessment', payload)
    .then(function(res){
      if(res.error) throw res.error;
      return res.data || {};
    })
    .then(function(result){
      dropDraft();
      return Promise.all([loadSubmissionsForRead(), loadCertificatesForRead()]).then(function(){
        state.stage = 4;
        render();
        const passed = !!result.passed;
        toast(passed
          ? 'ಪರೀಕ್ಷೆ ಯಶಸ್ವಿಯಾಗಿ ಸಲ್ಲಿಸಲಾಗಿದೆ. ಅಭಿನಂದನೆಗಳು!'
          : 'ಪರೀಕ್ಷೆ ಸಲ್ಲಿಸಲಾಗಿದೆ.', passed ? 'success' : 'info');
        if(result.certificate_serial){
          toast('ಪ್ರಮಾಣಪತ್ರ ಸಂಖ್ಯೆ: ' + result.certificate_serial, 'success');
        }
      });
    })
    .catch(function(err){
      console.warn('[submit] failed', err && (err.message || err.code));
      const text = dataErrorMessage(err);
      showStageMsg(text, 'error');
      toast(text, 'error');
      /* a duplicate means someone already got through — show their result */
      if(String((err && err.message) || '') === 'already-submitted' || (err && err.code === '23505')){
        loadSubmissionsForRead().then(function(){ state.stage = 4; render(); });
      }
    });
}

function showStageMsg(text, type){
  const el = document.getElementById('stageMsg');
  if(!el) return;
  el.className = 'form-msg show ' + (type || 'error');
  el.textContent = text;
}

          : '<button class="btn btn-ghost btn-sm" data-action="publish-training" data-id="' + esc(t.id) + '">ಪ್ರಕಟಿಸಿ</button>') +

  const deletedList = deleted.map(function(t){
    const subs = submissionsForTraining(t.id).length;
    return '<div class="del-row">' +
      '<span class="del-txt"><b>' + esc(t.title) + '</b><br>' +

        '<button class="btn btn-ghost btn-sm" data-action="training-restore" data-id="' + esc(t.id) + '">ಮರುಸ್ಥಾಪಿಸಿ</button>' +
        '<button class="btn btn-danger btn-sm" data-action="training-purge" data-id="' + esc(t.id) + '">ಶಾಶ್ವತವಾಗಿ ಅಳಿಸಿ</button>' +

  return '' +
  '<div class="page-head"><h2>ತರಬೇತಿ ನಿರ್ವಹಣೆ</h2>' +
    '<div class="ph-sub">ತರಬೇತಿ, ಭಾಗ-1 ಮತ್ತು ಭಾಗ-2 ಪ್ರಶ್ನೆಗಳನ್ನು ಇಲ್ಲಿ ನಿರ್ವಹಿಸಿ</div></div>' +
  '<div class="row" style="margin-bottom:18px;">' +
    '<button class="btn btn-primary" data-action="new-training">+ ಹೊಸ ತರಬೇತಿ ಸೇರಿಸಿ</button>' +
  '</div>' +
  (activeList || '<div class="card center muted">ಯಾವುದೇ ಸಕ್ರಿಯ ತರಬೇತಿಗಳು ಇಲ್ಲ.</div>') +
  (deleted.length
    ? '<div class="card" style="margin-top:6px;">' +
        '<div class="subhead" style="margin-top:0;"><h3>ಅಳಿಸಿದ ತರಬೇತಿಗಳು</h3>' +
          '<span class="muted small">ಮರುಸ್ಥಾಪಿಸಬಹುದು — ದಾಖಲೆಗಳು ಅಳಿಸಿಹೋಗಿಲ್ಲ</span></div>' +
        '<div class="del-list">' + deletedList + '</div>' +

    : '');
}

    },
