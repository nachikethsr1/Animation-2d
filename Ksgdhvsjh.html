function draftFromTraining(t){
  const fb = t.feedback || {};
  return {
    isNew:false,
    id:t.id,
    title:t.title,
    startDate: t.startDate || '',
    endDate: t.endDate || '',
    accent:t.accent || '#1D3557',
    institute:t.institute || INSTITUTE,
    passing:Number(t.passing) || 70,
    published: t.published !== false,
    archived: !!t.archived,
    feedback: {
      notice: str(fb.notice),
      part1: deepCopy(fb.part1 || []),
      part2: deepCopy(fb.part2 || []),
      scope:{ day:'one', date:'one', sessions:'one' }
    },
    /* The answer key is not readable from the browser, so an existing
       training opens with "not set" (null) on each question. The admin
       must pick the correct option again to change the key; leaving it
       as null means "keep the stored key untouched". */
    questions: t.questions.map(q => ({
      id:q.id,
      text:q.text,
      options: q.options.slice(),
      marks: Number(q.marks) || 1,
      correct: null
    }))
  };
}

/* ---- ಭಾಗ-1 editor -------------------------------------------------------
   Day, date and session range can each be edited for every block at once
   ("Edit for All") or for one block only ("Edit for One"). The choice is
   made right under the field, and clicking the field highlights it.
   ---------------------------------------------------------------------- */
function p1ScopeControl(fieldKey, mode){
  const one = mode !== 'all';
  return '<div class="scope' + (one ? '' : ' all') + '" data-scope-for="' + esc(fieldKey) + '">' +
    '<span class="scope-lbl">ಸಂಪಾದನೆ:</span>' +
    '<button type="button" class="scope-btn' + (one ? ' active' : '') + '"' +
      ' data-action="p1-scope" data-f="' + esc(fieldKey) + '" data-mode="one">ಒಂದಕ್ಕೆ (Edit for One)</button>' +
    '<button type="button" class="scope-btn' + (one ? '' : ' active') + '"' +
      ' data-action="p1-scope" data-f="' + esc(fieldKey) + '" data-mode="all">ಎಲ್ಲಕ್ಕೂ (Edit for All)</button>' +
  '</div>';
}

  return '<div class="p1-block">' +
    '<div class="p1-head">' +

      '<div class="qedit-tools">' +
        '<button type="button" class="danger" data-action="p1-del" data-i="' + i + '" title="ಈ ಪ್ರಶ್ನೆಯನ್ನು ಅಳಿಸಿ">✕</button>' +

    '</div>' +

    '<div class="p1-dayrow">' +

        '<span>ದಿನ</span>' +

          ' value="' + esc(b.day) + '" placeholder="ಉದಾ: ಸೋಮವಾರ">' +
        p1ScopeControl('day', scope.day) +
      '</div>' +
      '<div class="p1-mini">' +
        '<span>ದಿನಾಂಕ</span>' +

      '<div>' +

          '<input type="text" inputmode="numeric" data-p1="' + i + '" data-p1f="sessionFrom"' +
            ' value="' + esc(b.sessionFrom) + '" placeholder="1" aria-label="ಆರಂಭ ಅಧಿವೇಶನ">' +
          '<span class="sess-dash">–</span>' +
          '<input type="text" inputmode="numeric" data-p1="' + i + '" data-p1f="sessionTo"' +

      '<textarea class="q-big" rows="8" data-p1="' + i + '" data-p1f="question"' +
        ' placeholder="ಇಲ್ಲಿ ಕನ್ನಡ ಪ್ರಶ್ನೆಯನ್ನು ಬರೆಯಿರಿ…">' + esc(b.question) + '</textarea>' +

/* ---------- Training save ---------- */
function saveTraining(){
  const d = state.editing;
  if(!d) return;

  const errors = [];
  if(!str(d.title).trim()) errors.push('ತರಬೇತಿ ಶೀರ್ಷಿಕೆ ಅಗತ್ಯ.');
  if(!str(d.startDate).trim()) errors.push('ತರಬೇತಿ ಆರಂಭ ದಿನಾಂಕ ಅಗತ್ಯ.');
  if(!str(d.endDate).trim()) errors.push('ತರಬೇತಿ ಅಂತ್ಯ ದಿನಾಂಕ ಅಗತ್ಯ.');
  if(str(d.startDate).trim() && str(d.endDate).trim() && str(d.endDate) < str(d.startDate)){
    errors.push('ಅಂತ್ಯ ದಿನಾಂಕವು ಆರಂಭ ದಿನಾಂಕಕ್ಕಿಂತ ಹಿಂದೆ ಇರಬಾರದು.');
  }

  const passing = Number(d.passing);
  if(!passing || passing < 1 || passing > 100) errors.push('ಉತ್ತೀರ್ಣ ಶೇಕಡಾವಾರು 1 ಮತ್ತು 100 ರ ನಡುವೆ ಇರಬೇಕು.');

  if(!Array.isArray(d.questions) || d.questions.length === 0) errors.push('ಕನಿಷ್ಠ ಒಂದು ಮೌಲ್ಯಮಾಪನ ಪ್ರಶ್ನೆ ಅಗತ್ಯ.');

  (d.questions||[]).forEach((q, i) => {
    if(!String(q.text||'').trim()) errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ಪ್ರಶ್ನೆ ಪಠ್ಯ ಅಗತ್ಯ.');
    const opts = (q.options||[]).map(o => String(o||'').trim());
    if(opts.length !== 4 || opts.some(o => !o)){
      errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ನಾಲ್ಕು ಆಯ್ಕೆಗಳು ಅಗತ್ಯ.');
    }
    /* a brand new paper needs every key; an existing one may keep the
       stored key (the browser cannot show it, so "not set" is legal) */
    const hasKey = q.correct !== null && q.correct !== undefined && String(q.correct) !== '';
    const c = hasKey ? Number(q.correct) : NaN;
    if(hasKey && (isNaN(c) || c < 0 || c > 3)){
      errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');
    }
    if(!hasKey && d.isNew){
      errors.push('ಪ್ರಶ್ನೆ ' + (i+1) + ': ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಆಯ್ಕೆಮಾಡಿ.');
    }
  });

  const fbDraft = d.feedback || {};
  /* ಭಾಗ-1: only the blocks that are not deleted are validated */
  (fbDraft.part1 || []).forEach((b, i) => {
    if(b.deleted) return;
    if(!str(b.question).trim()) errors.push('ಭಾಗ-1 ಪ್ರಶ್ನೆ ' + (i+1) + ': ಮುಖ್ಯ ಪ್ರಶ್ನೆ ಅಗತ್ಯ.');
  });
  /* ಭಾಗ-2: choice / rating need at least two options; text needs none */
  (fbDraft.part2 || []).forEach((q, i) => {
    if(q.deleted) return;
    if(!str(q.text).trim()) errors.push('ಭಾಗ-2 ಪ್ರಶ್ನೆ ' + (i+1) + ': ಪ್ರಶ್ನೆ ಪಠ್ಯ ಅಗತ್ಯ.');
    if(q.format !== 'text'){
      const opts = (q.options || []).map(o => str(o).trim()).filter(Boolean);
      if(opts.length < 2) errors.push('ಭಾಗ-2 ಪ್ರಶ್ನೆ ' + (i+1) + ': ಕನಿಷ್ಠ ಎರಡು ಆಯ್ಕೆಗಳು ಅಗತ್ಯ.');
    }
  });

  const msg = document.getElementById('adminFormMsg');
  if(errors.length){
    if(msg){
      msg.className = 'form-msg show error';
      msg.innerHTML = errors.map(e => '• ' + esc(e)).join('<br>');
    }
    toast('ದಯವಿಟ್ಟು ದೋಷಗಳನ್ನು ಸರಿಪಡಿಸಿ.','error');
    return;
  }

  /* ---- build the writes: training row, question rows, answer key ---- */
  const isNew = !!d.isNew;
  const trainingId = isNew ? ('t_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6)) : d.id;

  const questions = d.questions.map(function(q, idx){
    return {
      id: q.id || uid('q'),
      text: String(q.text).trim(),
      options: q.options.map(function(o){ return String(o).trim(); }),
      marks: Number(q.marks) || 1,
      position: idx
    };
  });

  /* only the questions the admin actually set a key for go into the RPC;
     an untouched question keeps whatever key is already stored server-side */
  const answerKey = {};
  d.questions.forEach(function(q){
    const hasKey = q.correct !== null && q.correct !== undefined && String(q.correct) !== '';
    if(hasKey) answerKey[q.id] = Number(q.correct) || 0;
  });

  const part1 = (fbDraft.part1 || []).map(function(b, i){ return normalizePart1Block(b, i); });
  const part2 = (fbDraft.part2 || []).map(function(q, i){ return normalizePart2Question(q, i); });
  const startDate = str(d.startDate).trim();
  const endDate = str(d.endDate).trim();

  const row = {
    id: trainingId,
    title: String(d.title).trim(),
    start_date: startDate,
    end_date: endDate,
    /* the legacy single date column stays in step so existing reports,
       certificates and archive views keep a readable date */
    date: dateRange(startDate, endDate),
    accent: d.accent || '#1D3557',
    institute: d.institute || INSTITUTE,
    passing: passing,
    feedback_notice: str(fbDraft.notice || '').trim(),
    feedback_version: 1,
    feedback_part1: part1,
    feedback_part2: part2
  };
  /* a brand new training goes live immediately, as it did before; an edit
     keeps whatever publish/archive state the row already had */
  row.published = isNew ? true : (d.published !== false);
  row.archived = isNew ? false : !!d.archived;

  const questionRows = questions.map(function(q){
    return {
      training_id: trainingId,
      id: q.id,
      position: q.position,
      text: q.text,
      options: q.options,
      marks: q.marks
    };
  });

  if(msg){ msg.className = 'form-msg'; msg.innerHTML = ''; }
  toast('ಉಳಿಸಲಾಗುತ್ತಿದೆ…','info');

  /* one write pass: the training row, then the paper, then the answer key */
  const writeAll = function(){
    return sb.from('trainings').upsert(row, { onConflict:'id' })
      .then(function(res){ if(res.error) throw res.error; })
      /* replace the paper wholesale — an edit may add, remove or reorder */
      .then(function(){ return sb.from('training_questions').delete().eq('training_id', trainingId); })
      .then(function(res){ if(res.error) throw res.error; })
      .then(function(){
        if(!questionRows.length) return null;
        return sb.from('training_questions').insert(questionRows);
      })
      .then(function(res){ if(res && res.error) throw res.error; })
      .then(function(){
        if(!Object.keys(answerKey).length) return null;
        return sb.rpc('admin_save_answer_key', {
          p_training_id: trainingId,
          p_answer_key: answerKey
        });
      })
      .then(function(res){ if(res && res.error) throw res.error; });
  };

  writeAll()
    .then(function(){
      state.editing = null;
      return reloadPortalData();
    })
    .then(function(){
      toast(isNew ? 'ಹೊಸ ತರಬೇತಿ ಯಶಸ್ವಿಯಾಗಿ ಸೇರಿಸಲಾಗಿದೆ.' : 'ತರಬೇತಿ ಯಶಸ್ವಿಯಾಗಿ ಸಂಪಾದಿಸಲಾಗಿದೆ.', 'success');
    })
    .catch(function(err){
      const raw = String((err && (err.message || err.details || err.hint)) || '');
      const newColumns = ['feedback_notice','feedback_version','feedback_part1','feedback_part2','start_date','end_date'];
      const missingNew = newColumns.some(function(c){ return raw.indexOf(c) > -1; });

      /* A project that has not run the training-system migration yet: keep
         the data by storing the two sections in the legacy jsonb columns
         and dropping the new ones. normalizePart1/normalizePart2 detect the
         shape on the way back in, so nothing is lost. */
      if(missingNew){
        toast('ಈ ಡೇಟಾಬೇಸ್‌ನಲ್ಲಿ ಹೊಸ ಕಾಲಮ್‌ಗಳಿಲ್ಲ — ಹೊಂದಾಣಿಕೆಯ ಸ್ವರೂಪದಲ್ಲಿ ಉಳಿಸಲಾಗುತ್ತಿದೆ.', 'info');
        row.feedback_sessions = part1;
        row.feedback_questions = part2;
        delete row.feedback_notice;
        delete row.feedback_version;
        delete row.feedback_part1;
        delete row.feedback_part2;
        delete row.start_date;
        delete row.end_date;
        return writeAll()
          .then(function(){
            state.editing = null;
            return reloadPortalData();
          })
          .then(function(){ toast('ತರಬೇತಿ ಉಳಿಸಲಾಗಿದೆ.', 'success'); });
      }

      console.warn('[training] save failed', err && (err.message || err.code));
      const text = dataErrorMessage(err);
      if(msg){ msg.className = 'form-msg show error'; msg.textContent = text; }
      toast(text, 'error');
    });
}

function applyResultFilter(){
  const tSel = document.getElementById('fTraining');
  const qInp = document.getElementById('fQuery');
  const cSel = document.getElementById('fCert');
  const table = document.getElementById('resultsTable');
  if(!table) return;

  const tid = tSel ? tSel.value : '';
  const q = qInp ? qInp.value.trim().toLowerCase() : '';
  const cert = cSel ? cSel.value : '';

  $$('#resultsTable tbody tr').forEach(tr => {
    const rowTraining = tr.getAttribute('data-training') || '';
    const rowCert = tr.getAttribute('data-cert') || '';
    const text = tr.textContent.toLowerCase();
    let show = true;
    if(tid && rowTraining !== tid) show = false;
    if(q && text.indexOf(q) === -1) show = false;
    if(cert && rowCert !== cert) show = false;
    tr.style.display = show ? '' : 'none';
  });
}

function exportCSV(){
  const tSel = document.getElementById('fTraining');
  const qInp = document.getElementById('fQuery');
  const cSel = document.getElementById('fCert');
  const tid = tSel ? tSel.value : '';
  const q = qInp ? qInp.value.trim().toLowerCase() : '';
  const cert = cSel ? cSel.value : '';

  let rows = DB.submissions.slice().sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
  rows = rows.filter(s => {
    if(tid && s.trainingId !== tid) return false;
    if(cert === 'yes' && !s.result.passed) return false;
    if(cert === 'no' && s.result.passed) return false;
    if(q){
      const hay = ((s.details.name||'') + ' ' + (s.details.email||'') + ' ' + (s.userName||'')).toLowerCase();
      if(hay.indexOf(q) === -1) return false;
    }
    return true;
  });

  if(!rows.length){ toast('ರಫ್ತು ಮಾಡಲು ಯಾವುದೇ ದಾಖಲೆಗಳಿಲ್ಲ.','error'); return; }

  const header = ['ವಿದ್ಯಾರ್ಥಿಯ ಹೆಸರು','ಇ-ಮೇಲ್','ಕೆ.ಜಿ.ಐ.ಡಿ / HRMS','ತರಬೇತಿ','ಅಂಕಗಳು','ಒಟ್ಟು','ಶೇಕಡಾವಾರು','ಸ್ಥಿತಿ','ಪ್ರಮಾಣಪತ್ರ ಸಂಖ್ಯೆ','ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ'];
  const lines = [header];
  rows.forEach(s => {
    lines.push([
      s.details.name || s.userName,
      s.details.email || '',
      s.details.kgid || '',
      s.trainingTitle,
      s.result.marks,
      s.result.total,
      s.result.pct + '%',
      s.result.passed ? 'ಉತ್ತೀರ್ಣ' : 'ಅನುತ್ತೀರ್ಣ',
      s.certificateNo || '-',
      fmtDateTime(s.submittedAt)
    ]);
  });

  const csv = '\uFEFF' + lines.map(r => r.map(c => '"' + String(c).replace(/"/g,'""') + '"').join(',')).join('\r\n');
  try{
    const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dti-bengaluru-results-' + Date.now() + '.csv';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=> URL.revokeObjectURL(url), 1500);
    toast('CSV ಫೈಲ್ ಡೌನ್‌ಲೋಡ್ ಆಗಿದೆ.','success');
  }catch(e){
    toast('CSV ರಫ್ತು ವಿಫಲವಾಯಿತು.','error');
  }
}

/* how many ಭಾಗ-1 / ಭಾಗ-2 questions a submission answered */
function feedbackAnswerCounts(sub, t){
  const p1 = part1Active(t), p2 = part2Active(t);
  let a1 = 0, a2 = 0;
  p1.forEach(function(b, i){
    const ratings = (sub.feedback && sub.feedback.ratings) || {};
    if(ratings[b.id] || ratings[String(i)]) a1 += 1;
  });
  p2.forEach(function(q){
    if(sub.feedback && sub.feedback.answers && str(sub.feedback.answers[q.id]).trim()) a2 += 1;
  });
  return { p1:a1, p1Total:p1.length, p2:a2, p2Total:p2.length };
}

function trainingVisibility(id, patch){
  const t = getTraining(id);
  if(!t) return;
  const row = {};
  if('published' in patch) row.published = !!patch.published;
  if('archived'  in patch) row.archived  = !!patch.archived;
  if(!Object.keys(row).length) return;

  sb.from('trainings').update(row).eq('id', id)
    .then(function(res){
      if(res.error) throw res.error;
      toast('ಸ್ಥಿತಿ ನವೀಕರಿಸಲಾಗಿದೆ.', 'success');
      return reloadPortalData();
    })
    .catch(function(err){
      console.warn('[training] visibility failed', err && (err.message || err.code));
      toast(dataErrorMessage(err), 'error');
    });
}

/* ============================================================
   SECTION K.5 — CERTIFICATE DESIGNER (custom background support)
   ============================================================ */
const CERT_DESIGN_KEY = 'dti_cert_design_v1';
const CERT_BG_KEY     = 'dti_cert_bg_v1';
const CERT_FONTS = {
  kn:    { css:"'Noto Sans Kannada',sans-serif",        label:'Kannada' },
  serif: { css:"Georgia,'Times New Roman',serif",       label:'Serif' },
  sans:  { css:"system-ui,-apple-system,'Segoe UI',sans-serif", label:'Sans' },
  mono:  { css:"ui-monospace,Menlo,Consolas,monospace", label:'Mono' }
};

let certDesState = { design:null, bg:'', selectedId:null, dragging:null };

function defaultCertDesign(){
  return { useCustom:false, aspect:1.414, fields:[] };
}

/* Only the six supported automatic labels are kept. An older design that
   still carries Training Topic / Marks / Email / Training Date fields is
   mapped onto the new labels (Training Date -> Training Start Date) and the
   rest are dropped, so the designer never shows an outdated label again.
   Static text placed by hand is left untouched: it carries no data. */
function normalizeCertFields(fields){
  const seen = {};
  const out = [];
  (Array.isArray(fields) ? fields : []).forEach(function(f){
    if(!f || !f.id) return;
    if(f.type !== 'auto'){ out.push(f); return; }
    const key = CERT_KEY_ALIASES[f.key];
    if(!key) return;                       /* outdated automatic label */
    if(seen[key]) return;                  /* same label twice */
    seen[key] = true;
    out.push(Object.assign({}, f, { key: key, type:'auto' }));
  });
  return out;
}
function sanitizeCertDesign(design){
  const d = design || defaultCertDesign();
  return {
    useCustom: !!d.useCustom,
    aspect: Number(d.aspect) || 1.414,
    fields: normalizeCertFields(d.fields)
  };
}

function loadCertDesign(){
  try{
    const raw = localStorage.getItem(CERT_DESIGN_KEY);
    if(raw){
      const d = JSON.parse(raw);
      if(d && Array.isArray(d.fields)) return sanitizeCertDesign(d);
    }
  }catch(e){}
  return defaultCertDesign();
}
function saveCertDesign(design){
  try{ localStorage.setItem(CERT_DESIGN_KEY, JSON.stringify(design)); return true; }
  catch(e){ toast('Design could not be saved (storage limit).','error'); return false; }
}
function loadCertBg(){
  try{ return localStorage.getItem(CERT_BG_KEY) || ''; }catch(e){ return ''; }
}
function saveCertBg(dataUrl){
  try{ localStorage.setItem(CERT_BG_KEY, dataUrl); return true; }
  catch(e){ toast('Background image could not be saved (storage limit). Try a smaller PNG.','error'); return false; }
}
function clearCertBg(){ try{ localStorage.removeItem(CERT_BG_KEY); }catch(e){} }
/* The authoritative design comes from certificate_design and is cached in
   localStorage by loadCertificateDesign(); the in-memory copy wins when it
   is present so a freshly saved design renders without a reload. */
function getActiveCertDesign(){
  if(certDesState.design){
    return { design: certDesState.design, bg: certDesState.bg || loadCertBg() };
  }
  return { design: loadCertDesign(), bg: loadCertBg() };
}

const certPreview = { studentId:'', trainingId:'' };

function certPreviewStudents(){

function autoFieldValue(key, sample){
  const s = sample || {};
  switch(key){
    case 'studentName':   return s.studentName   || '';
    case 'designation':   return s.designation   || '';
    case 'kgid':          return s.kgid          || '';
    case 'trainingName':  return s.trainingName  || '';
    case 'trainingStart': return s.trainingStart || '';
    case 'trainingEnd':   return s.trainingEnd   || '';
    default:              return '';
  }
}
function certFieldStyle(field){
  const fontDef = CERT_FONTS[field.fontFamily] || CERT_FONTS.kn;
  const align = ['left','center','right'].indexOf(field.align) !== -1 ? field.align : 'left';
  const color = /^#[0-9a-fA-F]{3,8}$/.test(field.color || '') ? field.color : '#14243A';
  const fs = Math.max(0.5, Math.min(30, Number(field.fontSize) || 3));
  const w = Math.max(5, Math.min(100, Number(field.w) || 30));
  const x = Math.max(0, Math.min(100, Number(field.x) || 0));
  const y = Math.max(0, Math.min(100, Number(field.y) || 0));
  return 'left:' + x.toFixed(3) + '%;top:' + y.toFixed(3) + '%;width:' + w.toFixed(3) + '%;' +
         'font-size:' + fs.toFixed(3) + 'cqh;' +
         'font-family:' + fontDef.css + ';' +
         'color:' + color + ';' +
         'text-align:' + align + ';' +
         'font-weight:' + (field.bold ? '700' : '500') + ';';
}

}
function updateEditorField(field){
  const el = document.querySelector('[data-cd-id="' + field.id + '"]');
  if(!el) return;
  const sample = certSampleData();
  const text = field.type === 'auto' ? autoFieldValue(field.key, sample) : (field.text || '');

  el.innerHTML = esc(text) + '<span class="cd-handle"></span>';

    '<option value="' + k + '"' + (field.fontFamily === k ? ' selected' : '') + '>' + CERT_FONTS[k].label + '</option>'

/* ---- Editor interaction ---- */
function selectCertField(id){
  certDesState.selectedId = id;
  $$('.certdes-field').forEach(el => {
    el.classList.toggle('selected', el.getAttribute('data-cd-id') === id);
  });
  const panel = document.getElementById('certdesProps');
  if(panel){
    const field = certDesState.design.fields.find(f => f.id === id);
    panel.innerHTML = '<h4>4. Field Properties</h4>' +
      (field ? renderFieldPanel(field) : '<div class="certdes-info">Select a field.</div>');
    bindCertDesInputs();
  }
}
function syncCertFieldPanel(field){
  const panel = document.getElementById('certdesProps');
  if(!panel) return;
  ['x','y','w'].forEach(p => {
    const inp = panel.querySelector('[data-cd-prop="' + p + '"]');
    if(inp) inp.value = (Number(field[p]) || 0).toFixed(1);
  });
}
function bindCertDesInputs(){
  $$('[data-cd-preview]').forEach(function(el){
    el.addEventListener('change', function(){
      const which = el.getAttribute('data-cd-preview');
      if(which === 'student') certPreview.studentId = el.value;
      if(which === 'training') certPreview.trainingId = el.value;
      render();
      window.scrollTo({ top:0, behavior:'smooth' });
    });
  });
  $$('[data-cd-prop]').forEach(el => {
    el.addEventListener('input', function(){
      if(!certDesState.selectedId || !certDesState.design) return;
      const field = certDesState.design.fields.find(f => f.id === certDesState.selectedId);
      if(!field) return;
      const prop = el.getAttribute('data-cd-prop');
      let v = el.value;
      if(['x','y','w','fontSize'].indexOf(prop) !== -1) v = Number(v) || 0;
      if(prop === 'bold') v = v === '1';
      field[prop] = v;
      updateEditorField(field);
    });
  });
  const chk = document.getElementById('certUseCustom');
  if(chk && !chk.__cdBound){
    chk.__cdBound = true;
    chk.addEventListener('change', function(){
      if(certDesState.design) certDesState.design.useCustom = chk.checked;
    });
  }
}

/* ---- Persist the designer (this browser only) ---- */
/* Upload a pending data: URL into the private bucket and return its path.
   The bucket policies only let an approved admin write (max 5 MB, png/jpeg). */
function uploadCertBackground(dataUrl){
  const blob = dataUrlToBlob(dataUrl);
  if(blob.size > 5 * 1024 * 1024) return Promise.reject(new Error('image-too-large (max 5MB)'));
  const ext = (blob.type || '').indexOf('jpeg') > -1 ? 'jpg' : 'png';
  const path = 'backgrounds/certificate-' + Date.now().toString(36) + '.' + ext;
  return sb.storage.from(CERT_BUCKET)
    .upload(path, blob, { contentType: blob.type || 'image/png', upsert: false })
    .then(function(res){
      if(res && res.error) throw res.error;
      return path;
    });
}

/* Delete the previous background once a new one has replaced it. A failure
   here is only a stray file in the bucket, never a broken certificate, so
   it is logged and ignored. */
function deleteCertBackground(path){
  if(!path) return Promise.resolve();
  return sb.storage.from(CERT_BUCKET).remove([path]).catch(function(err){
    console.warn('[design] old background not removed', err && (err.message || err.code));
  });
}

function persistCertDesign(){
  const design = certDesState.design;
  if(!design) return Promise.resolve(false);

  /* students only ever read the design; keep their preview local */
  if(!authIsAdmin()){
    const okLocal = saveCertDesign(design);
    if(okLocal && certDesState.bg) saveCertBg(certDesState.bg);
    return Promise.resolve(okLocal);
  }

  const bg = String(certDesState.bg || '');
  const pendingUpload = bg.indexOf('data:') === 0;

  toast('Saving certificate design…', 'info');

  /* upload first so the row only ever points at a file that exists */
  const upload = pendingUpload ? uploadCertBackground(bg) : Promise.resolve(null);

  return upload.then(function(newPath){
    let previousPath = '';
    try{ previousPath = localStorage.getItem(CERT_BG_PATH_KEY) || ''; }catch(e){ previousPath = ''; }

    const patch = {
      use_custom: !!design.useCustom,
      aspect: Number(design.aspect) || 1.414,
      fields: design.fields || []
    };
    if(newPath) patch.background_path = newPath;

    return sb.from('certificate_design').update(patch).eq('id', true)
      .then(function(res){
        if(res.error) throw res.error;
        if(newPath){
          saveCertBg(bg);
          try{ localStorage.setItem(CERT_BG_PATH_KEY, newPath); }catch(e){}
          if(previousPath && previousPath !== newPath) deleteCertBackground(previousPath);
        }
        saveCertDesign(design);
        toast('Certificate design saved.', 'success');
        return true;
      });
  }).catch(function(err){
    console.warn('[design] save failed', err && (err.message || err.code));
    let text = 'Certificate design could not be saved.' + (err && err.message ? ' (' + err.message + ')' : '');
    if(String((err && err.message) || '') === 'not-admin') text = 'Only the administrator can save the certificate design.';
    if(String((err && err.message) || '').indexOf('image-too-large') > -1) text = 'Image is too large (max 5MB).';
    toast(text, 'error');
    return false;
  });
}

function resetCertDesign(){
  certDesState.design = defaultCertDesign();
  certDesState.bg = '';
  certDesState.selectedId = null;
  saveCertDesign(certDesState.design);
  clearCertBg();

  if(!authIsAdmin()) return Promise.resolve(true);

  let previousPath = '';
  try{ previousPath = localStorage.getItem(CERT_BG_PATH_KEY) || ''; }catch(e){ previousPath = ''; }

  return sb.from('certificate_design')
    .update({ use_custom:false, aspect:1.414, fields:[], background_path:'' })
    .eq('id', true)
    .then(function(res){
      if(res.error) throw res.error;
      try{ localStorage.removeItem(CERT_BG_PATH_KEY); }catch(e){}
      if(previousPath) deleteCertBackground(previousPath);
      toast('Reset to default certificate.','success');
      return true;
    })
    .catch(function(err){
      console.warn('[design] reset failed', err && (err.message || err.code));
      toast('Reset locally — the server update failed. (' + ((err && err.message) || 'error') + ')', 'error');
      return false;
    });
}

/* Removing just the background keeps the field layout. */
function removeCertBackground(){
  certDesState.bg = '';
  certDesState.design.useCustom = false;
  saveCertDesign(certDesState.design);
  clearCertBg();

  let previousPath = '';
  try{ previousPath = localStorage.getItem(CERT_BG_PATH_KEY) || ''; }catch(e){ previousPath = ''; }

  if(!authIsAdmin()){ render(); toast('Background removed.','success'); return Promise.resolve(true); }

  return sb.from('certificate_design')
    .update({ background_path:'', use_custom:false })
    .eq('id', true)
    .then(function(res){
      if(res.error) throw res.error;
      try{ localStorage.removeItem(CERT_BG_PATH_KEY); }catch(e){}
      if(previousPath) deleteCertBackground(previousPath);
      render();
      toast('Background removed.','success');
      return true;
    })
    .catch(function(err){
      console.warn('[design] background removal failed', err && (err.message || err.code));
      render();
      toast('Background removed locally — the server update failed.', 'error');
      return false;
    });
}

/* ---- Student custom certificate renderer ---- */
function renderCustomCertificate(t, sub, certNo, design, bg){
  const start = displayDate(t.startDate) || displayDate(t.date);
  const end   = displayDate(t.endDate) || start;
  const sample = {
    studentName:   (sub.details && sub.details.name) || sub.userName || '',
    designation:   designationFor(sub),
    kgid:          (sub.details && sub.details.kgid) || sub.kgid || '',
    trainingName:  t.title,
    trainingStart: start || '',
    trainingEnd:   end || ''
  };
  const fieldsHtml = sanitizeCertDesign(design).fields.map(f => {
    const text = f.type === 'auto' ? autoFieldValue(f.key, sample) : (f.text || '');
    return '<div class="cert-custom-field" style="' + certFieldStyle(f) + '">' + esc(text) + '</div>';
  }).join('');
  const aspect = Number(design.aspect) || 1.414;
  return '<div class="cert cert-custom" id="cert" style="--cert-aspect:' + aspect + ';">' +
    '<div class="cert-custom-stage" style="aspect-ratio:' + aspect + ';container-type:size;">' +
      '<img src="' + bg + '" alt="">' +
      fieldsHtml +
    '</div>' +
  '</div>';
}

function setPrintPageOrientation(aspect){
  let s = document.getElementById('printPageStyle');
  if(!s){ s = document.createElement('style'); s.id = 'printPageStyle'; document.head.appendChild(s); }
  const size = (Number(aspect) >= 1) ? 'landscape' : 'portrait';
  s.textContent = '@page{size:A4 ' + size + ';margin:8mm;}';
}

/* ============================================================
   SECTION L.2 — ADMIN: STUDENT ACCOUNTS
   ------------------------------------------------------------
   Lists profiles from the database. New accounts arrive already
   approved, so the only lever here is the kill switch: disable an
   account to cut access at once, re-enable it to give access back.

   These buttons are NOT the security boundary: status changes run
   through admin_set_profile_status, which re-checks the caller's
   admin role on the server. A student editing the page can call
   nothing extra.
   ============================================================ */

const ACCOUNTS = {
  list: [],
  loaded: false,
  loading: false,
  error: '',
  filter: { q: '', status: '' }
};

function loadStudentAccounts(force){
  if(!authIsAdmin()) return Promise.resolve([]);
  if(ACCOUNTS.loading) return Promise.resolve(ACCOUNTS.list);
  if(ACCOUNTS.loaded && !force) return Promise.resolve(ACCOUNTS.list);

  ACCOUNTS.loading = true;
  ACCOUNTS.error = '';
  return sb.from('profiles').select('*').order('created_at', { ascending:false })
    .then(unwrap)
    .then(function(rows){
      const list = (rows || []).map(profileRowToAccount).sort(function(a, b){
        const sa = String(a.status || 'pending'), sbv = String(b.status || 'pending');
        if(sa !== sbv) return sa === 'pending' ? -1 : (sbv === 'pending' ? 1 : sa.localeCompare(sbv));
        return String(a.officialName || '').localeCompare(String(b.officialName || ''));
      });
      ACCOUNTS.list = list;
      ACCOUNTS.loaded = true;
      ACCOUNTS.loading = false;
      return list;
    })
    .catch(function(err){
      console.warn('[accounts] load failed', err && (err.message || err.code));
      ACCOUNTS.loading = false;
      ACCOUNTS.loaded = true;
      ACCOUNTS.error = dataErrorMessage(err);
      return ACCOUNTS.list;
    });
}

function refreshStudentAccounts(){
  ACCOUNTS.loaded = false;
  return loadStudentAccounts(true).then(function(){
    render();
  });
}

/* status changes go through the admin-only RPC — the browser has no
   INSERT/UPDATE grant on profiles beyond its own four columns */
function setStudentStatus(profileId, status){
  if(!authIsAdmin()) return Promise.reject(new Error('not-admin'));
  return sb.rpc('admin_set_profile_status', {
    p_profile_id: profileId,
    p_status: status
  }).then(function(res){
    if(res.error) throw res.error;
    return true;
  });
}

/* re-render as the admin types in the account filters */
function bindAccountFilters(){
  $$('[data-acct-filter]').forEach(function(el){
    const handler = function(){
      const key = el.getAttribute('data-acct-filter');
      ACCOUNTS.filter[key] = el.value;
      render();
      /* keep focus + caret in the search box while typing */
      const again = document.querySelector('[data-acct-filter="' + key + '"]');
      if(again && key === 'q'){
        again.focus();
        const v = again.value;
        try{ again.setSelectionRange(v.length, v.length); }catch(e){}
      }
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

/* ============================================================
   SECTION L.3 — ADMIN: DATA BACKUP  (Phase 11)
   ------------------------------------------------------------
   Exports everything the admin can read as a single JSON file, and
   restores from one after validating it.

   Restoration is deliberately conservative:
     - the file is validated before anything is written
     - the admin must confirm, and the summary is shown first
     - students, trainings, submissions, certificates and the
       certificate design are re-written document by document
     - nothing is deleted; existing records are overwritten by id
   ============================================================ */

const BACKUP_VERSION = 2;

function backupTimestamp(){
  const d = new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + p(d.getMonth()+1) + p(d.getDate()) + '-' + p(d.getHours()) + p(d.getMinutes());
}

/* ---------- export ---------- */

function buildBackupPayload(){
  return Promise.resolve({
    _format: 'dti-bengaluru-backup',
    _version: BACKUP_VERSION,
    exportedAt: new Date().toISOString(),
    exportedBy: (currentUser() || {}).name || '',
    institute: (typeof INSTITUTE !== 'undefined' ? INSTITUTE : ''),
    counts: {
      students: DB.users.length,
      trainings: DB.trainings.length,
      submissions: DB.submissions.length,
      certificates: DB.certificates.length
    },
    students: DB.users.map(function(u){
      return {
        _id: u.id,
        officialName: u.name || '',
        email: u.email || '',
        kgid: u.kgid || '',
        designation: u.designation || '',
        department: u.department || '',
        status: u.status || 'approved',
        role: u.role || 'student'
      };
    }),
    trainings: DB.trainings.map(function(t){ return Object.assign({ _id: t.id }, deepCopy(t)); }),
    submissions: DB.submissions.map(function(sb){ return Object.assign({ _id: sb.id }, deepCopy(sb)); }),
    certificates: DB.certificates.map(function(c){ return Object.assign({ _id: c.id }, deepCopy(c)); }),
    certificateDesign: loadCertDesign(),
    settings: DB.settings ? deepCopy(DB.settings) : null
  });
}

function downloadBlob(filename, text, type){
  try{
    const blob = new Blob([text], { type: type || 'application/json;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1500);
    return true;
  }catch(e){
    return false;
  }
}

/* CSV is offered per table because spreadsheet use is the common case */
function exportBackupCSV(which){
  buildBackupPayload().then(function(p){
    let rows = [];
    let header = [];

    if(which === 'students'){
      header = ['ಅಧಿಕೃತ ಹೆಸರು','ಕೆ.ಜಿ.ಐ.ಡಿ','ಇಮೇಲ್','ಹುದ್ದೆ','ಇಲಾಖೆ','ಸ್ಥಿತಿ','id'];
      rows = p.students.map(function(st){
        return [st.officialName||'', st.kgid||'', st.email||'', st.designation||'', st.department||'', st.status||'', st._id||''];
      });
    }else if(which === 'results'){
      header = ['ವಿದ್ಯಾರ್ಥಿ','ಕೆ.ಜಿ.ಐ.ಡಿ','ತರಬೇತಿ','ಅಂಕಗಳು','ಒಟ್ಟು','ಶೇಕಡಾವಾರು','ಸ್ಥಿತಿ','ಪ್ರಮಾಣಪತ್ರ','ಸಲ್ಲಿಸಿದ ದಿನಾಂಕ'];
      rows = DB.submissions.map(function(sb){
        const r = sb.result || {};
        const d = sb.details || {};
        return [d.name || sb.userName || '', d.kgid || '', sb.trainingTitle || '',
                r.marks || 0, r.total || 0, (r.pct || 0) + '%',
                r.passed ? 'ಉತ್ತೀರ್ಣ' : 'ಅನುತ್ತೀರ್ಣ', sb.certificateNo || '-', sb.submittedAt || ''];
      });
    }else if(which === 'trainings'){
      header = ['ಶೀರ್ಷಿಕೆ','ಆರಂಭ ದಿನಾಂಕ','ಅಂತ್ಯ ದಿನಾಂಕ','ಉತ್ತೀರ್ಣ %','MCQ ಪ್ರಶ್ನೆಗಳು','ಭಾಗ-1','ಭಾಗ-2','ಪ್ರಕಟಿತ','ಅಳಿಸಲಾಗಿದೆ','id'];
      rows = p.trainings.map(function(t){
        return [t.title||'', displayDate(t.startDate), displayDate(t.endDate), t.passing||70,
                (t.questions||[]).length,
                ((t.feedback && t.feedback.part1) || []).filter(function(b){ return !b.deleted; }).length,
                ((t.feedback && t.feedback.part2) || []).filter(function(q){ return !q.deleted; }).length,
                t.published?'ಹೌದು':'ಇಲ್ಲ', t.archived?'ಹೌದು':'ಇಲ್ಲ', t._id||''];
      });
    }else if(which === 'certificates'){
      header = ['ಸಂಖ್ಯೆ','ವಿದ್ಯಾರ್ಥಿ','ತರಬೇತಿ','ಅಂಕಗಳು','ಶೇಕಡಾವಾರು','issuedAt'];
      rows = p.certificates.map(function(c){
        return [c.number||'', c.studentName||'', c.trainingTitle||'',
                (c.marks||0)+' / '+(c.total||0), (c.pct||0)+'%', c.issuedAt||''];
      });
    }else{
      toast('ಅಜ್ಞಾತ ರಫ್ತು ಪ್ರಕಾರ.', 'error'); return;
    }

    const csv = '\uFEFF' + [header].concat(rows)
      .map(function(r){ return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(','); })
      .join('\r\n');

    const name = 'dti-' + which + '-' + backupTimestamp() + '.csv';
    if(downloadBlob(name, csv, 'text/csv;charset=utf-8;')){
      toast('CSV ಡೌನ್‍ಲೋಡ್ ಆಗಿದೆ.', 'success');
    }else{
      toast('ಡೌನ್‍ಲೋಡ್ ವಿಫಲವಾಯಿತು.', 'error');
    }
  }).catch(function(){
    toast('CSV ರಫ್ತು ವಿಫಲವಾಯಿತು.', 'error');
  });
}

/* ============================================================

   ============================================================ */
document.addEventListener('click', function(e){
  const overlay = e.target.closest('[data-action="modal-overlay"]');
  if(overlay && e.target === overlay){ closeModal(); return; }

  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.getAttribute('data-action');

  switch(action){

    /* ---------- global ---------- */
    case 'modal-close': closeModal(); break;
    case 'modal-overlay': closeModal(); break;
    case 'confirm-yes': {
      const cb = confirmCallback;
      closeModal();
      if(typeof cb === 'function') cb();
      break;
    }
    case 'logout': logout(); break;
    case 'google-signin': signInGoogle(); break;
    case 'retry-library': {
      /* a fresh attempt after the operator fixed the deployment */
      sb = null;
      AUTH.session = null;
      AUTH.user = null;
      AUTH.profile = null;
      authHandled = null;
      startPortal();
      break;
    }
    case 'sign-out': signOut(); break;
    case 'retry-profile': {
      if(AUTH.user && sb){
        AUTH.gate = 'loading';
        render();
        loadProfileAndPortal();
      }else{
        signOut();
      }
      break;
    }

    case 'open-sidebar': {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if(sb) sb.classList.add('open');
      if(ov) ov.classList.add('show');
      break;
    }
    case 'close-sidebar': {
      const sb = document.getElementById('sidebar');
      const ov = document.getElementById('sidebarOverlay');
      if(sb) sb.classList.remove('open');
      if(ov) ov.classList.remove('show');
      break;
    }

    /* ---------- student ---------- */
    case 'student-nav': {
      const to = el.getAttribute('data-to');
      const u = currentUser();
      if(!u) break;
      if(to === 'dashboard'){ state.route = 'dashboard'; render(); break; }
      if(to === 'training'){
        const t = DB.trainings[0];
        if(t) openTraining(t.id);
        break;
      }
      if(to === 'result' || to === 'certificate'){
        const sub = DB.submissions.filter(s => s.userId === u.id).slice(-1)[0];

        '<p class="tiny muted">ಇದು ಶಿಬಿರಾರ್ಥಿಗೆ ಕಾಣುವ ರೀತಿ. ಸರಿಯಾದ ಉತ್ತರವನ್ನು ಗುರುತಿಸಲಾಗಿದೆ (ವಿದ್ಯಾರ್ಥಿಗೆ ಕಾಣುವುದಿಲ್ಲ).' +
          (q.correct === null || q.correct === undefined
            ? ' ಈ ಪ್ರಶ್ನೆಯ ಸರಿಯಾದ ಉತ್ತರ ಈಗಾಗಲೇ ಸರ್ವರ್‌ನಲ್ಲಿ ಉಳಿಸಲಾಗಿದ್ದರೆ ಅದು ಈ ಪರದೆಯಲ್ಲಿ ಕಾಣುವುದಿಲ್ಲ.'
            : '') + '</p>' +
        '<div class="modal-actions"><button class="btn btn-ghost" data-action="modal-close">ಮುಚ್ಚಿ</button></div>'
      );
      break;
    }

    /* ---------- admin data actions ---------- */
    case 'view-submission': viewSubmissionModal(el.getAttribute('data-id')); break;
    case 'export-csv': exportCSV(); break;
    case 'reset-data': {
      confirmDialog(
        'ಈ ಬ್ರೌಸರ್‌ನ ಕ್ಯಾಶೆ ಅಳಿಸುವುದೇ?',
        'ಇದು ಈ ಬ್ರೌಸರ್‌ನಲ್ಲಿ ಉಳಿಸಿದ ಕರಡು ಉತ್ತರಗಳು, ಪ್ರಮಾಣಪತ್ರ ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಮತ್ತು ಸ್ಥಳೀಯ ನಕಲನ್ನು ಮಾತ್ರ ಅಳಿಸುತ್ತದೆ. ' +
        'ಸರ್ವರ್‌ನಲ್ಲಿರುವ ತರಬೇತಿಗಳು, ಫಲಿತಾಂಶಗಳು ಮತ್ತು ಪ್ರಮಾಣಪತ್ರಗಳು ಅಳಿಸುವುದಿಲ್ಲ.',
        function(){
          try{
            Object.keys(localStorage).forEach(function(k){
              if(k === STORE_KEY || k === CERT_DESIGN_KEY || k === CERT_BG_KEY ||
                 k === CERT_BG_PATH_KEY || k.indexOf(DRAFT_PREFIX) === 0){
                localStorage.removeItem(k);
              }
            });
          }catch(e){}
          state.editing = null;
          state.adminSection = 'overview';
          reloadPortalData();
          toast('ಸ್ಥಳೀಯ ಕ್ಯಾಶೆ ಅಳಿಸಲಾಗಿದೆ.','success');
        },
        true
      );
      break;
    }

    /* ---------- data backup ---------- */
    case 'backup-export-json': exportBackupJSON(); break;
    case 'backup-csv': exportBackupCSV(el.getAttribute('data-what')); break;
    case 'backup-cert-image': {
      const cfg = getActiveCertDesign();
      if(!cfg.bg){ toast('ಯಾವುದೇ ಪ್ರಮಾಣಪತ್ರ ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಸಂರಕ್ಷಿಸಿಲ್ಲ.', 'info'); break; }
      const a = document.createElement('a');
      a.href = cfg.bg;
      a.download = 'certificate-background.' + (cfg.bg.indexOf('data:image/jpeg') === 0 ? 'jpg' : 'png');
      a.target = '_blank';
      a.rel = 'noopener';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      toast('ಹಿನ್ನೆಲೆ ಚಿತ್ರ ಡೌನ್‌ಲೋಡ್ ಪ್ರಾರಂಭವಾಗಿದೆ.', 'success');
      break;
    }

    /* ---------- publish / archive ---------- */
    case 'publish-training':   trainingVisibility(el.getAttribute('data-id'), { published:true,  archived:false }); break;
    case 'unpublish-training': trainingVisibility(el.getAttribute('data-id'), { published:false }); break;
    case 'archive-training':   trainingVisibility(el.getAttribute('data-id'), { archived:true, published:false }); break;
    case 'unarchive-training': trainingVisibility(el.getAttribute('data-id'), { archived:false, published:true }); break;

    /* ---------- student accounts ---------- */
    case 'acct-disable': accountAction(el.getAttribute('data-uid'), 'disable'); break;
    case 'acct-enable':  accountAction(el.getAttribute('data-uid'), 'enable');  break;
    case 'acct-refresh': refreshStudentAccounts(); break;

    /* ---------- certificate designer ---------- */
    case 'certdes-upload': {
      const inp = document.getElementById('certBgInput');
      if(inp) inp.click();
      break;
    }
    case 'certdes-remove-bg': {
      confirmDialog(
        'Remove background image?',
        'The uploaded certificate image will be cleared. Student records and other data are not affected.',
        function(){ removeCertBackground(); },
        true
      );
      break;
    }
    case 'certdes-add-auto': {
      if(!certDesState.design) break;
      const key = el.getAttribute('data-key');
      certDesState.design.fields.push({
        id: uid('cd'),
        type: 'auto',
        key: key,
        x: 30, y: 40, w: 40,
        fontSize: 3,
        fontFamily: 'kn',
        color: '#14243A',
        align: 'center',
        bold: false
      });
      certDesState.selectedId = certDesState.design.fields[certDesState.design.fields.length - 1].id;
      render();
      break;
    }
    case 'certdes-add-static': {
      if(!certDesState.design) break;
      const inp = document.getElementById('certStaticInput');
      const txt = inp ? String(inp.value || '').trim() : '';
      if(!txt){ toast('Type some text first.','error'); break; }
      certDesState.design.fields.push({
        id: uid('cd'),
        type: 'static',
        text: txt,
        x: 20, y: 55, w: 60,
        fontSize: 2.6,
        fontFamily: 'kn',
        color: '#14243A',
        align: 'center',
        bold: false
      });
      certDesState.selectedId = certDesState.design.fields[certDesState.design.fields.length - 1].id;
      render();
      break;
    }
    case 'certdes-del': {
      if(!certDesState.design) break;
      const id = el.getAttribute('data-id');
      certDesState.design.fields = certDesState.design.fields.filter(f => f.id !== id);
      if(certDesState.selectedId === id) certDesState.selectedId = null;
      render();
      break;
    }
    case 'certdes-save': {
      if(!certDesState.design) break;
      const chk = document.getElementById('certUseCustom');
      if(chk) certDesState.design.useCustom = chk.checked;
      persistCertDesign();
      break;
    }
    case 'certdes-reset': {
      confirmDialog(
        'Reset to default certificate?',
        'The custom design and background will be cleared. Student records, assessments, and results will NOT be affected.',
        function(){
          resetCertDesign().then(function(){ render(); });
        },
        true
      );
      break;
    }
  }
});

/* ---------- Certificate designer: drag/resize ---------- */
document.addEventListener('pointerdown', function(e){
  if(!certDesState.design) return;
  const handle = e.target.closest('.cd-handle');
  const fieldEl = e.target.closest('.certdes-field');
  if(!fieldEl) return;
  e.preventDefault();
  const id = fieldEl.getAttribute('data-cd-id');
  const field = certDesState.design.fields.find(f => f.id === id);
  if(!field) return;

  if(certDesState.selectedId !== id) selectCertField(id);

  const canvas = fieldEl.closest('.certdes-canvas');
  if(!canvas) return;
  const rect = canvas.getBoundingClientRect();

  if(handle){
    certDesState.dragging = { mode:'resize', id:id, startX:e.clientX, startW:Number(field.w)||30, rectW:rect.width };
  } else {
    certDesState.dragging = {
      mode:'drag', id:id,
      startX:e.clientX, startY:e.clientY,
      startXpct:Number(field.x)||0, startYpct:Number(field.y)||0,
      rectW:rect.width, rectH:rect.height
    };
  }
});

document.addEventListener('pointermove', function(e){
  const d = certDesState.dragging;
  if(!d || !certDesState.design) return;
  const field = certDesState.design.fields.find(f => f.id === d.id);
  if(!field) return;
  e.preventDefault();
  const dxPct = ((e.clientX - d.startX) / d.rectW) * 100;
  if(d.mode === 'drag'){
    const dyPct = ((e.clientY - d.startY) / d.rectH) * 100;
    field.x = Math.max(0, Math.min(100, d.startXpct + dxPct));
    field.y = Math.max(0, Math.min(100, d.startYpct + dyPct));
  } else {
    field.w = Math.max(5, Math.min(100 - (Number(field.x)||0), d.startW + dxPct));
  }
  updateEditorField(field);
  syncCertFieldPanel(field);
});

document.addEventListener('pointerup', function(){
  if(certDesState.dragging) certDesState.dragging = null;
});
document.addEventListener('pointercancel', function(){
  if(certDesState.dragging) certDesState.dragging = null;
});

/* ---------- Certificate designer: file input ---------- */
document.addEventListener('change', function(e){
  if(e.target && e.target.id === 'certBgInput'){
    const file = e.target.files && e.target.files[0];
    if(!file) return;
    if(!/^image\/(png|jpeg|jpg)$/.test(file.type)){
      toast('Please choose a PNG or JPG image.','error');
      return;
    }
    if(file.size > 5 * 1024 * 1024){
      toast('Image is too large (max 5MB). Please use a smaller file.','error');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(ev){
      const dataUrl = String(ev.target.result || '');
      /* Preview immediately. The file is only buffered here — "Save & Apply"
         uploads it to the private bucket and writes certificate_design, so a
         closed tab never leaves a half-saved design behind. */
      certDesState.bg = dataUrl;
      if(!certDesState.design) certDesState.design = defaultCertDesign();
      render();
      toast('Image ready — press "Save & Apply" to upload it.', 'info');

      /* the aspect ratio is a nicety: if the size cannot be read, the
         current ratio is kept and the upload still works */
      const img = new Image();
      img.onload = function(){
        if(certDesState.bg !== dataUrl) return;
        const ratio = img.naturalWidth / img.naturalHeight;
        if(isFinite(ratio) && ratio > 0){
          certDesState.design.aspect = +ratio.toFixed(3);
          render();
        }
      };
      img.onerror = function(){ /* keep the current aspect */ };
      img.src = dataUrl;
    };
    reader.onerror = function(){ toast('Could not read that file.','error'); };
    reader.readAsDataURL(file);
  }
});

/* ---------- Form submissions ---------- */
document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.getAttribute('data-form');

  if(kind === 'profile'){
    saveProfileDetails(form);
    return;
  }

  if(kind === 'training'){
    saveTraining();
    return;
  }
});

/* ---------- Radio group visual state ---------- */
document.addEventListener('change', function(e){
  const t = e.target;
  if(t && t.type === 'radio'){
    /* assessment option styling */
    const grp = t.closest('.opt-group');
    if(grp){
      $$('.opt', grp).forEach(o => o.classList.toggle('selected', !!o.querySelector('input:checked')));
    }
    /* generic feedback radio -> store answer.
       This document-level handler is the fallback: the per-element binding
       in bindPostRender() only covers whatever was in the DOM at that
       moment, so a control rendered or re-rendered later saved nothing
       while still *looking* selected. Delegation here catches both. */
    const fbGroup = t.getAttribute('data-fbgroup');
    if(fbGroup && state.draft){
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.answers) state.draft.feedback.answers = {};
      state.draft.feedback.answers[fbGroup] = t.value;
      persistDraft();
    }
    const p1Group = t.getAttribute('data-p1rate');
    if(p1Group && state.draft){
      if(!state.draft.feedback) state.draft.feedback = { ratings:{}, answers:{} };
      if(!state.draft.feedback.ratings) state.draft.feedback.ratings = {};
      state.draft.feedback.ratings[p1Group] = t.value;
      persistDraft();
    }
  }
});

/* ---------- Init ---------- */
function startPortal(){
  /* 1. make sure the library is present (local file first, CDNs as backup)
     2. create the client
     3. restore the session, then let the gate decide what to draw */
  AUTH.gate = 'loading';
  AUTH.error = '';
  render();

  ensureSupabaseLibrary().then(function(haveLib){
    if(!haveLib){
      console.warn('[supabase] library unavailable', LIB_ATTEMPTS);
      AUTH.gate = 'library';
      render();
      return;
    }
    if(!initSupabaseClient()){
      console.warn('[supabase] client could not be created');
      AUTH.gate = 'config';
      render();
      return;
    }
    AUTH.gate = 'loading';
    render();
    bootAuth();
  }).catch(function(err){
    console.warn('[supabase] startup failed', err && err.message);
    AUTH.gate = 'library';
    render();
  });
}

function init(){
  /* Nothing is stored locally any more except the in-progress draft and a
     cached certificate background, so there is no state to restore before
     the client exists. */
  DB = emptyDB();
  startPortal();
}
init();

})();
