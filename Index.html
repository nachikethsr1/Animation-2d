<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>THE LAST CHUNK — A Pixel-Art Short Story</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/press-start-2p@5.0.8/index.css" />
<style>
/* ============================================================
   THE LAST CHUNK — UI STYLES  (pixel-art player chrome)
   ============================================================ */
:root{
  --ink:#08070d;
  --panel:#1b1a24;
  --panel2:#262433;
  --edge:#0d0c14;
  --line:#5a5676;
  --line2:#8d87b5;
  --text:#e9e4f5;
  --dim:#9a94b5;
  --accent:#b47cff;
  --accent2:#7ce0a8;
  --warm:#ffcf8a;
  --fs:10px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;width:100%;overflow:hidden;background:#05040a;}
body{
  font-family:'Press Start 2P','Courier New',monospace;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  background:
    repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px),
    radial-gradient(circle at 50% 40%,#12101d 0%,#05040a 70%);
}
#app{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{
  position:relative;background:#000;overflow:hidden;
  box-shadow:0 0 0 2px #000,0 0 0 4px #2b2740,0 0 0 6px #000,0 18px 60px rgba(0,0,0,.9);
}
#screen{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;background:#000;}

/* ---------- subtitles ---------- */
#subs{
  position:absolute;left:0;right:0;bottom:calc(52px + 2.2%);
  display:flex;justify-content:center;align-items:flex-end;
  pointer-events:none;z-index:6;padding:0 4%;
  transition:opacity .18s linear;
}
#subs .box{
  max-width:88%;
  background:rgba(8,6,16,.74);
  border:2px solid rgba(180,124,255,.30);
  box-shadow:0 0 0 2px rgba(0,0,0,.55), inset 0 0 0 2px rgba(255,255,255,.04);
  padding:calc(var(--fs)*.85) calc(var(--fs)*1.15);
  font-size:var(--fs);line-height:1.75;letter-spacing:.5px;
  color:#fff6e6;text-align:center;
  text-shadow:2px 2px 0 #000, -1px 1px 0 #000, 1px -1px 0 #000;
}
#subs.hidden{opacity:0}

/* ---------- control bar ---------- */
#controls{
  position:absolute;left:0;right:0;bottom:0;height:52px;z-index:8;
  display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(to top,rgba(6,5,12,.96) 0%,rgba(6,5,12,.86) 55%,rgba(6,5,12,0) 100%);
  transition:opacity .25s ease, transform .25s ease;
}
#controls.hide{opacity:0;transform:translateY(8px);pointer-events:none}
.ctl{
  width:34px;height:30px;flex:0 0 auto;cursor:pointer;
  background:var(--panel);color:var(--text);
  border:2px solid var(--line);
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,border-color .12s,transform .06s;
}
.ctl:hover{background:var(--panel2);border-color:var(--line2)}
.ctl:active{transform:translateY(1px)}
.ctl:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl svg{width:14px;height:14px;fill:currentColor;display:block;shape-rendering:crispEdges}
.ctl.off{color:#5f5a78}
.ctl.on{color:var(--accent2)}

#trackWrap{flex:1 1 auto;display:flex;align-items:center;gap:9px;min-width:60px}
#track{
  position:relative;flex:1 1 auto;height:14px;cursor:pointer;
  background:#131220;border:2px solid #3b3752;
}
#buf{position:absolute;left:2px;top:2px;bottom:2px;width:0;background:#2b2740}
#fill{position:absolute;left:2px;top:2px;bottom:2px;width:0;
  background:repeating-linear-gradient(90deg,var(--accent) 0 4px,#9455e8 4px 6px)}
#knob{position:absolute;top:-3px;width:4px;height:16px;background:#fff2d6;left:2px;box-shadow:0 0 0 2px #000}
#marks{position:absolute;inset:2px;pointer-events:none}
.mk{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.20)}
#time{font-size:9px;color:var(--dim);white-space:nowrap;letter-spacing:.5px;min-width:78px;text-align:right}

/* ---------- title screen ---------- */
#title{
  position:absolute;inset:0;z-index:12;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:0;text-align:center;
  background:radial-gradient(ellipse at 50% 62%,rgba(60,16,90,.34) 0%,rgba(4,3,9,.72) 58%,rgba(3,2,7,.93) 100%);
  transition:opacity .45s ease;
}
#title.gone{opacity:0;pointer-events:none}
#title .kick{font-size:calc(var(--fs)*.9);color:var(--accent);letter-spacing:3px;margin-bottom:14px;text-shadow:2px 2px 0 #000}
#title h1{
  font-size:calc(var(--fs)*3.4);line-height:1.25;color:#fff4dc;letter-spacing:2px;
  text-shadow:0 4px 0 #4b1d78, 0 6px 0 #22102f, 4px 8px 0 rgba(0,0,0,.6), 0 0 24px rgba(180,124,255,.55);
  margin-bottom:10px;
}
#title h2{font-size:calc(var(--fs)*1.05);color:var(--dim);letter-spacing:2px;margin-bottom:6px}
#title .rule{width:min(56%,340px);height:4px;margin:16px 0 22px;
  background:repeating-linear-gradient(90deg,#5a5676 0 6px,transparent 6px 12px)}
.btn{
  font-family:inherit;cursor:pointer;color:var(--text);
  background:var(--panel);border:2px solid var(--line);
  padding:12px 18px;font-size:calc(var(--fs)*1.05);letter-spacing:1.5px;
  box-shadow:0 4px 0 var(--edge), inset 0 0 0 2px rgba(255,255,255,.045);
  transition:background .12s,border-color .12s,transform .06s,color .12s;
}
.btn:hover{background:var(--panel2);border-color:var(--line2);color:#fff}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--edge)}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn.primary{
  background:#3d1d63;border-color:#b47cff;color:#fff4dc;
  box-shadow:0 5px 0 #1b0b2e, inset 0 0 0 2px rgba(255,255,255,.09), 0 0 26px rgba(180,124,255,.35);
  font-size:calc(var(--fs)*1.35);padding:16px 30px;
  animation:pulse 2.1s ease-in-out infinite;
}
.btn.primary:hover{background:#4d2679}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 #1b0b2e,inset 0 0 0 2px rgba(255,255,255,.09),0 0 20px rgba(180,124,255,.28)}
                 50%{box-shadow:0 5px 0 #1b0b2e,inset 0 0 0 2px rgba(255,255,255,.09),0 0 38px rgba(180,124,255,.62)}}
#titleRow{display:flex;gap:12px;margin-top:22px;flex-wrap:wrap;justify-content:center}
#titleRow .btn{padding:10px 14px;font-size:calc(var(--fs)*.85)}
#title .foot{margin-top:26px;font-size:8px;color:#6b6688;letter-spacing:1px;line-height:1.9}
.badge{display:inline-block;padding:3px 6px;border:1px solid #4a4664;color:#8f89b0;margin:0 2px}

/* ---------- settings ---------- */
#settings{
  position:absolute;top:12px;right:12px;z-index:14;width:min(290px,84%);
  background:rgba(16,14,26,.97);border:2px solid var(--line);
  box-shadow:0 6px 0 var(--edge),0 0 0 2px #000, 0 14px 40px rgba(0,0,0,.7);
  padding:12px;display:none;max-height:calc(100% - 80px);overflow:auto;
}
#settings.open{display:block}
#settings h3{font-size:10px;letter-spacing:2px;color:var(--accent);margin-bottom:12px;
  border-bottom:2px solid #332f4a;padding-bottom:8px}
.srow{margin-bottom:14px}
.srow label{display:flex;justify-content:space-between;align-items:center;font-size:8px;color:var(--dim);letter-spacing:1px;margin-bottom:7px}
.srow label b{color:var(--text);font-weight:normal}
input[type=range]{
  -webkit-appearance:none;appearance:none;width:100%;height:12px;background:#131220;border:2px solid #3b3752;cursor:pointer;
}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:18px;background:var(--accent);border:2px solid #000;cursor:pointer}
input[type=range]::-moz-range-thumb{width:12px;height:18px;background:var(--accent);border:2px solid #000;border-radius:0;cursor:pointer}
.seg{display:flex;gap:4px}
.seg button{flex:1;font-family:inherit;font-size:7.5px;padding:7px 4px;background:#1b1a24;color:var(--dim);border:2px solid #3b3752;cursor:pointer;letter-spacing:.5px}
.seg button:hover{color:#fff;border-color:var(--line2)}
.seg button.sel{background:#3d1d63;color:#fff;border-color:var(--accent)}
#settings .close{position:absolute;top:6px;right:6px;width:22px;height:22px;font-size:9px;padding:0;line-height:1;display:flex;align-items:center;justify-content:center}
#hint{position:absolute;left:12px;top:12px;z-index:9;font-size:8px;color:#7c7699;letter-spacing:1px;
  background:rgba(10,8,18,.72);border:2px solid #2b2740;padding:6px 8px;opacity:0;transition:opacity .3s;pointer-events:none}
#hint.show{opacity:1}
@media (max-width:640px){
  #controls{height:46px;gap:6px;padding:0 8px}
  .ctl{width:30px;height:26px}
  #time{font-size:7.5px;min-width:64px}
  #subs{bottom:calc(46px + 2%)}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="screen" width="480" height="270"></canvas>

    <div id="subs" class="hidden"><div class="box" id="subText"></div></div>

    <div id="hint"></div>

    <div id="controls" class="hide">
      <button class="ctl" id="btnPlay" title="Play / Pause (Space)" aria-label="Play or pause">
        <svg id="icPlay" viewBox="0 0 16 16"><path d="M3 1l11 7-11 7z"/></svg>
        <svg id="icPause" viewBox="0 0 16 16" style="display:none"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>
      </button>
      <button class="ctl" id="btnRestart" title="Restart (R)" aria-label="Restart">
        <svg viewBox="0 0 16 16"><path d="M8 2V0L4 3l4 3V4a4 4 0 1 1-4 4H2a6 6 0 1 0 6-6z"/></svg>
      </button>
      <div id="trackWrap">
        <div id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="30" aria-valuenow="0">
          <div id="buf"></div><div id="fill"></div>
          <div id="marks"></div>
          <div id="knob"></div>
        </div>
        <div id="time">0:00 / 0:30</div>
      </div>
      <button class="ctl on" id="btnSound" title="Sound (M)" aria-label="Toggle sound">
        <svg viewBox="0 0 16 16"><path d="M2 6h3l4-4v12L5 10H2zM11 5c1.5 1 1.5 5 0 6v-2c.6-.7.6-1.3 0-2zM13 3c2.5 2 2.5 8 0 10v-2c1.4-1.4 1.4-4.6 0-6z"/></svg>
      </button>
      <button class="ctl on" id="btnCc" title="Captions (C)" aria-label="Toggle captions">
        <svg viewBox="0 0 16 16"><path d="M1 3h14v10H1zM3 5v6h10V5zm1.5 1.5h3v1h-2v1h2v1h-3zm4.5 0h3v1h-2v1h2v1h-3z"/></svg>
      </button>
      <button class="ctl" id="btnSet" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 16 16"><path d="M7 1h2v2h2v2h2v2h-2v2h2v2h-2v2H9v-2H7v2H5v-2H3v-2h2V9H3V7h2V5H3V3h2V3h2zm0 4v4h2V5z"/></svg>
      </button>
      <button class="ctl" id="btnFull" title="Fullscreen (F)" aria-label="Fullscreen">
        <svg viewBox="0 0 16 16"><path d="M1 1h6v2H3v4H1zm8 0h6v6h-2V3h-4zM1 9h2v4h4v2H1zm12 0h2v6H9v-2h4z"/></svg>
      </button>
    </div>

    <div id="settings" role="dialog" aria-label="Settings">
      <button class="btn close" id="setClose" aria-label="Close settings">X</button>
      <h3>SETTINGS</h3>
      <div class="srow">
        <label>NARRATION VOLUME <b id="vNarrLbl">100%</b></label>
        <input type="range" id="vNarr" min="0" max="100" value="100">
      </div>
      <div class="srow">
        <label>SOUND FX VOLUME <b id="vSfxLbl">14%</b></label>
        <input type="range" id="vSfx" min="0" max="100" value="14">
      </div>
      <div class="srow">
        <label>SUBTITLES</label>
        <div class="seg" id="segCc">
          <button data-v="1" class="sel">ON</button><button data-v="0">OFF</button>
        </div>
      </div>
      <div class="srow">
        <label>PIXEL RENDERING</label>
        <div class="seg" id="segPx">
          <button data-v="1" class="sel">RETRO 1X</button><button data-v="2">SMOOTH 2X</button>
        </div>
      </div>
      <div class="srow">
        <label>NARRATION VOICE</label>
        <div class="seg" id="segVoice"><button data-v="auto" class="sel" id="voiceLbl">AUTO</button></div>
      </div>
    </div>

    <div id="title">
      <div class="kick">A PIXEL-ART SHORT STORY</div>
      <h1>THE LAST<br>CHUNK</h1>
      <h2>30 SECONDS &bull; 2D &bull; NO ESCAPE</h2>
      <div class="rule"></div>
      <button class="btn primary" id="btnStart">&#9654;&nbsp; PLAY STORY</button>
      <div id="titleRow">
        <button class="btn" id="btnSet2">SETTINGS</button>
        <button class="btn on" id="btnSound2">SOUND: ON</button>
        <button class="btn on" id="btnCc2">CAPTIONS: ON</button>
      </div>
      <div class="foot">
        <span class="badge">SPACE</span> play/pause
        <span class="badge">R</span> restart
        <span class="badge">C</span> captions
        <span class="badge">M</span> mute
        <span class="badge">F</span> fullscreen
        <br><span id="voiceNote"></span>
      </div>
    </div>
  </div>
</div>

<script>
"use strict";
(function(){
/* ============================================================
   SECTION 1 — CONFIGURATION
   ============================================================ */
const VIEW_W = 480, VIEW_H = 270;          // internal pixel resolution (16:9)
const BLOCK  = 12;                          // world units per terrain block
const WORLD_W= 3060;
const NCOL   = Math.ceil(WORLD_W / BLOCK);
const GAP    = -127;                        // chasm marker
const CHASM0 = 1580, CHASM1 = 1900;         // bridge gap
const DUR    = 30;                          // story length in seconds
const TAU    = Math.PI * 2;

let renderScale = 1;                        // 1 = retro, 2 = smooth (integer supersample)

/* ============================================================
   SECTION 2 — MATH / UTILITIES
   ============================================================ */
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=t=>{t=clamp(t,0,1);return t*t*(3-2*t);};
const easeOut=t=>1-Math.pow(1-clamp(t,0,1),3);
const easeIn =t=>{t=clamp(t,0,1);return t*t*t;};
const easeIO =t=>{t=clamp(t,0,1);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
const seg=(t,a,b)=>clamp((t-a)/(b-a),0,1);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function ih(x,y,s){let h=(x*374761393+y*668265263+s*1274126177)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;}
function hashHex(c){return parseInt(c.slice(1),16);}
function shade(hex,f){const n=hashHex(hex);let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  r=clamp(Math.round(r*f),0,255);g=clamp(Math.round(g*f),0,255);b=clamp(Math.round(b*f),0,255);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);}
function mixHex(a,b,t){const x=hashHex(a),y=hashHex(b);
  const r=Math.round(lerp((x>>16)&255,(y>>16)&255,t)),g=Math.round(lerp((x>>8)&255,(y>>8)&255,t)),bl=Math.round(lerp(x&255,y&255,t));
  return '#'+((1<<24)+(r<<16)+(g<<8)+bl).toString(16).slice(1);}
function mixRGB(a,b,t){return [lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}
function rgba(c,a){return 'rgba('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+','+a+')';}
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;return c;}
function noise1(x,s){const i=Math.floor(x),f=x-i;const a=ih(i,0,s),b=ih(i+1,0,s);const u=f*f*(3-2*f);return a+(b-a)*u;}

/* ============================================================
   SECTION 3 — CANVAS INIT
   ============================================================ */
const cvs=document.getElementById('screen');
const ctx=cvs.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
function applyRenderScale(){
  cvs.width=VIEW_W*renderScale; cvs.height=VIEW_H*renderScale;
  ctx.imageSmoothingEnabled=false;
}
applyRenderScale();

/* ============================================================
   SECTION 4 — PIXEL RENDERING UTILITIES  (textures)
   ============================================================ */
function makeTex(size,fn){
  const c=mkCanvas(size,size), g=c.getContext('2d');
  const img=g.createImageData(size,size), d=img.data;
  for(let y=0;y<size;y++)for(let x=0;x<size;x++){
    const col=fn(x,y,size), i=(y*size+x)*4;
    d[i]=col[0];d[i+1]=col[1];d[i+2]=col[2];d[i+3]=(col.length>3?col[3]:255);
  }
  g.putImageData(img,0,0); return c;
}
const TEX={};
function buildTextures(){
  const B=BLOCK;
  const G1=[90,168,50],G2=[119,201,63],G3=[63,127,36];
  const D1=[122,82,48],D2=[150,102,60],D3=[92,61,34];
  TEX.grass=makeTex(B,(x,y)=>{
    const n=ih(x,y,7);
    const top=(y<3)||(y<5&&n<0.5);
    if(top){const c=n<0.18?G3:(n>0.82?G2:G1);return [c[0]+((n*22)|0)-11,c[1]+((n*26)|0)-13,c[2]];}
    const m=ih(x,y,11);const c=m<0.16?D3:(m>0.86?D2:D1);return c;
  });
  TEX.dirt=makeTex(B,(x,y)=>{const n=ih(x,y,11);const c=n<0.14?D3:(n>0.88?D2:D1);
    return [c[0]+((ih(x,y,31)*18)|0)-9,c[1]+((ih(x,y,31)*14)|0)-7,c[2]+((ih(x,y,31)*10)|0)-5];});
  TEX.stone=makeTex(B,(x,y)=>{const n=ih(x,y,17);
    let b=[138,138,148];
    if(n<0.12)b=[104,104,116]; else if(n>0.9)b=[164,164,176];
    const crack=(ih(x,y,23)<0.07)||(y===5&&x>2&&x<8)||(x===7&&y>5&&y<10);
    if(crack)b=[86,86,98];
    return b;});
  TEX.plank=makeTex(B,(x,y)=>{const row=Math.floor(y/4);const band=(row%2)?4:0;
    let b=[169,121,63];const n=ih(x,y+band,29);
    if(n<0.14)b=[140,98,49]; else if(n>0.9)b=[190,142,80];
    if(y%4===3)b=[112,78,38];
    if((x+band*3)%11===0&&y%4!==3)b=[128,90,45];
    return b;});
  TEX.log=makeTex(B,(x,y)=>{const n=ih(x,y,37);
    let b=[107,74,42];
    if(x<2||x>9)b=[80,54,30];
    else if(n>0.86)b=[134,96,54];
    else if(n<0.12)b=[88,60,34];
    if(x===5||x===6){if((y+((x===6)?3:0))%5===0)b=[126,90,50];}
    return b;});
  TEX.logTop=makeTex(B,(x,y)=>{const dx=x-5.5,dy=y-5.5,d=Math.sqrt(dx*dx+dy*dy);
    if(d>5.6)return [80,54,30];
    const ring=Math.sin(d*2.6)>0.3;
    return ring?[176,132,78]:[150,110,62];});
  TEX.leaf=makeTex(B,(x,y)=>{const n=ih(x,y,41),m=ih(x*3,y*2,43);
    if(m<0.10)return [0,0,0,0];
    let b=[47,122,42];
    if(n<0.16)b=[31,88,30]; else if(n>0.86)b=[80,166,58]; else if(n>0.6)b=[58,140,48];
    return [b[0],b[1],b[2],255];});
  TEX.leafDark=makeTex(B,(x,y)=>{const n=ih(x,y,47),m=ih(x*3,y*2,53);
    if(m<0.13)return [0,0,0,0];
    let b=[34,86,44];
    if(n<0.18)b=[22,62,32]; else if(n>0.85)b=[54,118,58];
    return [b[0],b[1],b[2],255];});
  TEX.pine=makeTex(B,(x,y)=>{const n=ih(x,y,59),m=ih(x*2,y*3,61);
    if(m<0.08)return [0,0,0,0];
    let b=[30,92,58];
    if(n<0.2)b=[20,66,42]; else if(n>0.87)b=[52,132,80];
    return [b[0],b[1],b[2],255];});
  TEX.path=makeTex(B,(x,y)=>{const n=ih(x,y,67);

const surf=new Int8Array(NCOL);
const pathFlag=new Uint8Array(NCOL);
const columnStone=new Uint8Array(NCOL);

function buildTerrain(){
  for(let i=0;i<NCOL;i++){
    const x=i*BLOCK;
    if(x>=CHASM0&&x<CHASM1){surf[i]=GAP;continue;}
    let h=0;
    if(x<300){ h=3+Math.round(1.4*Math.sin(x*0.011)+ih(i,3,5)*1.4); h=clamp(h,2,5); }
    else if(x<430){ h=Math.round(lerp(3,0,(x-300)/130)); }
    else if(x<2020){ h=0; }
    else { h=(Math.sin(x*0.006)>0.55)?1:0; if(x>2600&&Math.sin(x*0.004+2)>0.7)h=2; }
    surf[i]=h;
    pathFlag[i]=(x>=470&&x<=1180&&h===0)?1:0;
    columnStone[i]=((x>=CHASM0-BLOCK&&x<CHASM0+BLOCK*2)||(x>CHASM1-BLOCK*2&&x<=CHASM1+BLOCK))?1:0;
  }
  // keep bridge approaches flat
  for(let i=0;i<NCOL;i++){const x=i*BLOCK; if(x>=CHASM0-60&&x<CHASM1+60&&surf[i]!==GAP)surf[i]=0;}
}
buildTerrain();
function colOf(x){return clamp(Math.floor(x/BLOCK),0,NCOL-1);}
function surfaceY(x){const i=colOf(x);return surf[i]===GAP?null:-surf[i]*BLOCK;}
function groundYAt(x){
  if(x>=CHASM0&&x<CHASM1) return 0;              // bridge deck
  const s=surfaceY(x); return s===null?null:s;
}
function isGround(x){
  if(x>=CHASM0&&x<CHASM1) return bridgeSolidAt(x);
  return surf[colOf(x)]!==GAP;
}

/* ---------- trees ---------- */
const TREES=[];
function buildTreeSprite(tr){
  const w=tr.sw,h=tr.sh;
  const c=mkCanvas(w,h),g=c.getContext('2d');
  const ox=w/2, oy=h;
  const drawB=(tex,bx,by)=>{g.drawImage(tex,bx,by,BLOCK,BLOCK);};
  // trunk
  for(let k=0;k<tr.trunk;k++){
    drawB(TEX.log, ox-BLOCK/2, oy-(k+1)*BLOCK);
  }
  // canopy blocks (indices relative to canopy origin)
  const cx0=ox-tr.canW*BLOCK/2, cy0=oy-tr.trunk*BLOCK-tr.canH*BLOCK;
  for(const b of tr.canopy){ drawB(tr.leafTex, cx0+b[0]*BLOCK, cy0+b[1]*BLOCK); }
  tr.spr=c;
  // tile order for disintegration
  const T=6, cols=Math.ceil(w/T), rows=Math.ceil(h/T);
  tr.tile=T; tr.tileCols=cols; tr.tileRows=rows;
  tr.tileOrder=new Float32Array(cols*rows);
  const rnd=mulberry32(tr.seed*7919+13);
  for(let r=0;r<rows;r++)for(let cc=0;cc<cols;cc++){
    const bias=1-(cc/cols)*0.55 - (1-r/rows)*0.2;  // west + top first
    tr.tileOrder[r*cols+cc]=clamp(rnd()*0.65+bias*0.5,0,1);
  }
  tr.lastProg=0;
}
function canopyBlob(rnd,w,h,dense){
  const arr=[];
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const nx=(x-(w-1)/2)/((w-1)/2||1), ny=(y-(h-1)/2)/((h-1)/2||1);
    const d=Math.sqrt(nx*nx*1.05+ny*ny*1.35);
    if(d<dense+rnd()*0.28-0.1) arr.push([x,y]);
  }
  return arr;
}
function addTree(x,baseY,kind,seed,scale){
  const rnd=mulberry32(seed);
  const tr={x,baseY,kind,seed,state:'alive',shake:0,fall:0,prog:0,disappearAt:Infinity,hitCount:0};
  if(kind==='pine'){
    tr.trunk=3; tr.canW=5; tr.canH=5; tr.leafTex=TEX.pine;
    const c=[];
    const rows=[[0,4,5],[1,3,5],[1,3,4],[2,2,5],[2,2,4]];
    for(let y=0;y<5;y++){const r=rows[y];for(let x=r[0];x<r[0]+ (5-y*0.6|0);x++){ if(x<5) c.push([x,y]); }}
    tr.canopy=[[2,0],[1,1],[2,1],[3,1],[0,2],[1,2],[2,2],[3,2],[4,2],[0,3],[1,3],[2,3],[3,3],[4,3],[1,4],[2,4],[3,4]];
  }else if(kind==='bush'){
    tr.trunk=1; tr.canW=3; tr.canH=2; tr.leafTex=TEX.leafDark;
    tr.canopy=canopyBlob(rnd,3,2,0.95);
  }else{
    tr.trunk=3+Math.floor(rnd()*2); tr.canW=5; tr.canH=4; tr.leafTex=rnd()<0.5?TEX.leaf:TEX.leafDark;
    tr.canopy=canopyBlob(rnd,5,4,0.92);
  }
  tr.sw=tr.canW*BLOCK+8;
  tr.sh=(tr.trunk+tr.canH)*BLOCK+8;
  buildTreeSprite(tr);
  TREES.push(tr);
  return tr;
}
function buildTrees(){
  TREES.length=0;
  let s=1234;
  const R=()=> (s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff;
  // dense western forest / highlands
  for(let x=20;x<430;x+=26+R()*22){ const y=surfaceY(x); if(y===null)continue;
    addTree(x+R()*10,y,R()<0.55?'pine':'oak',Math.floor(R()*99999)+1,1); }
  // village scattered trees
  const vt=[455,610,690,742,930,1010,1122,1200];
  for(const x of vt){ const y=surfaceY(x); if(y===null)continue;
    addTree(x,y, x===690||x===1200 ? 'oak' : (R()<0.4?'pine':'oak'), Math.floor(R()*99999)+1,1); }
  // mid forest belt
  for(let x=1240;x<CHASM0-30;x+=24+R()*20){ const y=surfaceY(x); if(y===null)continue;
    addTree(x+R()*8,y,R()<0.5?'pine':'oak',Math.floor(R()*99999)+1,1); }
  // far-side forest (survives)
  for(let x=CHASM1+70;x<WORLD_W-40;x+=30+R()*28){ const y=surfaceY(x); if(y===null)continue;
    if(Math.abs(x-2100)<90||Math.abs(x-2360)<60) continue;
    addTree(x+R()*10,y,R()<0.45?'pine':'oak',Math.floor(R()*99999)+1,1); }
  TREES.sort((a,b)=>a.baseY-b.baseY||a.x-b.x);
  // special trees
  TREE_CHOP1=TREES.find(t=>Math.abs(t.x-690)<2);
  TREE_CHOP2=TREES.find(t=>Math.abs(t.x-1200)<2);
}

/* ---------- houses (block based so they can break apart) ---------- */
const HOUSES=[];
function makeHouse(cx,baseY,wB,hB,opt){
  opt=opt||{};
  const h={cx,baseY,wB,hB,blocks:[],breakAt:Infinity,damaged:!!opt.damaged,broken:false};
  const x0=cx-(wB*BLOCK)/2;
  const wallTex=opt.wall||TEX.plank, roofTex=opt.roof||TEX.roof;
  // walls
  for(let y=0;y<hB;y++){
    for(let x=0;x<wB;x++){
      const edge=(x===0||x===wB-1);
      if(!edge&&y<hB-1&&!(y===hB-1)) { if(y<hB-1&&!edge) continue; }
      // fill interior only for the top band to keep block count sane
      if(!edge && y<hB-2) continue;
      let tex=wallTex;
      h.blocks.push({x:x0+x*BLOCK,y:baseY-(y+1)*BLOCK,tex,ord:0,vx:0,vy:0,vr:0,detached:false});
    }
  }
  // solid interior (cheap: only 2 rows so we can see a wall mass)
  for(let y=0;y<hB-1;y++)for(let x=1;x<wB-1;x++){
    if(y%2===0||x%3===0) h.blocks.push({x:x0+x*BLOCK,y:baseY-(y+1)*BLOCK,tex:wallTex,ord:0,vx:0,vy:0,vr:0,detached:false});
  }
  // gable roof
  const rows=Math.ceil(wB/2)+1;
  for(let r=0;r<rows;r++){
    const inset=r; const ww=wB-inset*2; if(ww<=0)break;
    for(let x=inset;x<inset+ww;x++){
      h.blocks.push({x:x0+x*BLOCK,y:baseY-(hB+r+1)*BLOCK,tex:roofTex,ord:0,vx:0,vy:0,vr:0,detached:false});
    }
  }
  // door
  h.door={x:cx-BLOCK*0.75,y:baseY-BLOCK*2.1,w:BLOCK*1.5,h:BLOCK*2.1};
  // windows
  h.wins=[];
  const wxs=[x0+BLOCK*1.2, x0+(wB-2.6)*BLOCK];
  for(const wx of wxs){ h.wins.push({x:wx,y:baseY-(hB-1.3)*BLOCK,w:BLOCK*1.4,h:BLOCK*1.4}); }
  // detachment order (west side first => pulled into the void)
  const rnd=mulberry32(Math.floor(cx*13.7));
  h.blocks.forEach(b=>{
    const rel=(b.x-x0)/(wB*BLOCK);
    b.ord=clamp((1-rel)*0.6+rnd()*0.4,0,1);
    b.vx=-14-rnd()*26; b.vy=-26-rnd()*44; b.vr=(rnd()-0.5)*4.2;
  });
  h.blocks.sort((a,b)=>a.y-b.y||a.x-b.x);
  h.x0=x0; h.top=baseY-(hB+rows)*BLOCK;
  HOUSES.push(h); return h;
}

}

const BRIDGE={x0:CHASM0,x1:CHASM1,y:0,blocks:[]};
function buildBridge(){
  BRIDGE.blocks.length=0;
  for(let x=CHASM0;x<CHASM1;x+=BLOCK){
    BRIDGE.blocks.push({x,y:0,collapseAt:Infinity,ord:0});
  }
  // deterministic collapse order for the east end (where the hero stands)
  BRIDGE.blocks.forEach((b,i)=>{
    const rel=(b.x-CHASM0)/(CHASM1-CHASM0);
    b.ord=clamp(rel*0.75+ih(i,5,3)*0.25,0,1);
    b.vx=-10-ih(i,7,3)*22; b.vy=-6-ih(i,9,3)*20; b.vr=(ih(i,11,3)-0.5)*3;
  });
}

function bridgeCollapseTimeAt(x){
  const rel=clamp((x-CHASM0)/(CHASM1-CHASM0),0,1);
  const ord=clamp(rel*0.75+0.12,0,1);
  return 24.55+ord*1.05;
}
function bridgeSolidAt(x){
  if(x<CHASM0||x>=CHASM1)return true;
  return storyT < bridgeCollapseTimeAt(x);
}

function drawFace(pal,expr,blink){
  // head local space: head occupies x[-4..4], y[-8..0]
  const sk=pal.skin, sd=pal.skinD;
  // shading on the back side
  Rp(-4,-8,1.4,8,sd);
  if(blink>0.5){
    Rp(-2.7,-5.0,1.9,0.7,'#2a1c14'); Rp(0.7,-5.0,1.9,0.7,'#2a1c14');
  }else{
    let ew=1.7,eh=2.1,ey=-5.6,pup='#241a14';

    if(expr==='sad'){eh=1.8;ey=-5.3;}
    Rp(-2.9,ey,ew,eh,'#f6f2ea'); Rp(0.8,ey,ew,eh,'#f6f2ea');
    let px=0.5;
    if(expr==='shocked'||expr==='scared')px=0.35;
    Rp(-2.9+ew-1.1,ey+0.35,0.95,eh-0.7,pup); Rp(0.8+ew-1.1+px,ey+0.35,0.95,eh-0.7,pup);
    // brows
    let b1=-6.9,b2=-6.9,t1=0,t2=0;

    if(expr==='confused'){b1=-7.2;b2=-6.5;t1=-0.22;t2=0.26;}
    if(expr==='sad'){b1=-7.4;b2=-7.4;t1=-0.34;t2=0.34;}
    if(expr==='shocked'||expr==='scared'){b1=-7.5;b2=-7.5;}

    ctx.save();ctx.translate(1.7,b2);ctx.rotate(t2);Rp(-1.1,-0.45,2.3,0.9,pal.hairD);ctx.restore();
  }
  // mouth
  const m='#7a3b32';

  else if(expr==='shocked'||expr==='scared'){Rp(-1.1,-3.1,2.2,2.3,'#5c2620');Rp(-1.1,-3.1,2.2,0.7,'#3f1a16');}
  else if(expr==='sad'){Rp(-1.5,-2.1,3.0,0.8,m);Rp(-2.1,-1.7,0.8,0.7,m);Rp(1.3,-1.7,0.8,0.7,m);}
  else if(expr==='determined'){Rp(-1.4,-2.4,2.8,0.85,m);}
  else if(expr==='confused'){Rp(-1.0,-2.5,2.0,0.8,m);}
  else {Rp(-1.3,-2.5,2.6,0.8,m);}
  // cheek blush
  if(expr==='happy'){Rp(-3.4,-3.6,1.2,0.9,'rgba(220,120,100,.35)');Rp(2.2,-3.6,1.2,0.9,'rgba(220,120,100,.35)');}
}

/* Main figure renderer: origin at feet, y up = negative */
function drawFigure(def,pose,dim){
  const s=def.scale*(pose.scaleMul||1), f=pose.facing;

  ctx.restore();
  // legs
  drawLeg(-1.9,hipY,legR,pal,9-cr*0.6);
  drawLeg( 1.9,hipY,legL,pal,9-cr*0.6);
  // upper body
  ctx.save();ctx.translate(0,hipY);ctx.rotate(lean);
  // torso
  Rp(-4,-10,8,10,pal.shirt);
  Rp(-4,-10,1.5,10,pal.shirtD);

  Rp(-4,-10,8,1.0,pal.shirtL);

  // head
  drawHead(def,pose.expr,pose.blink,pose.headTilt);

  drawArm(2.1,shY+0.6,pose.armL,pal,true,pose.axe,pose.axeRot,pose.armBendL);

const PMAX=1500;
const PX=new Float32Array(PMAX),PY=new Float32Array(PMAX),PVX=new Float32Array(PMAX),PVY=new Float32Array(PMAX);
const PL=new Float32Array(PMAX),PML=new Float32Array(PMAX),PS=new Float32Array(PMAX),PFX=new Float32Array(PMAX),PFY=new Float32Array(PMAX);
const PT=new Uint8Array(PMAX);      // 0 dead,1 wood,2 leaf,3 dust,4 purple,5 stone,6 spark,7 smoke,8 glowdot
const PC=new Array(PMAX);
let pHead=0,pCount=0;
const PCOL={
  wood:['#a97a44','#8a5c30','#6a4423'],
  leaf:['#4f9a3a','#37762a','#67b84a'],
  dust:['#b09a7a','#8c7a5e','#6d5c46'],
  stone:['#9a9aa6','#7c7c88','#b6b6c2'],
  purple:['#c98cff','#9a4ff0','#e6c8ff','#6b21b8'],
  smoke:['#5a5468','#443f52','#6d6680'],
  spark:['#fff0b0','#ffd070','#ffffff']
};
function spawn(x,y,vx,vy,life,size,type,fx,fy,color){
  let i=pHead; let tries=0;
  while(PT[i]!==0&&tries<PMAX){i=(i+1)%PMAX;tries++;}
  pHead=(i+1)%PMAX;
  PX[i]=x;PY[i]=y;PVX[i]=vx;PVY[i]=vy;PL[i]=life;PML[i]=life;PS[i]=size;PT[i]=type;
  PFX[i]=fx||0;PFY[i]=fy||0;
  PC[i]=color||null;
}
function spawnSet(x,y,n,type,spread,spd,life,size,fx,fy){
  const cols=PCOL[type]||PCOL.dust;
  for(let k=0;k<n;k++){
    const a=Math.random()*TAU,r=Math.random()*spread;
    spawn(x+Math.cos(a)*r,y+Math.sin(a)*r*0.7,
      Math.cos(a)*spd*(0.4+Math.random()),Math.sin(a)*spd*(0.4+Math.random())-spd*0.3,
      life*(0.6+Math.random()*0.7),size*(0.6+Math.random()*0.9),type,fx||0,fy||0,
      cols[(Math.random()*cols.length)|0]);
  }
}
function updateParticles(dt){
  for(let i=0;i<PMAX;i++){
    if(PT[i]===0)continue;
    PL[i]-=dt;
    if(PL[i]<=0){PT[i]=0;continue;}
    PVX[i]+=PFX[i]*dt; PVY[i]+=PFY[i]*dt;
    const drag=(PT[i]===4||PT[i]===8)?0.985:0.995;
    PVX[i]*=drag;PVY[i]*=drag;
    PX[i]+=PVX[i]*dt; PY[i]+=PVY[i]*dt;
  }
}
function clearParticles(){for(let i=0;i<PMAX;i++)PT[i]=0;pHead=0;}
function drawParticles(){
  for(let i=0;i<PMAX;i++){
    const t=PT[i]; if(t===0)continue;
    const a=clamp(PL[i]/PML[i],0,1);
    const s=PS[i]*(t===7?(2-a):1);
    let col=PC[i]||'#ffffff';
    if(t===4||t===8){
      ctx.globalAlpha=a*0.9; ctx.fillStyle=col;
      ctx.fillRect(PX[i]-s/2,PY[i]-s/2,s,s);
      ctx.globalAlpha=a*0.35; ctx.fillStyle='#ffffff';
      ctx.fillRect(PX[i]-s*0.25,PY[i]-s*0.25,s*0.5,s*0.5);
      ctx.globalAlpha=1;
    }else if(t===7){
      ctx.globalAlpha=a*0.34; ctx.fillStyle=col;
      ctx.fillRect(PX[i]-s/2,PY[i]-s/2,s,s); ctx.globalAlpha=1;
    }else{
      ctx.globalAlpha=t===6?a:1; ctx.fillStyle=col;
      ctx.fillRect(PX[i]-s/2,PY[i]-s/2,s,s);
      ctx.globalAlpha=1;
      if(t===1||t===5){ctx.fillStyle='rgba(0,0,0,.22)';ctx.fillRect(PX[i]-s/2,PY[i]+s*0.2,s,s*0.3);}
    }
  }
  ctx.globalAlpha=1;
}

const SND={
  ctx:null,master:null,sfx:null,noise:null,ready:false,
  muted:false,sfxVol:0.14,narrVol:1.0,
  loops:{},
  init(){
    if(this.ctx)return;

    if(!AC){return;}
    try{ this.ctx=new AC(); }catch(e){ return; }
    this.master=this.ctx.createGain(); this.master.gain.value=this.muted?0:1; this.master.connect(this.ctx.destination);
    this.sfx=this.ctx.createGain(); this.sfx.gain.value=this.sfxVol; this.sfx.connect(this.master);
    const len=this.ctx.sampleRate*2;
    const buf=this.ctx.createBuffer(1,len,this.ctx.sampleRate);
    const d=buf.getChannelData(0); let last=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1; last=(last+0.02*w)/1.02; d[i]=w*0.6+last*2.2;}
    this.noise=buf; this.ready=true;
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  suspend(){ if(this.ctx&&this.ctx.state==='running')this.ctx.suspend(); },
  src(rate){const s=this.ctx.createBufferSource();s.buffer=this.noise;s.loop=true;s.playbackRate.value=rate||1;return s;},
  env(g,t0,a,d,peak){g.gain.setValueAtTime(0.0001,t0);g.gain.linearRampToValueAtTime(peak,t0+a);g.gain.exponentialRampToValueAtTime(0.0001,t0+a+d);},
  chop(){ if(!this.ready||this.muted)return; const t=this.ctx.currentTime;
    const s=this.src(1.0),bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1100;bp.Q.value=1.1;
    const g=this.ctx.createGain();this.env(g,t,0.004,0.10,0.9);
    s.connect(bp);bp.connect(g);g.connect(this.sfx);s.start(t);s.stop(t+0.16);
    const o=this.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(62,t+0.13);
    const g2=this.ctx.createGain();this.env(g2,t,0.004,0.14,0.6);o.connect(g2);g2.connect(this.sfx);o.start(t);o.stop(t+0.22);
  },
  thud(vol){ if(!this.ready||this.muted)return; const t=this.ctx.currentTime;
    const o=this.ctx.createOscillator();o.type='sine';o.frequency.setValueAtTime(110,t);o.frequency.exponentialRampToValueAtTime(48,t+0.18);
    const g=this.ctx.createGain();this.env(g,t,0.006,0.2,vol||0.5);o.connect(g);g.connect(this.sfx);o.start(t);o.stop(t+0.3);
  },
  crack(){ if(!this.ready||this.muted)return; const t=this.ctx.currentTime;
    const s=this.src(1.6),hp=this.ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=1600;
    const g=this.ctx.createGain();this.env(g,t,0.002,0.07,0.55);s.connect(hp);hp.connect(g);g.connect(this.sfx);s.start(t);s.stop(t+0.12);
  },
  disintegrate(){ if(!this.ready||this.muted)return; const t=this.ctx.currentTime;
    const s=this.src(1.0),bp=this.ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=3;
    bp.frequency.setValueAtTime(500,t);bp.frequency.exponentialRampToValueAtTime(4200,t+0.55);
    const g=this.ctx.createGain();this.env(g,t,0.05,0.55,0.30);s.connect(bp);bp.connect(g);g.connect(this.sfx);s.start(t);s.stop(t+0.7);
  },
  bird(){ if(!this.ready||this.muted)return; const t0=this.ctx.currentTime;
    for(let k=0;k<3;k++){const t=t0+k*0.14+Math.random()*0.05;
      const o=this.ctx.createOscillator();o.type='sine';
      o.frequency.setValueAtTime(1900+Math.random()*500,t);
      o.frequency.exponentialRampToValueAtTime(2700+Math.random()*500,t+0.06);
      const g=this.ctx.createGain();this.env(g,t,0.008,0.07,0.16);o.connect(g);g.connect(this.sfx);o.start(t);o.stop(t+0.12);}

  collapse(){ if(!this.ready||this.muted)return; const t=this.ctx.currentTime;

    lp.frequency.setValueAtTime(1400,t);lp.frequency.exponentialRampToValueAtTime(160,t+1.1);

  setMuted(m){ this.muted=m; if(this.master)this.master.gain.value=m?0:1; },
  setSfxVol(v){ this.sfxVol=v; if(this.sfx)this.sfx.gain.value=v; },
  killAll(){ this.stopAllLoops(); if(this.ctx){ try{this.ctx.close();}catch(e){} this.ctx=null;this.ready=false;this.loops={}; } }

function loopRumble(){
  const s=SND.src(0.45),lp=SND.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=150;
  const g=SND.ctx.createGain();g.gain.value=0.0001;
  const lfo=SND.ctx.createOscillator();lfo.frequency.value=0.35;const lg=SND.ctx.createGain();lg.gain.value=0.18;
  lfo.connect(lg);lg.connect(g.gain);
  s.connect(lp);lp.connect(g);g.connect(SND.sfx);
  g.gain.linearRampToValueAtTime(0.5,SND.ctx.currentTime+1.2);
  s.start();lfo.start(); return {g,nodes:[s,lfo]};
}
function loopVoid(){
  const o1=SND.ctx.createOscillator();o1.type='sawtooth';o1.frequency.value=52;
  const o2=SND.ctx.createOscillator();o2.type='sawtooth';o2.frequency.value=78.5;
  const lp=SND.ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=340;
  const g=SND.ctx.createGain();g.gain.value=0.0001;
  o1.connect(lp);o2.connect(lp);lp.connect(g);
  const s=SND.src(1.0),bp=SND.ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1500;bp.Q.value=6;
  const g2=SND.ctx.createGain();g2.gain.value=0.0001;
  const lfo=SND.ctx.createOscillator();lfo.frequency.value=0.22;const lg=SND.ctx.createGain();lg.gain.value=0.05;
  lfo.connect(lg);lg.connect(g2.gain);
  s.connect(bp);bp.connect(g2);g2.connect(SND.sfx);
  g.connect(SND.sfx);
  const t=SND.ctx.currentTime;
  g.gain.linearRampToValueAtTime(0.20,t+2);
  g2.gain.linearRampToValueAtTime(0.06,t+2);
  o1.start();o2.start();s.start();lfo.start();
  return {g,nodes:[o1,o2,s,lfo]};
}
function loopWind(){
  const s=SND.src(0.8),bp=SND.ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=620;bp.Q.value=0.8;
  const g=SND.ctx.createGain();g.gain.value=0.0001;
  const lfo=SND.ctx.createOscillator();lfo.frequency.value=0.16;const lg=SND.ctx.createGain();lg.gain.value=0.05;
  lfo.connect(lg);lg.connect(g.gain);
  s.connect(bp);bp.connect(g);g.connect(SND.sfx);
  g.gain.linearRampToValueAtTime(0.11,SND.ctx.currentTime+1.5);
  s.start();lfo.start();return {g,nodes:[s,lfo]};
}

const VK_T=[0,10.0,11.5,13.0,14.5,16.0,17.5,19.0,20.4,22.0,23.0,24.0,25.2,26.4,30];
const VK_X=[-700,100,220,380,470,560,650,730,800,1050,1280,1470,1560,1566,1568];
function voidEdgeAt(t){
  if(t<=VK_T[0])return VK_X[0];
  for(let i=0;i<VK_T.length-1;i++){
    if(t>=VK_T[i]&&t<=VK_T[i+1]){
      const k=(t-VK_T[i])/(VK_T[i+1]-VK_T[i]);
      return lerp(VK_X[i],VK_X[i+1],sstep(k));
    }
  }
  return VK_X[VK_X.length-1];
}
function voidTimeAtX(x){
  if(x<=VK_X[0])return VK_T[0];
  for(let i=0;i<VK_X.length-1;i++){
    if(x>=VK_X[i]&&x<=VK_X[i+1]){
      const k=(x-VK_X[i])/(VK_X[i+1]-VK_X[i]);
      return lerp(VK_T[i],VK_T[i+1],k);
    }
  }
  return Infinity;
}

(function buildCues(){
  NARR.forEach((n,ni)=>{
    const words=n.text.split(' ');
    const chunks=[]; let cur='';
    for(const w of words){
      const t=(cur?cur+' ':'')+w;
      if(t.length>34&&cur){chunks.push(cur);cur=w;}else cur=t;
    }
    if(cur)chunks.push(cur);
    const totalLen=chunks.reduce((s,c)=>s+c.length,0);
    let acc=n.t;
    chunks.forEach(c=>{
      const d=(n.e-n.t)*(c.length/totalLen);
      CUES.push({t:acc,e:acc+d,text:c,ni});
      acc+=d;
    });
  });
})();

function walkPose(p,ph,speed,amp){
  const A=amp||0.55;
  p.legL=A*Math.sin(ph); p.legR=A*Math.sin(ph+Math.PI);
  p.armL=-A*0.85*Math.sin(ph); p.armR=-A*0.85*Math.sin(ph+Math.PI);
  p.bob=-0.35*Math.abs(Math.sin(ph));
  p.lean=speed==='run'?0.17:0.045;
  p.headTilt=speed==='run'?0.05:0.01;
}
function runPose(p,ph){
  const A=0.92;
  p.legL=A*Math.sin(ph); p.legR=A*Math.sin(ph+Math.PI);
  p.armL=-1.05*Math.sin(ph+Math.PI)*0.95; p.armR=-1.05*Math.sin(ph)*0.95;
  p.armBendL=0.55; p.armBendR=0.55;
  p.bob=-1.5*Math.abs(Math.sin(ph))-0.2;
  p.lean=0.20; p.headTilt=0.06;
}
function idlePose(p,ph,expr){
  p.legL=0.04*Math.sin(ph*0.6); p.legR=-0.04*Math.sin(ph*0.6);
  p.armL=0.06*Math.sin(ph*0.8)+0.04; p.armR=-0.06*Math.sin(ph*0.8)-0.04;
  p.bob=-0.30*Math.sin(ph*1.2);
  p.lean=0.012*Math.sin(ph*0.5);
  p.expr=expr||'neutral';
}
function chopPose(p,u){
  let armA,axeR,leanA;
  if(u<0.42){const k=easeIO(u/0.42);armA=lerp(-0.25,-2.55,k);axeR=lerp(0.15,-0.30,k);leanA=lerp(0.03,-0.14,k);}
  else if(u<0.55){const k=(u-0.42)/0.13;const kk=k*k;armA=lerp(-2.55,1.10,kk);axeR=lerp(-0.30,0.42,k);leanA=lerp(-0.14,0.22,k);}
  else if(u<0.66){armA=1.10;axeR=0.42;leanA=0.22;}
  else {const k=(u-0.66)/0.34;armA=lerp(1.10,-0.25,k);axeR=lerp(0.42,0.15,k);leanA=lerp(0.22,0.03,k);}
  p.armL=armA;p.armR=armA*0.88;p.axeRotR=axeR;p.axeRot=axeR;
  p.lean=leanA;p.headTilt=leanA*0.35;
  p.legL=0.30;p.legR=-0.34;p.bob=leanA*1.6;
  p.axe=false;p.axeBack=true;
  p.expr='determined';
  return (u>=0.55&&u<0.66);
}
function lookUpPose(p,ph,amt){
  idlePose(p,ph,'confused');
  p.headTilt=-0.42*amt;
  p.armL=lerp(p.armL,0.30,amt);p.armR=lerp(p.armR,-0.30,amt);
  p.lean=-0.08*amt; p.bob=p.bob-0.4*amt;
  if(amt>0.6)p.expr='shocked';
}
function scaredPose(p,ph,amt){
  p.legL=0.10*Math.sin(ph*9);p.legR=-0.10*Math.sin(ph*9);
  p.armL=-1.35*amt-0.2*Math.sin(ph*11);p.armR=-1.25*amt+0.2*Math.sin(ph*11);
  p.headTilt=-0.18*amt;p.lean=-0.10*amt;p.tremble=1.1*amt;
  p.expr=amt>0.5?'scared':'confused';p.bob=-0.5*amt;
}
function reachPose(p,ph,amt){
  p.legL=0.22*amt;p.legR=-0.30*amt;
  p.armL=-2.05*amt+0.06*Math.sin(ph*3);p.armR=-1.95*amt-0.06*Math.sin(ph*3.4);
  p.lean=0.20*amt;p.headTilt=0.16*amt;p.expr='sad';p.bob=-0.3*amt;
}
function fallPose(p,ph){
  p.legL=-0.85+0.45*Math.sin(ph*11);p.legR=0.70+0.45*Math.sin(ph*11+2);
  p.armL=-2.6+0.35*Math.sin(ph*13);p.armR=-2.4+0.35*Math.sin(ph*13+1.6);
  p.lean=-0.30;p.headTilt=-0.30;p.expr='shocked';p.bob=0;
}
function sitPose(p,ph,expr){
  p.crouch=1.55;
  p.legL=0.30+0.06*Math.sin(ph*1.6);p.legR=-0.22+0.05*Math.sin(ph*1.6+1);
  p.armL=-0.55+0.30*Math.sin(ph*2.1);p.armR=-0.42+0.26*Math.sin(ph*2.1+2.1);
  p.lean=0.05+0.02*Math.sin(ph*1.3);
  p.headTilt=0.06*Math.sin(ph*1.1+0.5)-0.10*Math.max(0,Math.sin(ph*2.1));
  p.expr=expr||'happy';p.bob=-0.25*Math.sin(ph*1.3);
}

const cam={x:640,y:-104,z:1.0,shake:0,sx:0,sy:0};
let camInit=false;
const actors={};
function currentShot(t){return shotAt(t);}
function desiredCam(t){
  const s=shotAt(t);
  if(s.interior)return null;
  const k=clamp((t-s.a)/(s.b-s.a),0,1);
  const ke=easeIO(k);
  let x,y,z;
  if(s.follow){
    const a=actors[s.follow==='group'?'group':s.follow];
    x=(a?a.x:800)+(s.lead||0);
    y=s.y; z=s.z;
  }else{
    x=s.x0!==undefined?lerp(s.x0,s.x1!==undefined?s.x1:s.x0,ke):(s.x||800);
    y=s.y0!==undefined?lerp(s.y0,s.y1,ke):(s.y||-60);
    z=s.z0!==undefined?lerp(s.z0,s.z1,ke):(s.z||1.5);
  }
  return {x,y,z,cut:!!s.cut,shot:s};
}
function updateCamera(t,dt){
  const d=desiredCam(t);
  if(!d){cam.shake=0;return;}
  // shake profile
  let sh=0;
  if(t>=9.1&&t<13.2) sh=lerp(0,1.7,seg(t,9.1,10.4));
  if(t>=13.2&&t<21.0) sh=1.7+0.9*Math.sin(t*0.9);
  if(t>=21.0&&t<26.6) sh=2.1;
  if(t>=24.5&&t<26.2) sh=3.4;
  if(t>=27.1) sh=lerp(1.0,0,seg(t,27.1,28.4));
  cam.shake=sh;
  cam.sx=(Math.random()-0.5)*sh*2; cam.sy=(Math.random()-0.5)*sh*1.5;
  if(d.cut||!camInit){ cam.x=d.x;cam.y=d.y;cam.z=d.z;camInit=true; }
  else{
    const f=1-Math.exp(-dt*7.0);
    cam.x=lerp(cam.x,d.x,f);cam.y=lerp(cam.y,d.y,f);cam.z=lerp(cam.z,d.z,f);
  }
}
function beginWorldTransform(){

const strips={};
function buildStrips(){
  // hills
  function hill(w,h,cols,seed,amp,base){
    const c=mkCanvas(w,h),g=c.getContext('2d');
    for(let x=0;x<w;x++){
      const y=base+Math.sin(x*0.012+seed)*amp+Math.sin(x*0.031+seed*2)*amp*0.42+ (ih(x,seed,3)-0.5)*amp*0.5;
      const yy=Math.round(y);
      g.fillStyle=cols[0];g.fillRect(x,yy,1,h-yy);
      g.fillStyle=cols[1];g.fillRect(x,yy,1,2);
      g.fillStyle=cols[2];g.fillRect(x,yy+3,1,h-yy-3);
    }
    return c;
  }
  strips.hillFar=hill(900,140,['#00000000','#00000000','#00000000'],3,0,0);
  strips.hillFar=hill(900,140,['rgba(0,0,0,0)','#6f9a6b','#5d8759'],3,17,60);
  strips.hillNear=hill(900,140,['rgba(0,0,0,0)','#4f7a4c','#3f6640'],7,10,86);
  // distant treeline
  (function(){
    const w=900,h=90,c=mkCanvas(w,h),g=c.getContext('2d');
    const rnd=mulberry32(19);
    g.fillStyle='#2f5a34';
    for(let x=0;x<w;x+=6){
      const th=24+rnd()*30;
      g.fillRect(x,h-th,6,th);
      g.fillRect(x+1,h-th-6,4,7);
      if(rnd()<0.4){g.fillStyle='#3a6b3e';g.fillRect(x+1,h-th+3,4,5);g.fillStyle='#2f5a34';}
    }
    g.fillStyle='#25492a';g.fillRect(0,h-8,w,8);
    strips.trees=c;
  })();
  // clouds
  strips.clouds=[];
  for(let i=0;i<7;i++){
    const w=54+((i*37)%46),h=16+((i*13)%10);
    const c=mkCanvas(w,h),g=c.getContext('2d');
    const rnd=mulberry32(100+i);
    g.fillStyle='#ffffff';
    for(let k=0;k<9;k++){
      const bw=10+rnd()*20,bh=5+rnd()*7,bx=rnd()*(w-bw),by=h-bh-rnd()*(h-bh);
      g.fillRect(bx,by,bw,bh);
    }
    g.fillStyle='rgba(200,220,245,1)';
    for(let k=0;k<5;k++){const bw=8+rnd()*16,bx=rnd()*(w-bw);g.fillRect(bx,h-4,bw,4);}
    strips.clouds.push({c,x:rnd()*900,y:8+((i*23)%46),sp:4+((i*7)%9),w});
  }
}

function drawSky(t,m){

  // stars during darkness
  if(m.darkAmt>0.35){

    for(let i=0;i<46;i++){

function drawClouds(t,m){

function drawTree(tr,t,edgeX,vb){
  if(tr.x<vb.x0-60||tr.x>vb.x1+60)return;
  if(tr.gone)return;
  const spr=tr.spr;
  let ox=tr.x-spr.width/2, oy=tr.baseY-spr.height;
  // shake
  let sh=0;
  if(tr.shakeT>0) sh=Math.sin(tr.shakeT*42)*tr.shakeT*2.6;
  if(t>9.0&&t<13.0&&tr.x<1400) sh+=Math.sin(clock*9+tr.x)*0.9*seg(t,9.0,10.0);
  ox+=sh;
  // falling
  if(tr.fallT>0){
    ctx.save();ctx.translate(tr.x,tr.baseY);ctx.rotate(tr.fallT*tr.fallDir*Math.PI*0.46);ctx.translate(-tr.x,-tr.baseY);
    ctx.drawImage(spr,ox,oy);
    ctx.restore();return;
  }
  // disintegrating
  if(tr.prog>0&&tr.prog<1){
    const T=tr.tile,cols=tr.tileCols,rows=tr.tileRows;
    const pull=clamp((tr.x-edgeX)/120,0,1);
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
      const o=tr.tileOrder[r*cols+c];
      if(o<=tr.prog)continue;
      const sw=Math.min(T,spr.width-c*T),shh=Math.min(T,spr.height-r*T);
      const near=(o-tr.prog)<0.10;
      const dx=(1-pull)*(near?-3.0:0);
      ctx.drawImage(spr,c*T,r*T,sw,shh,ox+c*T+dx,oy+r*T-(near?1.6:0),sw,shh);
    }
    return;
  }
  if(tr.prog>=1)return;
  // leaning toward the void when close
  const pull=clamp(1-(tr.x-edgeX)/150,0,1);
  if(pull>0.02){
    ctx.save();ctx.translate(tr.x,tr.baseY);ctx.rotate(-pull*0.14);ctx.translate(-tr.x,-tr.baseY);
    ctx.drawImage(spr,ox,oy);ctx.restore();
  }else ctx.drawImage(spr,ox,oy);
}

function updateTrees(t,dt){
  const edge=voidEdgeAt(t);
  for(const tr of TREES){
    if(tr.shakeT>0)tr.shakeT=Math.max(0,tr.shakeT-dt);
    // chopping tree 1 falls
    if(tr===TREE_CHOP1){
      if(t>=3.60){tr.fallDir=1;tr.fallT=Math.min(1,(t-3.60)/1.05);
        if(tr.fallT>=1&&!tr.landed){tr.landed=true;
          if(!seeking)SND.thud(0.5);
          spawnSet(tr.x+52,tr.baseY-4,14,'leaf',16,26,0.9,2.4,0,80);
          spawnSet(tr.x+40,tr.baseY-3,8,'dust',10,18,0.7,2.0,0,60);
          woodItems.push({x:tr.x+34,y:0,taken:false},{x:tr.x+48,y:0,taken:false},{x:tr.x+62,y:0,taken:false});
        }
      }
      continue;
    }
    if(tr===TREE_CHOP2){ tr.shakeT=Math.max(tr.shakeT,0); continue; }
    if(tr.disappearAt===Infinity)continue;
    if(t>=tr.disappearAt){
      const pr=clamp((t-tr.disappearAt)/1.25,0,1);
      if(pr>tr.prog&&!seeking){
        const n=Math.min(9,Math.ceil((pr-tr.prog)*46));
        const spr=tr.spr;
        for(let k=0;k<n;k++){
          spawn(tr.x+(Math.random()-0.5)*spr.width*0.8, tr.baseY-Math.random()*spr.height,
            (Math.random()-0.5)*26,-8-Math.random()*24,0.9+Math.random()*0.7,1.6+Math.random()*1.8,4,-46,-6);
        }
        if(pr-tr.prog>0.02&&Math.random()<0.30)SND.disintegrate();
      }
      tr.prog=pr;
      if(pr>=1)tr.gone=true;
    }
  }
  // wood pickup
  for(const w of woodItems){
    if(!w.taken&&t>=3.80&&Math.abs(hero.x-w.x)<26){w.taken=true;if(!seeking)SND.thud(0.22);
      spawnSet(w.x,w.y-4,6,'spark',4,26,0.4,1.4,0,-10);}
  }
}

  for(const n of NPCS){
    if(n.x<vb.x0||n.x>vb.x1)continue;
    if(n.depth<0.10)continue;
    drawActor(NPC_DEFS_DIM[NPC_DEFS.indexOf(n.def)]||n.def,n.pose,n.x,n.y-6*n.depth,null,n.pose.rot);
  }
  drawPropsLayer(t,vb,edge,true);
  drawHouses(t,edge,vb);
  // trees behind actors
  for(const tr of TREES){ if(tr.baseY<=0) drawTree(tr,t,edge,vb); }
  drawBridge(t,vb);
  drawWoodItems(t);
  // foreground NPCs
  for(const n of NPCS){
    if(n.x<vb.x0||n.x>vb.x1)continue;
    if(n.depth>=0.10)continue;
    drawActor(n.def,n.pose,n.x,n.y,null,n.pose.rot);
  }
  // trees in front
  for(const tr of TREES){ if(tr.baseY>0) drawTree(tr,t,edge,vb); }

  // actors
  if(wife.vis)drawActor(wife.def,wife.pose,wife.x,wife.y,null,wife.rot);
  if(kid.vis) drawActor(kid.def ,kid.pose ,kid.x ,kid.y ,null,kid.rot);
  if(hero.vis)drawActor(hero.def,hero.pose,hero.x,hero.y,null,hero.rot);
  drawAxeItem(t);
  drawDebris();
  drawParticles();
  drawBirds(t);
  drawVoidGlow(t,vb);

  // ---- screen-space grading ----
  ctx.setTransform(renderScale,0,0,renderScale,0,0);
  // disaster tint
  if(m.darkAmt>0.01){
    ctx.save();ctx.globalCompositeOperation='multiply';
    ctx.fillStyle='rgba('+Math.round(lerp(255,120,m.darkAmt))+','+Math.round(lerp(255,86,m.darkAmt))+','+Math.round(lerp(255,168,m.darkAmt))+',1)';
    ctx.globalAlpha=m.darkAmt*0.55*(1-m.dawnAmt);
    ctx.fillRect(0,0,VIEW_W,VIEW_H);ctx.restore();
  }
  if(m.dawnAmt>0.01){
    ctx.save();ctx.globalCompositeOperation='lighter';
    ctx.fillStyle='rgba(255,168,96,'+(0.13*m.dawnAmt)+')';ctx.fillRect(0,0,VIEW_W,VIEW_H);ctx.restore();
  }
  // lightning flashes
  if(t>11.0&&t<22.0){
    const f=Math.max(0,Math.sin(t*7.3)*Math.sin(t*2.1)-0.965)*22;
    if(f>0){ctx.save();ctx.globalCompositeOperation='lighter';ctx.fillStyle='rgba(180,140,255,'+(f*0.5)+')';ctx.fillRect(0,0,VIEW_W,VIEW_H);ctx.restore();}
  }
  // sunlight shafts (peaceful)
  if(m.day>0.35){
    ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=0.10*m.day;
    ctx.fillStyle='#fff3c0';
    for(let i=0;i<3;i++){
      const x=60+i*150+Math.sin(clock*0.25+i)*14;
      ctx.beginPath();ctx.moveTo(x,-10);ctx.lineTo(x+34,-10);ctx.lineTo(x+96,VIEW_H);ctx.lineTo(x+40,VIEW_H);ctx.closePath();ctx.fill();
    }
    ctx.restore();ctx.globalAlpha=1;
  }
  // vignette
  const vg=ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,VIEW_H*0.36,VIEW_W/2,VIEW_H/2,VIEW_H*0.92);
  vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(4,2,10,'+(0.42+m.darkAmt*0.28)+')');
  ctx.fillStyle=vg;ctx.fillRect(0,0,VIEW_W,VIEW_H);
  // scanline-ish grain (very subtle)
  ctx.globalAlpha=0.035;ctx.fillStyle='#000';
  for(let y=0;y<VIEW_H;y+=2)ctx.fillRect(0,y,VIEW_W,1);
  ctx.globalAlpha=1;
  // fade to black at end
  if(t>28.9){const a=easeIO(seg(t,28.9,29.95));ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,VIEW_W,VIEW_H);}
  if(t<0.35){const a=1-easeIO(seg(t,0,0.35));ctx.fillStyle='rgba(0,0,0,'+a+')';ctx.fillRect(0,0,VIEW_W,VIEW_H);}
}

/* ---------- title screen scene ---------- */
function drawTitle(){
  ctx.setTransform(renderScale,0,0,renderScale,0,0);
  const g=ctx.createLinearGradient(0,0,0,VIEW_H);
  g.addColorStop(0,'#0a0618');g.addColorStop(0.55,'#1a0b30');g.addColorStop(1,'#08040f');
  ctx.fillStyle=g;ctx.fillRect(0,0,VIEW_W,VIEW_H);
  // stars
  for(let i=0;i<70;i++){const x=(ih(i,3,11)*VIEW_W)|0,y=(ih(i,7,13)*170)|0;
    ctx.globalAlpha=0.25+0.6*Math.abs(Math.sin(clock*1.4+i));ctx.fillStyle='#cfc4ff';ctx.fillRect(x,y,1,1);}
  ctx.globalAlpha=1;
  // moon
  ctx.fillStyle='#e8e2ff';ctx.fillRect(382,34,16,16);ctx.fillStyle='#cfc6ee';ctx.fillRect(386,38,5,5);ctx.fillRect(392,44,3,3);
  ctx.save();ctx.globalCompositeOperation='lighter';
  const mg=ctx.createRadialGradient(390,42,2,390,42,60);mg.addColorStop(0,'rgba(190,170,255,.28)');mg.addColorStop(1,'rgba(150,120,255,0)');
  ctx.fillStyle=mg;ctx.fillRect(330,-18,120,120);ctx.restore();
  // distant purple glow
  ctx.save();ctx.globalCompositeOperation='lighter';
  const vg=ctx.createRadialGradient(110,190,4,110,190,190);
  vg.addColorStop(0,'rgba(180,90,255,'+(0.34+0.10*Math.sin(clock*1.1))+')');
  vg.addColorStop(0.45,'rgba(120,40,200,.14)');vg.addColorStop(1,'rgba(90,20,160,0)');
  ctx.fillStyle=vg;ctx.fillRect(-60,20,360,260);ctx.restore();
  // clouds
  strips.clouds.forEach((cl,i)=>{
    let x=((cl.x+clock*cl.sp*0.5)%1000+1000)%1000-140;
    ctx.globalAlpha=0.16;ctx.drawImage(cl.c,x,10+((i*29)%60));ctx.globalAlpha=1;
  });
  // far treeline
  drawStrip(strips.trees,0.0,168,[26,14,44],0.55);
  // silhouette forest
  ctx.fillStyle='#0b0616';
  for(let i=0;i<44;i++){
    const x=i*12-6,h=54+ih(i,5,9)*46;
    ctx.beginPath();ctx.moveTo(x,270);ctx.lineTo(x+6,270-h);ctx.lineTo(x+12,270);ctx.closePath();ctx.fill();
  }
  ctx.fillStyle='#070410';ctx.fillRect(0,252,VIEW_W,20);
  // ground blocks
  for(let x=0;x<VIEW_W;x+=BLOCK)ctx.drawImage(TEX.grass,x,246);
  ctx.fillStyle='rgba(6,3,14,.72)';ctx.fillRect(0,246,VIEW_W,26);
  // hero silhouette
  const p=makePose();idlePose(p,clock*1.3,'neutral');p.facing=-1;p.axe=true;p.axeRot=Math.PI*0.9;
  ctx.save();ctx.translate(306,248);
  drawFigure(DEF_HERO,p);
  ctx.restore();
  ctx.save();ctx.globalCompositeOperation='source-atop';ctx.restore();
  // darken the hero to a silhouette
  ctx.save();ctx.translate(306,248);ctx.scale(1,-1);
  ctx.globalCompositeOperation='source-atop';ctx.restore();
  ctx.save();
  ctx.globalAlpha=0.72;ctx.fillStyle='#0a0518';
  ctx.beginPath();ctx.rect(306-12,248-30,26,32);ctx.fill();ctx.restore();
  // floating purple particles
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<52;i++){
    const a=clock*0.55+i*1.9;
    const x=110+Math.cos(a*0.8+i)*120+Math.sin(a*0.33+i)*40;
    const y=190+Math.sin(a*1.2+i)*70-((clock*9+i*17)%120);
    ctx.globalAlpha=0.16+0.42*Math.abs(Math.sin(a*1.7));
    ctx.fillStyle=i%3?'#c58cff':'#8a3ce8';
    const s=1+ih(i,4,9)*1.8;ctx.fillRect(x,y,s,s);
  }
  ctx.globalAlpha=1;ctx.restore();
  const vg2=ctx.createRadialGradient(VIEW_W/2,VIEW_H/2,60,VIEW_W/2,VIEW_H/2,VIEW_H*0.95);
  vg2.addColorStop(0,'rgba(0,0,0,0)');vg2.addColorStop(1,'rgba(2,1,6,.80)');
  ctx.fillStyle=vg2;ctx.fillRect(0,0,VIEW_W,VIEW_H);
}

/* ============================================================
   SECTION 18 — NARRATION (speechSynthesis + fallback)
   ============================================================ */
const NARRSYS={
  supported:('speechSynthesis' in window),
  voice:null,spoken:[],active:null,
  init(){
    if(!this.supported)return;
    const pick=()=>{
      const vs=window.speechSynthesis.getVoices()||[];
      if(!vs.length)return;
      const pref=['Google UK English Male','Google US English','Daniel','Microsoft David','Microsoft Mark','Alex','Karen','Samantha'];
      let v=null;
      for(const p of pref){v=vs.find(x=>x.name.indexOf(p)>=0);if(v)break;}
      if(!v)v=vs.find(x=>/^en/i.test(x.lang));
      this.voice=v||vs[0]||null;
      document.getElementById('voiceLbl').textContent=this.voice?this.voice.name.slice(0,14).toUpperCase():'AUTO';
    };
    pick();
    if(window.speechSynthesis.onvoiceschanged!==undefined) window.speechSynthesis.addEventListener('voiceschanged',pick);
  },
  reset(t){
    if(this.supported){try{window.speechSynthesis.cancel();}catch(e){}}
    this.spoken=NARR.map(n=>n.t<=t);
    this.active=null;
  },
  update(t,playing){
    if(!this.supported||!playing)return;
    for(let i=0;i<NARR.length;i++){
      if(!this.spoken[i]&&t>=NARR[i].t&&t<NARR[i].e){
        this.spoken[i]=true;this.speak(NARR[i]);
      }else if(!this.spoken[i]&&t>=NARR[i].e){this.spoken[i]=true;}
    }
  },
  speak(n){
    const words=n.text.split(/\s+/).length;
    const dur=Math.max(0.6,n.e-n.t);
    let rate=clamp((words/dur)/2.55,1.0,1.55);
    try{
      const u=new SpeechSynthesisUtterance(n.text);
      if(this.voice)u.voice=this.voice;
      u.rate=rate;u.pitch=0.94;u.volume=SND.muted?0:SND.narrVol;
      this.active=u;window.speechSynthesis.speak(u);
    }catch(e){}
  },
  pause(){if(this.supported){try{window.speechSynthesis.pause();}catch(e){}}},
  resume(){if(this.supported){try{window.speechSynthesis.resume();}catch(e){}}},
  cancel(){if(this.supported){try{window.speechSynthesis.cancel();}catch(e){}}this.active=null;}
};
NARRSYS.init();

/* ============================================================
   SECTION 19 — UI CONTROLS
   ============================================================ */
const stage=document.getElementById('stage');
const titleEl=document.getElementById('title');
const ctrlEl=document.getElementById('controls');
const subsEl=document.getElementById('subs');
const subText=document.getElementById('subText');
const fillEl=document.getElementById('fill');
const knobEl=document.getElementById('knob');
const timeEl=document.getElementById('time');
const trackEl=document.getElementById('track');
const hintEl=document.getElementById('hint');
const settingsEl=document.getElementById('settings');
let captionsOn=true, soundOn=true, mode='title', playing=false, lastTs=0, hideTimer=0;

function fmt(s){s=Math.max(0,s);const m=Math.floor(s/60),ss=Math.floor(s%60);return m+':'+(ss<10?'0':'')+ss;}
function layout(){
  const vw=window.innerWidth,vh=window.innerHeight;
  let sw=vw,sh=vw*9/16;
  if(sh>vh){sh=vh;sw=vh*16/9;}
  sw=Math.floor(sw);sh=Math.floor(sh);
  stage.style.width=sw+'px';stage.style.height=sh+'px';
  stage.style.setProperty('--fs',Math.max(7,Math.round(sw/480*8.4))+'px');
}
window.addEventListener('resize',layout);layout();

// scene markers on the progress bar
(function(){[7,13,21,27].forEach(s=>{const d=document.createElement('div');d.className='mk';d.style.left=(s/DUR*100)+'%';document.getElementById('marks').appendChild(d);});})();

function showHint(msg,ms){hintEl.textContent=msg;hintEl.classList.add('show');clearTimeout(showHint._t);showHint._t=setTimeout(()=>hintEl.classList.remove('show'),ms||2600);}

function setMode(m){
  mode=m;
  if(m==='title'){titleEl.classList.remove('gone');ctrlEl.classList.add('hide');subsEl.classList.add('hidden');}
  else{titleEl.classList.add('gone');ctrlEl.classList.remove('hide');poke();}
}
function setPlaying(v){
  playing=v;
  document.getElementById('icPlay').style.display=v?'none':'block';
  document.getElementById('icPause').style.display=v?'block':'none';
  if(v){SND.init();SND.resume();NARRSYS.resume();}
  else{NARRSYS.pause();SND.suspend();}
}
function startStory(){
  SND.init();SND.resume();
  doRestart();
  setMode('play');
  setPlaying(true);
  if(!NARRSYS.supported) showHint('VOICE SYNTHESIS UNAVAILABLE — CAPTIONS CARRY THE STORY',3600);
}
function doRestart(){
  storyT=0;clock=0;seeking=false;
  resetWorldState();
  resetSfxFlags(0);
  NARRSYS.reset(0);
  SND.stopAllLoops();
  camInit=false;
  updateStory(0,0);
  updateCamera(0,0.016);
  updateUI(true);
}
function seekTo(t){
  t=clamp(t,0,DUR);
  seeking=true;
  storyT=t;
  resetWorldState();
  // fast-forward transient world state to t (pure functions handle the rest)
  resetSfxFlags(t);
  NARRSYS.reset(t);
  SND.stopAllLoops();
  camInit=false;
  // step particles-free simulation so disintegration progress matches
  const steps=Math.min(240,Math.ceil(t*14));
  const dt=t/Math.max(1,steps);
  let st=0;
  for(let i=0;i<steps;i++){st+=dt;updateTrees(st,0);updateHouses(st);}
  updateStory(t,0);
  updateCamera(t,0.016);
  seeking=false;
  updateUI(true);
}
function poke(){clearTimeout(hideTimer);ctrlEl.classList.remove('hide');
  hideTimer=setTimeout(()=>{if(playing&&mode==='play')ctrlEl.classList.add('hide');},2600);}
stage.addEventListener('mousemove',()=>{if(mode==='play')poke();});
stage.addEventListener('touchstart',()=>{if(mode==='play')poke();},{passive:true});
stage.addEventListener('click',()=>{if(mode==='play')poke();});

document.getElementById('btnStart').addEventListener('click',startStory);
document.getElementById('btnPlay').addEventListener('click',()=>{
  if(mode==='title'){startStory();return;}
  if(storyT>=DUR){doRestart();setPlaying(true);return;}
  setPlaying(!playing);
});
document.getElementById('btnRestart').addEventListener('click',()=>{doRestart();setPlaying(true);});
function toggleSound(){
  soundOn=!soundOn;SND.setMuted(!soundOn);
  document.getElementById('btnSound').classList.toggle('on',soundOn);
  document.getElementById('btnSound').classList.toggle('off',!soundOn);
  const b=document.getElementById('btnSound2');b.textContent='SOUND: '+(soundOn?'ON':'OFF');b.classList.toggle('on',soundOn);
  if(!soundOn){NARRSYS.cancel();SND.stopAllLoops();}else{SND.resume();NARRSYS.reset(storyT);}
}
function toggleCc(){
  captionsOn=!captionsOn;
  document.getElementById('btnCc').classList.toggle('on',captionsOn);
  document.getElementById('btnCc').classList.toggle('off',!captionsOn);
  subsEl.style.display=captionsOn?'flex':'none';
  const b=document.getElementById('btnCc2');b.textContent='CAPTIONS: '+(captionsOn?'ON':'OFF');b.classList.toggle('on',captionsOn);
}
document.getElementById('btnSound').addEventListener('click',toggleSound);
document.getElementById('btnSound2').addEventListener('click',toggleSound);
document.getElementById('btnCc').addEventListener('click',toggleCc);
document.getElementById('btnCc2').addEventListener('click',toggleCc);
document.getElementById('btnFull').addEventListener('click',()=>{
  if(!document.fullscreenElement){ (stage.requestFullscreen||stage.webkitRequestFullscreen||function(){}).call(stage); }
  else document.exitFullscreen&&document.exitFullscreen();
});
document.addEventListener('fullscreenchange',()=>setTimeout(layout,60));
function toggleSettings(){settingsEl.classList.toggle('open');}
document.getElementById('btnSet').addEventListener('click',toggleSettings);
document.getElementById('btnSet2').addEventListener('click',toggleSettings);
document.getElementById('setClose').addEventListener('click',()=>settingsEl.classList.remove('open'));

// progress bar seek + drag
let dragging=false;
function seekFromEvent(e){
  const r=trackEl.getBoundingClientRect();
  const cx=(e.touches?e.touches[0].clientX:e.clientX);
  seekTo(clamp((cx-r.left)/r.width,0,1)*DUR);
}
trackEl.addEventListener('pointerdown',e=>{dragging=true;trackEl.setPointerCapture(e.pointerId);seekFromEvent(e);});
trackEl.addEventListener('pointermove',e=>{if(dragging)seekFromEvent(e);});
trackEl.addEventListener('pointerup',e=>{dragging=false;});
trackEl.addEventListener('pointercancel',()=>{dragging=false;});
trackEl.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'){seekTo(storyT+1);e.preventDefault();}
  if(e.key==='ArrowLeft'){seekTo(storyT-1);e.preventDefault();}
});
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT')return;
  const k=e.key.toLowerCase();
  if(k===' '){e.preventDefault();if(mode==='title')startStory();else{if(storyT>=DUR){doRestart();setPlaying(true);}else setPlaying(!playing);}}
  else if(k==='r'){doRestart();if(mode!=='title')setPlaying(true);}
  else if(k==='c'){toggleCc();}
  else if(k==='m'){toggleSound();}
  else if(k==='f'){document.getElementById('btnFull').click();}
  else if(k==='escape'){settingsEl.classList.remove('open');}
});
// settings inputs
const vNarr=document.getElementById('vNarr'),vSfx=document.getElementById('vSfx');
vNarr.addEventListener('input',()=>{SND.narrVol=vNarr.value/100;document.getElementById('vNarrLbl').textContent=vNarr.value+'%';});
vSfx.addEventListener('input',()=>{SND.setSfxVol(vSfx.value/100);document.getElementById('vSfxLbl').textContent=vSfx.value+'%';});
document.querySelectorAll('#segCc button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#segCc button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  const on=b.dataset.v==='1'; if(on!==captionsOn)toggleCc();
}));
document.querySelectorAll('#segPx button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('#segPx button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');
  renderScale=parseInt(b.dataset.v,10);applyRenderScale();
}));
if(!NARRSYS.supported){
  document.getElementById('voiceNote').textContent='NARRATION VOICE UNAVAILABLE IN THIS BROWSER — CAPTIONS ENABLED';
}

function updateUI(force){
  const p=clamp(storyT/DUR,0,1)*100;
  fillEl.style.width='calc('+p+'% - 2px)';
  knobEl.style.left='calc('+p+'% - 2px)';
  timeEl.textContent=fmt(storyT)+' / '+fmt(DUR);
  trackEl.setAttribute('aria-valuenow',storyT.toFixed(1));
  // subtitles
  if(!captionsOn){subsEl.classList.add('hidden');return;}
  let cue=null;
  for(const c of CUES){ if(storyT>=c.t&&storyT<c.e){cue=c;break;} }
  if(cue&&mode==='play'){
    if(subText.textContent!==cue.text){subText.textContent=cue.text;}
    subsEl.classList.remove('hidden');
  }else subsEl.classList.add('hidden');
}

/* ============================================================
   SECTION 20 — STORY UPDATE + MAIN LOOP
   ============================================================ */
function updateStory(t,dt){
  // ambient particles driven by the world state
  const edge=voidEdgeAt(t);
  heroUpdate(t,dt);
  familyUpdate(t,dt);
  actors.group.x=(wife.vis&&hero.vis)?(hero.x+wife.x)/2:(hero.vis?hero.x:wife.x);
  for(const n of NPCS)npcUpdate(n,t,dt);
  updateTrees(t,dt);
  updateHouses(t);
  updateAxe(t,dt);
  updateBirds(t,dt);
  // continuous emission near the void edge
  if(t>10.2&&t<27.4&&dt>0){
    const n=Math.min(14,Math.ceil(dt*46));
    for(let k=0;k<n;k++){
      const y=-Math.random()*150;
      spawn(edge-4+Math.random()*26,y,(Math.random()-0.5)*24,-10-Math.random()*26,
        0.9+Math.random()*0.9,1.5+Math.random()*2.1,4,-58,-8);
    }
    if(Math.random()<dt*7){
      const gy=surfaceY(edge+BLOCK*2);
      if(gy!==null)spawnDebris(edge+BLOCK*2,gy-BLOCK,Math.random()<0.5?TEX.grass:TEX.dirt,BLOCK,-6-Math.random()*14,-30-Math.random()*40,(Math.random()-0.5)*3,-88);
    }
    if(Math.random()<dt*2.4)SND.disintegrate&&0;
  }
  // bridge dust
  if(t>22.4&&t<26.5&&dt>0&&Math.random()<dt*22){
    const x=CHASM0+Math.random()*(CHASM1-CHASM0);
    if(bridgeSolidAt(x))spawn(x,2,(Math.random()-0.5)*14,10+Math.random()*22,0.8,1.6,3,0,40);
  }
  updateParticles(dt);
  updateDebris(dt);
  updateLoops(t);
  checkSfx(t);
  NARRSYS.update(t,playing&&!seeking);
}
function render(dt){
  if(mode==='title'){drawTitle();return;}
  const shot=shotAt(storyT);
  if(shot.interior){
    drawInterior(storyT);
  }else{
    drawWorld(storyT,dt);
  }
  // THE END card
  if(storyT>29.05){
    ctx.setTransform(renderScale,0,0,renderScale,0,0);
    const a=easeIO(seg(storyT,29.05,29.85))*(1-easeIO(seg(storyT,29.9,30)));
    ctx.globalAlpha=clamp(a,0,1);
    ctx.fillStyle='#f3ead6';
    ctx.font='12px "Press Start 2P", monospace';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('THE END',VIEW_W/2,VIEW_H/2);
    ctx.globalAlpha=1;
  }
}
function frame(ts){
  requestAnimationFrame(frame);
  const dtReal=Math.min(0.05,(ts-lastTs)/1000||0);
  lastTs=ts;
  if(mode==='title'){ clock+=dtReal; render(dtReal); return; }
  if(playing){
    clock+=dtReal;
    storyT+=dtReal;
    if(storyT>=DUR){
      storyT=DUR;
      setPlaying(false);
      SND.stopAllLoops();NARRSYS.cancel();
      ctrlEl.classList.remove('hide');
    }
    updateStory(storyT,dtReal);
    updateCamera(storyT,dtReal);
  }else{
    // frozen: still resolve camera so paused frames are correct after seek
    updateCamera(storyT,0.0001);
  }
  updateUI();
  render(dtReal);
}

/* ---------- boot ---------- */
resetWorldState();
updateStory(0,0);
updateCamera(0,0.016);
setMode('title');
updateUI(true);
requestAnimationFrame(function first(ts){lastTs=ts;requestAnimationFrame(frame);});
})();
